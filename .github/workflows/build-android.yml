name: Build Android TWA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34" --sdk_root=$ANDROID_HOME

      - name: Generate launcher icons
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert icons/icon-512.png -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icons/icon-512.png -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icons/icon-512.png -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icons/icon-512.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icons/icon-512.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore android/release.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass baroalba2026 \
            -keypass baroalba2026 \
            -dname "CN=MultiMOVE, OU=바로알바, O=MultiMOVE Co Ltd, L=Seoul, ST=Seoul, C=KR"

      - name: Setup Gradle
        working-directory: android
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Build AAB
        working-directory: android
        env:
          KEY_PASSWORD: baroalba2026
        run: ./gradle-8.4/bin/gradle bundleRelease --no-daemon --stacktrace

      - name: Print SHA-256 fingerprint
        run: |
          echo "=== SHA-256 (assetlinks.json에 입력) ==="
          keytool -list -v \
            -keystore android/release.keystore \
            -alias android \
            -storepass baroalba2026 2>&1 | grep "SHA256:"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: baroalba-aab-v${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/release.keystore
          retention-days: 30
