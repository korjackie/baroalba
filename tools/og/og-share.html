<meta charset="utf-8">
<!--
  카카오/오픈그래프 공유 카드 원본 (1200x630).
  렌더 방법:  node tools/og/build-og.js      (헤드리스 크롬으로 PNG 로 굽는다)

  ⚠️ 색·라운드는 assets/css/style.css 의 :root 토큰과 같은 값을 쓴다.
     앱 팔레트를 바꾸면 여기도 같이 바꿔야 공유 카드만 옛날 톤으로 남지 않는다
     (2026-08-04 에 실제로 그렇게 어긋나 있었다 — 7/31 디자인 개편 전 이미지가 계속 나갔다).
  ⚠️ 1200x630 은 오픈그래프 권장비(1.91:1)이자 카카오 피드(2:1)에도 안전한 크기다.
     정사각 로고를 그대로 쓰면 카카오가 가운데 띠만 잘라 보여준다(예전 og-share.png 가 그랬다).
-->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --red: #C8102E;       /* style.css 와 동일 */
    --red-deep: #8E0B20;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Pretendard Variable', Pretendard, 'Malgun Gothic', -apple-system, sans-serif;
    background: linear-gradient(145deg, var(--red) 0%, var(--red-deep) 100%);
    color: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    position: relative; overflow: hidden;
  }
  /* 은은한 광원 — 단색 배경이 인쇄물처럼 밋밋해지는 걸 막는다 */
  body::before {
    content: ''; position: absolute; top: -260px; left: 50%;
    width: 900px; height: 900px; transform: translateX(-50%);
    background: radial-gradient(circle, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 62%);
  }
  .wrap { position: relative; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 26px; }
  .brand img { width: 78px; height: 78px; border-radius: 20px; display: block; }
  .brand .name { font-size: 40px; font-weight: 700; letter-spacing: -.5px; }
  h1 {
    font-size: 76px; font-weight: 800; line-height: 1.22;
    letter-spacing: -2px; margin-bottom: 22px;
  }
  h1 .accent { color: #FFD9DF; }
  .sub { font-size: 30px; font-weight: 500; color: rgba(255,255,255,.88); margin-bottom: 40px; }
  .chips { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .chip {
    font-size: 22px; font-weight: 600; color: #fff;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.26);
    padding: 10px 22px; border-radius: 999px;
  }
</style>
<div class="wrap">
  <div class="brand">
    <img src="../../icons/logo-mark-96.png" alt="">
    <div class="name">바로알바</div>
  </div>
  <h1>알바도, 모임도, 만남도<br><span class="accent">전부 바로 여기서</span></h1>
  <div class="sub">지도에서 바로 찾고, 바로 지원하세요</div>
  <div class="chips">
    <span class="chip">초단기 알바</span>
    <span class="chip">바로모임</span>
    <span class="chip">바로만남</span>
    <span class="chip">당일 정산</span>
  </div>
</div>
