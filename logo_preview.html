<!DOCTYPE html><html><head><meta charset='utf-8'><title>Baro Logo Preview</title><style>body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #e5e5e5; margin: 0; font-family: sans-serif; gap: 40px; } .icon-container { display: flex; flex-direction: column; align-items: center; gap: 16px; } svg { filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1)); }</style></head><body>
<div class='icon-container'>
  <h2>앱 아이콘 형태</h2>
  <svg width='300' height='300' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'>
    <!-- 앱 아이콘 배경 -->
    <rect x='0' y='0' width='200' height='200' rx='45' fill='#FFFFFF'/>
    
    <!-- 핀 -->
    <path d='M100 25 C65 25 35 55 35 95 C35 135 90 170 100 180 C110 170 165 135 165 95 C165 55 135 25 100 25 Z' fill='#D32F2F'/>
    
    <!-- 과녁 -->
    <circle cx='100' cy='90' r='42' fill='#FFFFFF'/>
    <circle cx='100' cy='90' r='28' fill='#D32F2F'/>
    <circle cx='100' cy='90' r='14' fill='#FFFFFF'/>
    
    <!-- 우측 상단 번개 (끝이 완벽하게 100,90 중앙에 고정됨) -->
    <path d='M 136 15 L 109 45 L 145 45 L 100 90 L 127 60 L 91 60 Z' fill='#1976D2'/>
  </svg>
</div>

<div class='icon-container'>
  <h2>일반 로고 형태</h2>
  <svg width='300' height='300' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'>
    <!-- 핀 -->
    <path d='M100 25 C65 25 35 55 35 95 C35 135 90 170 100 180 C110 170 165 135 165 95 C165 55 135 25 100 25 Z' fill='#D32F2F'/>
    
    <!-- 과녁 -->
    <circle cx='100' cy='90' r='42' fill='#FFFFFF'/>
    <circle cx='100' cy='90' r='28' fill='#D32F2F'/>
    <circle cx='100' cy='90' r='14' fill='#FFFFFF'/>
    
    <!-- 우측 상단 번개 (끝이 완벽하게 100,90 중앙에 고정됨) -->
    <path d='M 136 15 L 109 45 L 145 45 L 100 90 L 127 60 L 91 60 Z' fill='#1976D2'/>
  </svg>
</div>
</body></html>
