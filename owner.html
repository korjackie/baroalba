<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF4B4B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>바로알바 — 업주</title>
  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>document.write('<scr'+'ipt src="//dapi.kakao.com/v2/maps/sdk.js?appkey='+APP_CONFIG.KAKAO_JS_KEY+'&libraries=services"><\/scr'+'ipt>');</script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root { --red:#FF4B4B; --nav-h:64px; }
    body { font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; background:#f5f5f5; min-height:100vh; }

    /* ── 헤더 ── */
    .header {
      position: sticky; top:0; z-index:100;
      background:#fff; padding:14px 16px 12px;
      border-bottom:1px solid #f0f0f0;
      box-shadow:0 1px 8px rgba(0,0,0,0.06);
      display:flex; align-items:center; justify-content:space-between;
    }
    .header-left { display:flex; align-items:center; gap:10px; }
    .header-logo { font-size:20px; font-weight:900; color:var(--red); letter-spacing:-0.5px; }
    .header-badge { font-size:11px; font-weight:700; background:#FFF0F0; color:var(--red); padding:3px 8px; border-radius:8px; }
    .header-biz { font-size:13px; color:#555; font-weight:600; }
    .logout-btn { font-size:12px; color:#aaa; background:none; border:none; cursor:pointer; padding:6px; }

    /* ── 탭 ── */
    .tabs { display:flex; background:#fff; border-bottom:1px solid #f0f0f0; }
    .tab-btn {
      flex:1; padding:14px 0; font-size:14px; font-weight:700; color:#bbb;
      border:none; background:none; cursor:pointer; border-bottom:2.5px solid transparent;
      transition:all 0.2s;
    }
    .tab-btn.active { color:var(--red); border-bottom-color:var(--red); }

    /* ── 컨텐츠 ── */
    .tab-content { display:none; padding:16px; padding-bottom:calc(var(--nav-h) + 80px); }
    .tab-content.active { display:block; }

    /* ── 통계 카드 ── */
    .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
    .stat-card { background:#fff; border-radius:14px; padding:14px; text-align:center; box-shadow:0 1px 6px rgba(0,0,0,0.06); }
    .stat-val { font-size:22px; font-weight:900; color:var(--red); }
    .stat-label { font-size:11px; color:#aaa; font-weight:600; margin-top:2px; }

    /* ── 섹션 헤더 ── */
    .section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .section-title { font-size:15px; font-weight:800; color:#222; }

    /* ── 공고 카드 ── */
    .posting-card {
      background:#fff; border-radius:16px; padding:16px;
      margin-bottom:12px; box-shadow:0 1px 6px rgba(0,0,0,0.06);
      position:relative; overflow:hidden;
    }
    .posting-card.urgent-card { border-left:4px solid var(--red); }
    .posting-card.closed-card { opacity:0.6; }

    .posting-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
    .posting-title { font-size:16px; font-weight:800; color:#222; margin-bottom:3px; }
    .posting-cat { font-size:11px; color:#aaa; font-weight:600; }
    .posting-wage { text-align:right; }
    .wage-val { font-size:18px; font-weight:900; color:var(--red); }
    .wage-base { font-size:10px; color:#ccc; }

    .posting-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .meta-chip {
      font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px;
      background:#f5f5f5; color:#666;
    }
    .meta-chip.urgent { background:#FFF0F0; color:var(--red); }
    .meta-chip.open { background:#EFF6FF; color:#3B82F6; }
    .meta-chip.closed { background:#f0f0f0; color:#aaa; }

    .posting-actions { display:flex; gap:8px; }
    .surge-btn {
      flex:1; padding:10px; background:linear-gradient(135deg,#FF9500,#FFB800);
      color:#fff; border:none; border-radius:12px; font-size:13px; font-weight:800;
      cursor:pointer; transition:transform 0.1s;
    }
    .surge-btn:active { transform:scale(0.97); }
    .surge-btn:disabled { background:#e0e0e0; color:#aaa; cursor:default; }
    .edit-btn {
      padding:10px 14px; background:#f5f5f5; color:#555;
      border:none; border-radius:12px; font-size:13px; font-weight:700;
      cursor:pointer;
    }
    .toggle-btn {
      padding:10px 14px; border:none; border-radius:12px; font-size:13px; font-weight:700; cursor:pointer;
    }
    .toggle-btn.open  { background:#EFF6FF; color:#3B82F6; }
    .toggle-btn.close { background:#f0f0f0; color:#888; }

    .applicant-count {
      display:flex; align-items:center; gap:4px;
      font-size:12px; font-weight:700; color:#555; margin-bottom:8px;
      cursor:pointer;
    }
    .applicant-count .count-badge {
      background:var(--red); color:#fff; font-size:10px; font-weight:800;
      padding:1px 6px; border-radius:10px;
    }

    /* ── FAB ── */
    .fab {
      position:fixed; right:20px; bottom:calc(var(--nav-h) + 16px);
      width:56px; height:56px; border-radius:50%;
      background:var(--red); color:#fff; border:none;
      font-size:28px; font-weight:300; cursor:pointer;
      box-shadow:0 4px 16px rgba(255,75,75,0.4);
      display:flex; align-items:center; justify-content:center;
      z-index:200; transition:transform 0.2s;
    }
    .fab:active { transform:scale(0.93); }

    /* ── 공고 등록 바텀시트 ── */
    .sheet-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.45); z-index:500; align-items:flex-end;
    }
    .sheet-overlay.open { display:flex; }
    .form-sheet {
      background:#fff; border-radius:24px 24px 0 0; width:100%;
      max-height:90vh; overflow-y:auto; padding:0 0 40px;
      animation:slideUp 0.3s ease;
    }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .sheet-head {
      padding:14px 20px 12px; border-bottom:1px solid #f0f0f0;
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; background:#fff; z-index:1;
    }
    .sheet-title { font-size:17px; font-weight:800; color:#222; }
    .sheet-close { font-size:22px; color:#aaa; background:none; border:none; cursor:pointer; }

    .form-body { padding:20px; display:flex; flex-direction:column; gap:16px; }
    .form-row { display:flex; gap:10px; }
    .form-row .form-group { flex:1; }
    .form-group { display:flex; flex-direction:column; gap:6px; }
    .form-label { font-size:12px; font-weight:700; color:#888; }
    .form-input, .form-select, .form-textarea {
      padding:12px 14px; border:1.5px solid #eee; border-radius:12px;
      font-size:14px; color:#222; outline:none; background:#fafafa;
      transition:border-color 0.2s; font-family:inherit;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color:var(--red); background:#fff;
    }
    .form-textarea { resize:none; height:80px; line-height:1.5; }

    /* 위치 검색 */
    .location-search { display:flex; gap:8px; }
    .location-search .form-input { flex:1; }
    .search-addr-btn {
      padding:12px 16px; background:var(--red); color:#fff;
      border:none; border-radius:12px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;
    }
    #mini-map { width:100%; height:160px; border-radius:12px; margin-top:8px; display:none; }
    .location-result {
      font-size:12px; color:#3B82F6; font-weight:700; padding:6px 0; display:none;
    }

    .submit-btn {
      width:100%; padding:16px; background:var(--red); color:#fff;
      border:none; border-radius:14px; font-size:16px; font-weight:900; cursor:pointer;
      margin-top:4px; transition:background 0.15s;
    }
    .submit-btn:hover { background:#e03333; }
    .submit-btn:disabled { background:#ddd; cursor:default; }

    /* ── 지원자 시트 ── */
    .applicant-card {
      background:#f8f8f8; border-radius:14px; padding:14px;
      margin-bottom:10px; display:flex; align-items:center; gap:12px;
    }
    .applicant-avatar { width:44px; height:44px; border-radius:50%; background:#FFE0E0; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
    .applicant-info { flex:1; }
    .applicant-name { font-size:14px; font-weight:800; color:#222; }
    .applicant-meta { font-size:11px; color:#aaa; font-weight:600; margin-top:2px; }
    .applicant-btns { display:flex; gap:6px; }
    .accept-btn { padding:7px 12px; background:#E6FBF4; color:#10B981; border:none; border-radius:10px; font-size:12px; font-weight:800; cursor:pointer; }
    .reject-btn { padding:7px 12px; background:#FFF0F0; color:var(--red); border:none; border-radius:10px; font-size:12px; font-weight:800; cursor:pointer; }
    .accepted-badge { font-size:11px; font-weight:800; color:#10B981; background:#E6FBF4; padding:4px 10px; border-radius:8px; }
    .rejected-badge { font-size:11px; font-weight:800; color:#aaa; background:#f0f0f0; padding:4px 10px; border-radius:8px; }

    /* ── 빈 상태 ── */
    .empty { text-align:center; padding:48px 20px; color:#ccc; }
    .empty-icon { font-size:48px; margin-bottom:12px; }
    .empty-txt { font-size:14px; font-weight:600; }

    /* ── 로딩 ── */
    .spinner { width:32px; height:32px; border:3px solid #eee; border-top-color:var(--red); border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── 토스트 ── */
    .toast { position:fixed; bottom:calc(var(--nav-h)+20px); left:50%; transform:translateX(-50%); background:#222; color:#fff; font-size:13px; font-weight:700; padding:10px 18px; border-radius:20px; z-index:9999; white-space:nowrap; transition:opacity 0.3s; pointer-events:none; }
    .toast.hidden { opacity:0; }

    /* ── 하단 내비 ── */
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; height:var(--nav-h); background:#fff; border-top:1px solid #f0f0f0; display:flex; z-index:400; box-shadow:0 -2px 12px rgba(0,0,0,0.06); }
    .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; border:none; background:none; }
    .nav-icon { font-size:22px; }
    .nav-label { font-size:10px; font-weight:700; color:#bbb; }
    .nav-item.active .nav-label { color:var(--red); }
  </style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <div class="header-left">
    <div class="header-logo">⚡ 바로알바</div>
    <div class="header-badge">업주</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="header-biz" id="biz-name">내 업체</div>
    <button class="logout-btn" onclick="logout()">로그아웃</button>
  </div>
</div>

<!-- 탭 -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('postings', this)">📋 내 공고</button>
  <button class="tab-btn" onclick="switchTab('applicants', this)">👥 지원자</button>
</div>

<!-- 내 공고 탭 -->
<div class="tab-content active" id="tab-postings">
  <!-- 통계 -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="stat-open">-</div>
      <div class="stat-label">모집중</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-applicants">-</div>
      <div class="stat-label">총 지원자</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-accepted">-</div>
      <div class="stat-label">확정</div>
    </div>
  </div>

  <div class="section-head">
    <div class="section-title">내 공고 목록</div>
  </div>
  <div id="postings-list"><div style="text-align:center;padding:32px"><div class="spinner"></div></div></div>
</div>

<!-- 지원자 탭 -->
<div class="tab-content" id="tab-applicants">
  <div class="section-head">
    <div class="section-title">전체 지원자</div>
  </div>
  <div id="applicants-list"><div style="text-align:center;padding:32px"><div class="spinner"></div></div></div>
</div>

<!-- FAB -->
<button class="fab" onclick="openPostingForm()" title="공고 등록">+</button>

<!-- 공고 등록/수정 폼 시트 -->
<div class="sheet-overlay" id="form-overlay" onclick="closeFormIfBg(event)">
  <div class="form-sheet" id="form-sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="form-title">공고 등록</div>
      <button class="sheet-close" onclick="closePostingForm()">✕</button>
    </div>
    <div class="form-body">
      <input type="hidden" id="editing-id">

      <div class="form-group">
        <label class="form-label">직무명 *</label>
        <input class="form-input" id="f-title" placeholder="예: 홀 서빙 보조, 물류 입출고">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">업종 *</label>
          <select class="form-select" id="f-category">
            <option value="">불러오는 중...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">필요 인원</label>
          <input class="form-input" id="f-needed" type="number" min="1" value="1">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">시급 (원) *</label>
        <input class="form-input" id="f-wage" type="number" min="9860" placeholder="10000">
      </div>

      <div class="form-group">
        <label class="form-label">시작 시간 *</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input class="form-input" id="f-start-date" type="date" style="flex:1.6;min-width:0">
          <select class="form-select" id="f-start-hour" style="flex:1;min-width:0"></select>
          <select class="form-select" id="f-start-min" style="flex:0.9;min-width:0"></select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">종료 시간 *</label>
        <div style="display:flex;gap:8px;align-items:center">
          <select class="form-select" id="f-end-hour" style="flex:1;min-width:0"></select>
          <select class="form-select" id="f-end-min" style="flex:0.9;min-width:0"></select>
          <span id="f-duration-display" style="font-size:13px;color:#888;white-space:nowrap;min-width:36px;text-align:right"></span>
        </div>
      </div>

      <!-- ⚡ 번개 알바 설정 -->
      <div class="form-group">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px;background:#FFFBF0;border:1.5px solid #FFE082;border-radius:14px;cursor:pointer" onclick="toggleSurge()">
          <div>
            <div style="font-size:14px;font-weight:800;color:#E65100">⚡ 번개 알바 모드</div>
            <div style="font-size:11px;color:#888;margin-top:2px">미충원 시 시급 자동 인상 예고 — 알바생 긴장감 ↑</div>
          </div>
          <div id="surge-toggle" style="width:44px;height:24px;background:#ddd;border-radius:12px;position:relative;transition:background 0.2s">
            <div style="position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,0.2);transition:left 0.2s" id="surge-knob"></div>
          </div>
        </div>
        <input type="hidden" id="f-surge-enabled" value="false">

        <div id="surge-settings" style="display:none;margin-top:10px;background:#f8f8f8;border-radius:14px;padding:14px;display:none">
          <div class="form-row" style="margin-bottom:10px">
            <div class="form-group">
              <label class="form-label">최대 시급 (원)</label>
              <input class="form-input" id="f-surge-max" type="number" placeholder="15000">
            </div>
            <div class="form-group">
              <label class="form-label">인상 금액</label>
              <select class="form-select" id="f-surge-amount">
                <option value="500">+500원</option>
                <option value="1000" selected>+1,000원</option>
                <option value="2000">+2,000원</option>
                <option value="3000">+3,000원</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">인상 주기</label>
            <select class="form-select" id="f-surge-interval">
              <option value="10">10분마다</option>
              <option value="15">15분마다</option>
              <option value="30" selected>30분마다</option>
              <option value="60">1시간마다</option>
            </select>
          </div>
          <div style="font-size:11px;color:#FF9500;font-weight:600;margin-top:8px" id="surge-preview"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">위치 *</label>

        <!-- 방법 1: 텍스트 검색 -->
        <div class="location-search">
          <input class="form-input" id="f-address" placeholder="시·구·업체명 입력 (예: 부산 사하구 스타벅스)">
          <button class="search-addr-btn" onclick="searchNaverPlace()">🔍 검색</button>
        </div>

        <!-- 방법 2: 네이버 플레이스 URL -->
        <div style="display:flex;align-items:center;gap:6px;margin-top:8px">
          <input class="form-input" id="f-naver-url-input" placeholder="또는 네이버 플레이스 URL 붙여넣기" oninput="handleNaverUrl(this.value)" style="flex:1;font-size:13px">
        </div>
        <div id="naver-url-status" style="font-size:11px;font-weight:700;padding:4px 2px;display:none"></div>

        <!-- 검색 결과 목록 -->
        <div id="place-results" style="display:none;background:#f8f8f8;border-radius:12px;margin-top:6px;overflow:hidden;"></div>
        <div class="location-result" id="location-result"></div>
        <div id="mini-map"></div>
        <input type="hidden" id="f-lat">
        <input type="hidden" id="f-lng">
        <input type="hidden" id="f-naver-link">
      </div>

      <div class="form-group">
        <label class="form-label">상세 설명</label>
        <textarea class="form-textarea" id="f-desc" placeholder="업무 내용, 우대사항, 제공 혜택 등"></textarea>
      </div>

      <button class="submit-btn" id="submit-btn" onclick="submitPosting()">공고 등록하기</button>
    </div>
  </div>
</div>

<!-- 하단 내비 -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="setNav(this,'postings')">
    <div class="nav-icon">📋</div>
    <div class="nav-label">내 공고</div>
  </button>
  <button class="nav-item" onclick="setNav(this,'applicants')">
    <div class="nav-icon">👥</div>
    <div class="nav-label">지원자</div>
  </button>
  <button class="nav-item" onclick="setNav(this,'map')">
    <div class="nav-icon">🗺</div>
    <div class="nav-label">지도보기</div>
  </button>
  <button class="nav-item" onclick="setNav(this,'settings')">
    <div class="nav-icon">⚙️</div>
    <div class="nav-label">설정</div>
  </button>
</div>

<!-- 설정 시트 -->
<div class="modal-overlay" id="settings-overlay" onclick="if(event.target===this)this.classList.remove('open')">
  <div style="background:#fff;border-radius:24px 24px 0 0;width:100%;padding:0 0 40px;animation:slideUp 0.3s ease">
    <div style="padding:14px 20px 12px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:17px;font-weight:800;color:#222">계정 설정</div>
      <button onclick="document.getElementById('settings-overlay').classList.remove('open')" style="font-size:22px;color:#aaa;background:none;border:none;cursor:pointer">✕</button>
    </div>
    <div style="padding:16px 20px;display:flex;flex-direction:column;gap:10px">
      <!-- 내 정보 -->
      <div style="background:#f8f8f8;border-radius:14px;padding:14px">
        <div style="font-size:12px;color:#aaa;font-weight:700;margin-bottom:4px">업주 계정</div>
        <div style="font-size:15px;font-weight:800;color:#222" id="settings-name">-</div>
        <div style="font-size:12px;color:#aaa;margin-top:2px" id="settings-email">-</div>
      </div>
      <!-- 비밀번호 변경 -->
      <button onclick="toggleOwnerPwForm()" style="width:100%;padding:14px;background:#f5f5f5;color:#555;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;text-align:left">🔑 비밀번호 변경</button>
      <div id="owner-pw-form" style="display:none;padding:14px;background:#f8f8f8;border-radius:14px">
        <input id="owner-new-pw" type="password" placeholder="새 비밀번호 (6자 이상)" style="width:100%;padding:11px 12px;border:1.5px solid #eee;border-radius:10px;font-size:14px;margin-bottom:8px;outline:none">
        <input id="owner-new-pw2" type="password" placeholder="비밀번호 확인" style="width:100%;padding:11px 12px;border:1.5px solid #eee;border-radius:10px;font-size:14px;margin-bottom:10px;outline:none">
        <button onclick="submitOwnerPw()" style="width:100%;padding:12px;background:#FF4B4B;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer">변경하기</button>
      </div>
      <button onclick="logout()" style="width:100%;padding:14px;background:#f5f5f5;color:#555;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;text-align:left">🚪 로그아웃</button>
      <div style="height:1px;background:#f0f0f0"></div>
      <button onclick="deleteOwnerAccount()" style="width:100%;padding:14px;background:#FFF0F0;color:#FF4B4B;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;text-align:left">⚠️ 회원 탈퇴</button>

      <!-- 어드민 전용: 업종 카테고리 관리 -->

        <div style="font-size:12px;font-weight:700;color:#888;margin-bottom:8px">🔧 어드민 — 업종 카테고리 관리</div>
        <div id="admin-cat-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px"></div>
        <div style="display:flex;gap:8px">
          <input id="admin-cat-icon" type="text" placeholder="아이콘" style="width:48px;padding:10px;border:1.5px solid #eee;border-radius:10px;font-size:16px;text-align:center;outline:none">
          <input id="admin-cat-name" type="text" placeholder="카테고리명" style="flex:1;padding:10px 12px;border:1.5px solid #eee;border-radius:10px;font-size:14px;outline:none">
          <button onclick="addCategory()" style="padding:10px 16px;background:var(--red);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap">추가</button>
        </div>

</div>

<div class="modal-overlay" id="share-overlay" onclick="if(event.target===this)this.classList.remove('open')" style="z-index:600">

    <div style="padding:14px 20px 12px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between">

        <button onclick="copyShareUrl()" style="flex:1;padding:14px;background:#f5f5f5;color:#333;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer">📋 링크 복사</button>
        <button onclick="shareKakao()" style="flex:1;padding:14px;background:#FEE500;color:#3C1E1E;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer">💬 카카오톡</button>
      </div>
      <button onclick="shareNative()" id="share-native-btn" style="width:100%;padding:14px;background:var(--red);color:#fff;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer">↗ 더 보내기 (SNS/문자)</button>
    </div>
  </div>

<!-- 토스트 -->
<div class="toast hidden" id="toast"></div>

<script>
const { createClient } = supabase;
const db = createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);

let currentUser = null;
let bizRecord = null;
let miniMap = null;
let selectedLatLng = null;
let postings = [];
let editingId = null;

// ── 초기화 ──────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  buildTimeSelects();
  loadCategories();
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = '/login.html'; return; }
  currentUser = session.user;

  // 업주 레코드 조회
  const { data: biz } = await db.from('businesses')
    .select('*').eq('kakao_uid', currentUser.id).single();

  if (!biz) { showToast('업주 프로필이 없습니다. 로그인을 다시 해주세요.'); return; }
  bizRecord = biz;
  document.getElementById('biz-name').textContent = biz.name;

  loadPostings();
  loadApplicants();
  setupRealtime();
});

// ── 내 공고 불러오기 ─────────────────────────────────────
async function loadPostings() {
  const { data, error } = await db
    .from('job_postings')
    .select('*')
    .eq('business_id', bizRecord.id)
    .order('created_at', { ascending: false });

  if (error) { showToast('공고 불러오기 실패'); return; }
  postings = data || [];
  renderPostings();
  updateStats();
}

function renderPostings() {
  const el = document.getElementById('postings-list');
  if (!postings.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📝</div><div class="empty-txt">등록한 공고가 없어요<br>+ 버튼을 눌러 첫 공고를 올려보세요</div></div>';
    return;
  }
  el.innerHTML = postings.map(p => {
    const isOpen = p.status === 'open' || p.status === 'urgent';
    const surge = p.current_wage - p.base_wage;
    const statusLabel = p.status === 'urgent' ? '🔥 급구' : p.status === 'open' ? '모집중' : '마감';
    const statusCls = p.status === 'urgent' ? 'urgent' : p.status === 'open' ? 'open' : 'closed';
    const start = p.start_time ? formatTime(p.start_time) : '미정';

    return `
    <div class="posting-card ${p.status === 'urgent' ? 'urgent-card' : ''} ${!isOpen ? 'closed-card' : ''}">
      <div class="posting-top">
        <div>
          <div class="posting-title">${p.title}</div>
          <div class="posting-cat">${p.category}</div>
        </div>
        <div class="posting-wage">
          <div class="wage-val">${p.current_wage.toLocaleString()}원</div>
          ${surge > 0 ? `<div style="font-size:10px;color:#FF9500;font-weight:700">↑${surge.toLocaleString()}원</div>` : ''}
          <div class="wage-base">${surge !== 0 ? '기본 '+p.base_wage.toLocaleString()+'원' : ''}</div>
        </div>
      </div>
      <div class="posting-meta">
        <span class="meta-chip ${statusCls}">${statusLabel}</span>
        <span class="meta-chip">⏰ ${start}</span>
        <span class="meta-chip">⏱ ${p.duration_hours ?? '-'}시간</span>
        <span class="meta-chip">👥 ${p.filled_count ?? 0}/${p.needed_count ?? 1}명</span>
      </div>
      <div class="applicant-count" onclick="showPostingApplicants('${p.id}','${p.title}')">
        지원자 보기 <span class="count-badge" id="app-count-${p.id}">...</span> →
      </div>
      <div class="posting-actions">
        ${isOpen ? `
          <button class="surge-btn" onclick="surgeWage('${p.id}',${p.current_wage})" ${p.status==='closed'?'disabled':''}>
            ⚡ 시급 +1,000원
          </button>
        ` : ''}
        <button class="edit-btn" onclick="openShareModal('${p.id}')">공유</button>
        <button class="edit-btn" onclick="openEditForm('${p.id}')">수정</button>
        <button class="toggle-btn ${isOpen?'close':'open'}" onclick="toggleStatus('${p.id}','${p.status}')">
          ${isOpen ? '마감' : '재오픈'}
        </button>
      </div>
    </div>`;
  }).join('');

  // 지원자 수 비동기 로드
  postings.forEach(p => loadApplicantCount(p.id));
}

async function loadApplicantCount(jobId) {
  const { count } = await db.from('applications')
    .select('id', { count: 'exact', head: true })
    .eq('job_posting_id', jobId);
  const el = document.getElementById(`app-count-${jobId}`);
  if (el) el.textContent = count || 0;
}

async function updateStats() {
  const open = postings.filter(p => p.status === 'open' || p.status === 'urgent').length;
  document.getElementById('stat-open').textContent = open;

  const { count: total } = await db.from('applications')
    .select('id', { count: 'exact', head: true })
    .in('job_posting_id', postings.map(p => p.id));
  document.getElementById('stat-applicants').textContent = total || 0;

  const { count: accepted } = await db.from('applications')
    .select('id', { count: 'exact', head: true })
    .in('job_posting_id', postings.map(p => p.id))
    .eq('status', 'accepted');
  document.getElementById('stat-accepted').textContent = accepted || 0;
}

// ── 시급 서지 ─────────────────────────────────────────────
async function surgeWage(jobId, currentWage) {
  const newWage = currentWage + 1000;
  const { error } = await db.from('job_postings')
    .update({ current_wage: newWage, status: 'urgent' })
    .eq('id', jobId);
  if (error) { showToast('시급 인상 실패: ' + error.message); return; }
  showToast(`⚡ 시급 ${newWage.toLocaleString()}원으로 인상!`);
  loadPostings();
}

// ── 상태 토글 ─────────────────────────────────────────────
async function toggleStatus(jobId, currentStatus) {
  const isOpen = currentStatus === 'open' || currentStatus === 'urgent';
  const newStatus = isOpen ? 'closed' : 'open';
  const { error } = await db.from('job_postings').update({ status: newStatus }).eq('id', jobId);
  if (error) { showToast('상태 변경 실패'); return; }
  showToast(isOpen ? '공고가 마감됐습니다' : '공고가 재오픈됐습니다');
  loadPostings();
}

// ── 지원자 불러오기 ──────────────────────────────────────
async function loadApplicants() {
  if (!bizRecord || !postings.length) return;
  const jobIds = postings.map(p => p.id);
  if (!jobIds.length) {
    document.getElementById('applicants-list').innerHTML =
      '<div class="empty"><div class="empty-icon">👥</div><div class="empty-txt">지원자가 없어요</div></div>';
    return;
  }

  const { data, error } = await db.from('applications')
    .select('*, workers(name, phone, rating, review_count, skills), job_postings(title)')
    .in('job_posting_id', jobIds)
    .order('applied_at', { ascending: false });

  if (error) { showToast('지원자 불러오기 실패'); return; }
  renderApplicants(data || []);
}

function renderApplicants(apps) {
  const el = document.getElementById('applicants-list');
  if (!apps.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">👥</div><div class="empty-txt">아직 지원자가 없어요</div></div>';
    return;
  }
  el.innerHTML = apps.map(a => {
    const w = a.workers;
    const statusHtml = a.status === 'accepted'
      ? '<span class="accepted-badge">✅ 수락</span>'
      : a.status === 'rejected'
      ? '<span class="rejected-badge">거절됨</span>'
      : `<div class="applicant-btns">
          <button class="accept-btn" onclick="updateApplication('${a.id}','accepted')">수락</button>
          <button class="reject-btn" onclick="updateApplication('${a.id}','rejected')">거절</button>
        </div>`;
    return `
    <div class="applicant-card">
      <div class="applicant-avatar">👤</div>
      <div class="applicant-info">
        <div class="applicant-name">${w?.name || '이름없음'}</div>
        <div class="applicant-meta">
          ★ ${w?.rating || '-'} · ${a.job_postings?.title || ''}
          ${w?.phone ? ' · ' + w.phone : ''}
        </div>
      </div>
      ${statusHtml}
    </div>`;
  }).join('');
}

async function showPostingApplicants(jobId, title) {
  const { data } = await db.from('applications')
    .select('*, workers(name, phone, rating)')
    .eq('job_posting_id', jobId)
    .order('applied_at', { ascending: false });
  switchTab('applicants', document.querySelectorAll('.tab-btn')[1]);
  renderApplicants(data || []);
}

async function updateApplication(appId, status) {
  const { error } = await db.from('applications').update({ status }).eq('id', appId);
  if (error) { showToast('처리 실패'); return; }
  showToast(status === 'accepted' ? '✅ 수락했습니다' : '거절했습니다');
  loadApplicants();
  loadPostings();
}

// ── 공고 등록/수정 폼 ────────────────────────────────────
function openPostingForm() {
  editingId = null;
  document.getElementById('editing-id').value = '';
  document.getElementById('form-title').textContent = '공고 등록';
  document.getElementById('submit-btn').textContent = '공고 등록하기';
  document.getElementById('f-title').value = '';
  document.getElementById('f-category').value = 'F&B';
  document.getElementById('f-wage').value = '';
  document.getElementById('f-needed').value = 1;
  document.getElementById('f-desc').value = '';
  document.getElementById('f-address').value = '';
  document.getElementById('f-lat').value = '';
  document.getElementById('f-lng').value = '';
  document.getElementById('location-result').style.display = 'none';
  document.getElementById('mini-map').style.display = 'none';

  const now = new Date();
  const roundMin = Math.ceil(now.getMinutes() / 5) * 5;
  now.setMinutes(roundMin === 60 ? 0 : roundMin, 0, 0);
  if (roundMin === 60) now.setHours(now.getHours() + 1);
  now.setHours(now.getHours() + 1);
  setTimeSelects('start', now);
  const end = new Date(now.getTime() + 4 * 3600000);
  setTimeSelects('end', end);

  document.getElementById('naver-url-status').style.display = 'none';
  document.getElementById('f-naver-url-input').value = '';
  // surge 초기화
  surgeOn = false;
  document.getElementById('f-surge-enabled').value = 'false';
  document.getElementById('surge-toggle').style.background = '#ddd';
  document.getElementById('surge-knob').style.left = '2px';
  document.getElementById('surge-settings').style.display = 'none';
  document.getElementById('surge-preview').textContent = '';
  document.getElementById('form-overlay').classList.add('open');
}

function openEditForm(jobId) {
  const p = postings.find(x => x.id === jobId);
  if (!p) return;
  editingId = jobId;
  document.getElementById('editing-id').value = jobId;
  document.getElementById('form-title').textContent = '공고 수정';
  document.getElementById('submit-btn').textContent = '수정 완료';
  document.getElementById('f-title').value = p.title;
  document.getElementById('f-category').value = p.category;
  document.getElementById('f-wage').value = p.base_wage;
  document.getElementById('f-needed').value = p.needed_count;
  document.getElementById('f-desc').value = p.description || '';
  document.getElementById('f-lat').value = p.lat;
  document.getElementById('f-lng').value = p.lng;
  if (p.start_time) {
    const s = new Date(p.start_time);
    setTimeSelects('start', s);
    const endMs = p.end_time ? new Date(p.end_time) : new Date(s.getTime() + (p.duration_hours || 4) * 3600000);
    setTimeSelects('end', endMs);
  }
  if (p.lat && p.lng) showMiniMap(p.lat, p.lng, p.address || '');
  document.getElementById('form-overlay').classList.add('open');
}

function closePostingForm() { document.getElementById('form-overlay').classList.remove('open'); }
function closeFormIfBg(e) { if (e.target === document.getElementById('form-overlay')) closePostingForm(); }

// ── 네이버 플레이스 URL 감지 ─────────────────────────────
function handleNaverUrl(val) {
  const status = document.getElementById('naver-url-status');
  const isNaverUrl = /naver\.me|map\.naver\.com|m\.place\.naver\.com/.test(val);
  if (!val) { status.style.display = 'none'; document.getElementById('f-naver-link').value = ''; return; }
  if (isNaverUrl) {
    document.getElementById('f-naver-link').value = val;
    status.textContent = '✅ 네이버 플레이스 URL 인식됨 — 위 검색창에서 업체명도 검색해 좌표를 설정해주세요';
    status.style.cssText = 'display:block;color:#1a7d3b;font-size:11px;font-weight:700;padding:4px 2px';
  } else {
    status.textContent = '⚠️ 네이버 플레이스 URL 형식이 아닙니다';
    status.style.cssText = 'display:block;color:#FF9500;font-size:11px;font-weight:700;padding:4px 2px';
  }
}

// ── 네이버 플레이스 검색 ─────────────────────────────────
async function searchNaverPlace() {
  const query = document.getElementById('f-address').value.trim();
  if (!query) { showToast('시·구·업체명을 입력해주세요\n예: 부산 사하구 스타벅스'); return; }

  const btn = document.querySelector('.search-addr-btn');
  btn.textContent = '검색 중...'; btn.disabled = true;

  try {
    const res = await fetch(`/api/naver-search?query=${encodeURIComponent(query)}`);
    const data = await res.json();
    if (!res.ok || !data.items?.length) {
      searchKakaoFallback(query);
      return;
    }
    renderPlaceResults(data.items, query);
  } catch(e) {
    searchKakaoFallback(query);
  } finally {
    btn.textContent = '🔍 검색'; btn.disabled = false;
  }
}

function renderPlaceResults(items, usedQuery) {
  const box = document.getElementById('place-results');
  box.style.display = 'block';
  const header = usedQuery ? `<div style="padding:8px 14px;font-size:11px;color:#888;border-bottom:1px solid #eee">"${usedQuery}" 검색 결과 ${items.length}개</div>` : '';
  box.innerHTML = header + items.map((item, i) => `
    <div onclick="selectPlace(${i})" data-idx="${i}" style="padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer;transition:background 0.1s;" onmouseover="this.style.background='#fff'" onmouseout="this.style.background=''">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
        <span style="font-size:13px;font-weight:800;color:#222">${item.title}</span>
        ${item.link ? '<span style="font-size:10px;font-weight:700;background:#E6F4EA;color:#1a7d3b;padding:2px 6px;border-radius:6px">N 플레이스</span>' : ''}
      </div>
      <div style="font-size:11px;color:#aaa">${item.roadAddress || item.address}</div>
    </div>`).join('');

  // 전역 임시 저장
  window._naverPlaceItems = items;
}

function selectPlace(idx) {
  const item = window._naverPlaceItems[idx];
  document.getElementById('f-lat').value = item.lat;
  document.getElementById('f-lng').value = item.lng;
  document.getElementById('f-naver-link').value = item.link || '';
  document.getElementById('f-address').value = item.title;
  document.getElementById('location-result').textContent = `📍 ${item.roadAddress || item.address}`;
  document.getElementById('location-result').style.display = 'block';
  document.getElementById('place-results').style.display = 'none';
  if (item.link) {
    document.getElementById('location-result').textContent += '  ✅ 네이버 플레이스 인증';
  }
  showMiniMap(item.lat, item.lng);
}

function searchKakaoFallback(query) {
  const geocoder = new kakao.maps.services.Geocoder();
  geocoder.addressSearch(query, (result, status) => {
    if (status === kakao.maps.services.Status.OK && result.length > 0) {
      const r = result[0];
      document.getElementById('f-lat').value = r.y;
      document.getElementById('f-lng').value = r.x;
      document.getElementById('location-result').textContent = '📍 ' + r.address_name;
      document.getElementById('location-result').style.display = 'block';
      document.getElementById('place-results').style.display = 'none';
      showMiniMap(parseFloat(r.y), parseFloat(r.x));
    } else {
      showToast('장소를 찾을 수 없어요. 다시 입력해주세요.');
    }
  });
}

function showMiniMap(lat, lng, addr) {
  const el = document.getElementById('mini-map');
  el.style.display = 'block';
  const pos = new kakao.maps.LatLng(lat, lng);
  if (!miniMap) {
    miniMap = new kakao.maps.Map(el, { center: pos, level: 4 });
  } else {
    miniMap.setCenter(pos);
  }
  new kakao.maps.Marker({ position: pos, map: miniMap });
}

// ── 공고 제출 ─────────────────────────────────────────────
async function submitPosting() {
  const title = document.getElementById('f-title').value.trim();
  const category = document.getElementById('f-category').value;
  const wage = parseInt(document.getElementById('f-wage').value);
  const needed = parseInt(document.getElementById('f-needed').value);
  const lat = parseFloat(document.getElementById('f-lat').value);
  const lng = parseFloat(document.getElementById('f-lng').value);
  const desc = document.getElementById('f-desc').value.trim();
  const startTime = getTimeValue('start');
  const endTime = getTimeValue('end');
  const duration = startTime && endTime ? Math.round((endTime - startTime) / 360000) / 10 : null;

  if (!title) { showToast('직무명을 입력해주세요'); return; }
  if (!wage || wage < 9860) { showToast('시급은 최저임금(9,860원) 이상이어야 해요'); return; }
  if (!startTime) { showToast('시작 시간을 입력해주세요'); return; }
  if (!endTime || endTime <= startTime) { showToast('종료 시간은 시작 시간보다 늦어야 해요'); return; }
  if (!lat || !lng) { showToast('위치를 검색해서 선택해주세요'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '처리 중...';

  const surgeEnabled  = document.getElementById('f-surge-enabled').value === 'true';
  const surgeMax      = parseInt(document.getElementById('f-surge-max').value) || null;
  const surgeAmount   = parseInt(document.getElementById('f-surge-amount').value) || 1000;
  const surgeInterval = parseInt(document.getElementById('f-surge-interval').value) || 30;

  const payload = {
    business_id: bizRecord.id,
    title, category, description: desc,
    base_wage: editingId ? undefined : wage,
    current_wage: wage,
    lat, lng,
    duration_hours: duration,
    needed_count: needed || 1,
    start_time: startTime ? startTime.toISOString() : null,
    status: surgeEnabled ? 'urgent' : 'open',
    surge_enabled:      surgeEnabled,
    surge_max_wage:     surgeEnabled ? (surgeMax || wage + surgeAmount * 3) : null,
    surge_amount:       surgeEnabled ? surgeAmount : null,
    surge_interval_min: surgeEnabled ? surgeInterval : null,
  };

  let error;
  if (editingId) {
    delete payload.base_wage;
    delete payload.business_id;
    ({ error } = await db.from('job_postings').update(payload).eq('id', editingId));
  } else {
    payload.base_wage = wage;
    ({ error } = await db.from('job_postings').insert(payload));
  }

  btn.disabled = false;
  btn.textContent = editingId ? '수정 완료' : '공고 등록하기';

  if (error) { showToast('오류: ' + error.message); return; }
  closePostingForm();
  loadPostings();
  if (!editingId) {
    // 새 공고 등록 시 공유 모달 (DB에서 방금 등록된 id 조회)
    const { data: fresh } = await db.from('job_postings')
      .select('id').eq('business_id', bizRecord.id).order('created_at', { ascending: false }).limit(1).single();
    openShareModal(fresh?.id);
  } else {
    showToast('✅ 공고가 수정됐습니다');
  }
}

// ── 번개 알바 토글 ────────────────────────────────────────
let surgeOn = false;
function toggleSurge() {
  surgeOn = !surgeOn;
  document.getElementById('f-surge-enabled').value = surgeOn;
  const knob    = document.getElementById('surge-knob');
  const toggle  = document.getElementById('surge-toggle');
  const settings = document.getElementById('surge-settings');
  toggle.style.background  = surgeOn ? '#FF9500' : '#ddd';
  knob.style.left          = surgeOn ? '22px' : '2px';
  settings.style.display   = surgeOn ? 'block' : 'none';
  updateSurgePreview();
}

function updateSurgePreview() {
  const wage     = parseInt(document.getElementById('f-wage').value) || 0;
  const max      = parseInt(document.getElementById('f-surge-max').value) || 0;
  const amount   = parseInt(document.getElementById('f-surge-amount').value) || 1000;
  const interval = parseInt(document.getElementById('f-surge-interval').value) || 30;
  if (!wage) return;
  const steps    = max ? Math.floor((max - wage) / amount) : 3;
  const maxWage  = max || wage + amount * 3;
  document.getElementById('surge-preview').textContent =
    `${interval}분마다 +${amount.toLocaleString()}원 → 최대 ${maxWage.toLocaleString()}원 (최대 ${steps}회 인상)`;
}

// ── Realtime ──────────────────────────────────────────────
function setupRealtime() {
  db.channel('owner-updates')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'applications' }, () => {
      showToast('🔔 새 지원자가 있습니다!');
      loadApplicants();
      loadPostings();
    })
    .subscribe();
}

// ── 유틸 ──────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'applicants' && bizRecord) loadApplicants();
}

function setNav(el, tab) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  if (tab === 'map') { location.href = '/바로알바.html'; return; }
  if (tab === 'postings') switchTab('postings', document.querySelectorAll('.tab-btn')[0]);
  else if (tab === 'applicants') switchTab('applicants', document.querySelectorAll('.tab-btn')[1]);
  else if (tab === 'settings') openOwnerSettings();
  else showToast('준비 중입니다');
}

// ── 공유 ───────────────────────────────────────────────────
let _shareJobId = null;

function openShareModal(jobId) {
  _shareJobId = jobId;
  const base = 'https://baroalba.multimove.co.kr/바로알바.html';
  const url = jobId ? `${base}?job=${jobId}` : base;
  document.getElementById('share-url-text').textContent = url;
  document.getElementById('share-native-btn').style.display = navigator.share ? 'block' : 'none';
  document.getElementById('share-overlay').classList.add('open');
  showToast('✅ 공고가 등록됐습니다');
}

function copyShareUrl() {
  const url = document.getElementById('share-url-text').textContent;
  navigator.clipboard.writeText(url).then(() => showToast('✅ 링크가 복사됐습니다'));
}

function shareKakao() {
  const url = document.getElementById('share-url-text').textContent;
  const kakaoWebShare = `https://story.kakao.com/share?url=${encodeURIComponent(url)}`;
  window.open(kakaoWebShare, '_blank', 'width=500,height=600');
}

function shareNative() {
  const url = document.getElementById('share-url-text').textContent;
  if (navigator.share) {
    navigator.share({ title: '바로알바 공고', text: '지금 바로 지원하세요!', url });
  }
}

// ── 카테고리 ───────────────────────────────────────────────
const DEFAULT_CATEGORIES = [
  { name:'F&B',     icon:'☕', display_order:1 },
  { name:'물류',    icon:'📦', display_order:2 },
  { name:'판매',    icon:'🛍', display_order:3 },
  { name:'청소',    icon:'🧹', display_order:4 },
  { name:'이벤트',  icon:'🎉', display_order:5 },
  { name:'커플알바',icon:'💑', display_order:6 },
  { name:'컨텐츠',  icon:'📱', display_order:7 },
  { name:'챌린지',  icon:'🏆', display_order:8 },
  { name:'뷰티/헤어',icon:'💅',display_order:9 },
  { name:'유튜브/틱톡',icon:'🎬',display_order:10 },
  { name:'모델/촬영',icon:'📸',display_order:11 },
  { name:'기타',    icon:'📋', display_order:99 },
];
let categories = [...DEFAULT_CATEGORIES];

async function loadCategories() {
  try {
    const { data, error } = await db.from('job_categories').select('*').eq('active', true).order('display_order');
    if (!error && data?.length) categories = data;
  } catch(e) { /* fallback to defaults */ }
  renderCategorySelect();
}

function renderCategorySelect() {
  const sel = document.getElementById('f-category');
  const prev = sel.value;
  sel.innerHTML = categories.map(c => `<option value="${c.name}">${c.icon} ${c.name}</option>`).join('');
  if (prev && categories.find(c => c.name === prev)) sel.value = prev;
}

function renderAdminCatList() {
  const list = document.getElementById('admin-cat-list');
  if (!list) return;
  list.innerHTML = categories.map((c, i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8f8f8;border-radius:10px">
      <span style="font-size:18px">${c.icon}</span>
      <span style="flex:1;font-size:14px;font-weight:700">${c.name}</span>
      <button onclick="deleteCategory('${c.name}')" style="padding:4px 10px;background:#FFF0F0;color:#FF4B4B;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer">삭제</button>
    </div>`).join('');
}

async function addCategory() {
  const icon = document.getElementById('admin-cat-icon').value.trim() || '📋';
  const name = document.getElementById('admin-cat-name').value.trim();
  if (!name) { showToast('카테고리명을 입력해주세요'); return; }
  if (categories.find(c => c.name === name)) { showToast('이미 있는 카테고리예요'); return; }

  const newOrder = Math.max(...categories.map(c => c.display_order || 0)) + 1;
  const { error } = await db.from('job_categories').insert({ name, icon, display_order: newOrder, active: true });
  if (error) {
    // 테이블 없으면 로컬에만 추가
    categories.push({ name, icon, display_order: newOrder });
  } else {
    categories.push({ name, icon, display_order: newOrder });
  }
  document.getElementById('admin-cat-icon').value = '';
  document.getElementById('admin-cat-name').value = '';
  renderCategorySelect();
  renderAdminCatList();
  showToast(`✅ '${name}' 추가됨`);
}

async function deleteCategory(name) {
  if (!confirm(`'${name}' 카테고리를 삭제할까요?`)) return;
  await db.from('job_categories').update({ active: false }).eq('name', name);
  categories = categories.filter(c => c.name !== name);
  renderCategorySelect();
  renderAdminCatList();
}

function openOwnerSettings() {
  if (currentUser) {
    const meta = currentUser.user_metadata || {};
    document.getElementById('settings-name').textContent = bizRecord?.name || meta.full_name || '업주';
    document.getElementById('settings-email').textContent = currentUser.email || '';
    const isAdmin = currentUser.email === 'nicepkw@gmail.com';
    document.getElementById('admin-cat-section').style.display = isAdmin ? 'block' : 'none';
    if (isAdmin) renderAdminCatList();
  }
  document.getElementById('settings-overlay').classList.add('open');
}

function toggleOwnerPwForm() {
  const f = document.getElementById('owner-pw-form');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

async function submitOwnerPw() {
  const pw  = document.getElementById('owner-new-pw').value;
  const pw2 = document.getElementById('owner-new-pw2').value;
  if (pw.length < 6) { showToast('비밀번호는 6자 이상이어야 합니다'); return; }
  if (pw !== pw2)    { showToast('비밀번호가 일치하지 않습니다'); return; }
  const { error } = await db.auth.updateUser({ password: pw });
  if (error) { showToast('변경 실패: ' + error.message); return; }
  showToast('✅ 비밀번호가 변경됐습니다');
  document.getElementById('owner-pw-form').style.display = 'none';
  document.getElementById('settings-overlay').classList.remove('open');
}

async function deleteOwnerAccount() {
  if (!confirm('정말 탈퇴하시겠어요?\n등록한 공고와 지원자 데이터가 모두 삭제됩니다.')) return;
  if (!confirm('마지막 확인입니다. 탈퇴 후 복구가 불가능합니다.')) return;
  if (bizRecord) {
    await db.from('businesses').delete().eq('id', bizRecord.id);
  }
  await db.auth.signOut();
  localStorage.removeItem('baroalba_guest');
  alert('탈퇴가 완료됐습니다.');
  location.href = '/login.html';
}

// ── 시작/종료 시간 셀렉트 헬퍼 ──────────────────────────────
function buildTimeSelects() {
  ['f-start-hour','f-end-hour'].forEach(id => {
    const el = document.getElementById(id);
    if (!el || el.options.length) return;
    for (let h = 0; h < 24; h++) {
      const o = document.createElement('option');
      o.value = h;
      o.textContent = String(h).padStart(2,'0') + '시';
      el.appendChild(o);
    }
  });
  ['f-start-min','f-end-min'].forEach(id => {
    const el = document.getElementById(id);
    if (!el || el.options.length) return;
    for (let m = 0; m < 60; m += 5) {
      const o = document.createElement('option');
      o.value = m;
      o.textContent = String(m).padStart(2,'0') + '분';
      el.appendChild(o);
    }
  });
  ['f-start-hour','f-start-min','f-end-hour','f-end-min'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', updateDurationDisplay);
  });
}

function setTimeSelects(prefix, date) {
  const d = document.getElementById('f-start-date');
  if (prefix === 'start' && d) {
    const y = date.getFullYear();
    const mo = String(date.getMonth()+1).padStart(2,'0');
    const day = String(date.getDate()).padStart(2,'0');
    d.value = `${y}-${mo}-${day}`;
  }
  const h = document.getElementById(`f-${prefix}-hour`);
  const m = document.getElementById(`f-${prefix}-min`);
  if (h) h.value = date.getHours();
  if (m) m.value = Math.round(date.getMinutes() / 5) * 5 % 60;
  updateDurationDisplay();
}

function getTimeValue(prefix) {
  const dateEl = document.getElementById('f-start-date');
  const h = parseInt(document.getElementById(`f-${prefix}-hour`)?.value ?? 0);
  const m = parseInt(document.getElementById(`f-${prefix}-min`)?.value ?? 0);
  const dateStr = dateEl?.value;
  if (!dateStr) return null;
  const d = new Date(dateStr);
  d.setHours(h, m, 0, 0);
  return d;
}

function updateDurationDisplay() {
  const s = getTimeValue('start');
  const e = getTimeValue('end');
  const el = document.getElementById('f-duration-display');
  if (!el) return;
  if (s && e && e > s) {
    const mins = Math.round((e - s) / 60000);
    const h = Math.floor(mins / 60), min = mins % 60;
    el.textContent = min ? `${h}시간 ${min}분` : `${h}시간`;
    el.style.color = '#333';
  } else if (s && e && e <= s) {
    el.textContent = '⚠️';
    el.style.color = '#E53935';
  } else {
    el.textContent = '';
  }
}

function formatTime(iso) {
  if (!iso) return '미정';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '미정';
  const now = new Date();
  const diff = d - now;
  if (diff < 0) return '진행중';
  if (diff < 3600000) return Math.round(diff/60000) + '분 후';
  if (diff < 86400000) return Math.round(diff/3600000) + '시간 후';
  return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function logout() {
  await db.auth.signOut();
  localStorage.removeItem('baroalba_guest');
  location.href = '/login.html';
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2800);
}
