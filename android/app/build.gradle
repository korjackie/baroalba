apply plugin: 'com.android.application'

android {
    compileSdk 34
    namespace 'kr.co.multimove.baroalba'

    defaultConfig {
        applicationId 'kr.co.multimove.baroalba'
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword System.getenv('KEY_PASSWORD') ?: 'baroalba2026'
            keyAlias 'android'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'baroalba2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
