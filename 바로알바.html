<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF4B4B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="바로알바">
  <link rel="manifest" href="./manifest.json">
  <title>바로알바</title>

  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 카카오맵 SDK: config.js 로드 직후 동기 삽입 (document.write 필수) -->
  <script>document.write('<scr'+'ipt src="//dapi.kakao.com/v2/maps/sdk.js?appkey='+APP_CONFIG.KAKAO_JS_KEY+'&libraries=services,clusterer"><\/scr'+'ipt>');</script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --red: #FF4B4B;
      --urgent: #FF4B4B;
      --open: #3B82F6;
      --fnb: #F59E0B;
      --logistics: #8B5CF6;
      --sales: #10B981;
      --cleaning: #6B7280;
      --event: #EC4899;
      --nav-h: 64px;
      --sheet-peek: 120px;
    }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f5f5f5; }

    /* ── 지도 ── */
    #map { position: fixed; inset: 0; bottom: var(--nav-h); }

    /* ── 상단 검색바 ── */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      padding: 12px 14px 0;
      pointer-events: none;
    }
    .search-row {
      display: flex;
      gap: 8px;
      pointer-events: all;
    }
    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }
    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      color: #222;
      background: transparent;
    }
    .search-box input::placeholder { color: #bbb; }
    .search-icon { font-size: 16px; color: #999; }
    .location-btn {
      width: 44px; height: 44px;
      background: #fff;
      border: none;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      cursor: pointer;
      font-size: 18px;
    }

    /* ── 카테고리 필터 칩 ── */
    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 0 4px;
      pointer-events: all;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1.5px solid #e0e0e0;
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      white-space: nowrap;
    }
    .chip.active { background: var(--red); border-color: var(--red); color: #fff; }

    /* ── 반경 표시 ── */
    .radius-badge {
      position: fixed;
      top: 110px; right: 14px;
      background: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      color: #555;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 200;
      cursor: pointer;
    }

    /* ── 카카오 마커 커스텀 ── */
    .marker-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
    }
    .marker-bubble {
      background: #fff;
      border-radius: 20px;
      padding: 5px 10px;
      border: 2.5px solid var(--red);
      white-space: nowrap;
      font-size: 12px;
      font-weight: 800;
      color: var(--red);
      line-height: 1.3;
    }
    .marker-bubble.urgent { background: var(--red); color: #fff; border-color: var(--red); }
    .marker-bubble.open   { border-color: var(--open); color: var(--open); }
    .marker-tail {
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--red);
      margin-top: -1px;
    }
    .marker-tail.open { border-top-color: var(--open); }
    .surge-badge {
      position: absolute;
      top: -8px; right: -8px;
      background: #FF9500;
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 8px;
      border: 1.5px solid #fff;
    }

    /* ── 하단 시트 ── */
    .bottom-sheet {
      position: fixed;
      left: 0; right: 0;
      bottom: var(--nav-h);
      z-index: 300;
      background: #fff;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 75vh;
      display: flex;
      flex-direction: column;
    }
    .sheet-peek   { transform: translateY(calc(100% - var(--sheet-peek))); }
    .sheet-half   { transform: translateY(30%); }
    .sheet-full   { transform: translateY(0); }

    .sheet-handle-area {
      padding: 10px 0 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      flex-shrink: 0;
    }
    .sheet-handle { width: 36px; height: 4px; background: #e0e0e0; border-radius: 2px; }
    .sheet-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 10px;
    }
    .sheet-count { font-size: 15px; font-weight: 800; color: #222; }
    .sheet-count span { color: var(--red); }
    .sheet-sort { font-size: 12px; color: #888; cursor: pointer; }

    .job-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 14px 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* ── 공고 카드 ── */
    .job-card {
      background: #fff;
      border: 1.5px solid #f0f0f0;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
      overflow: hidden;
    }
    .job-card:active { transform: scale(0.98); background: #fafafa; }
    .job-card.urgent-card { border-color: #FFE0E0; background: #FFFAFA; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .card-left { flex: 1; }
    .card-biz { font-size: 11px; color: #999; font-weight: 600; margin-bottom: 3px; }
    .card-title { font-size: 15px; font-weight: 800; color: #222; line-height: 1.3; }
    .card-right { text-align: right; flex-shrink: 0; margin-left: 10px; }
    .card-wage { font-size: 17px; font-weight: 900; color: var(--red); }
    .wage-delta {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      color: #FF9500;
      background: #FFF3E0;
      padding: 1px 5px;
      border-radius: 6px;
      margin-top: 2px;
    }

    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      background: #f5f5f5;
      color: #666;
    }
    .tag.urgent-tag { background: #FFF0F0; color: var(--red); }
    .tag.fnb-tag     { background: #FFF8E1; color: #F59E0B; }
    .tag.logistics-tag { background: #F3F0FF; color: #8B5CF6; }
    .tag.sales-tag   { background: #E6FBF4; color: #10B981; }
    .tag.cleaning-tag { background: #F3F4F6; color: #6B7280; }
    .tag.event-tag   { background: #FDF2F8; color: #EC4899; }

    .card-meta {
      display: flex;
      gap: 10px;
      font-size: 11px;
      color: #aaa;
      font-weight: 600;
    }
    .card-meta span { display: flex; align-items: center; gap: 3px; }

    .card-star { color: #F59E0B; font-size: 11px; }

    /* ── 공고 상세 모달 ── */
    .detail-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 500;
      align-items: flex-end;
    }
    .detail-overlay.open { display: flex; }
    .detail-sheet {
      background: #fff;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
      padding-bottom: 24px;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .detail-handle { width: 36px; height: 4px; background: #e0e0e0; border-radius: 2px; margin: 12px auto 16px; }

    .detail-header { padding: 0 20px 16px; border-bottom: 1px solid #f0f0f0; }
    .detail-status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .detail-status {
      font-size: 11px; font-weight: 800;
      padding: 3px 8px; border-radius: 8px;
    }
    .status-urgent { background: #FFF0F0; color: var(--red); }
    .status-open   { background: #EFF6FF; color: var(--open); }
    .detail-cat    { font-size: 11px; font-weight: 700; color: #888; }
    .detail-title  { font-size: 20px; font-weight: 900; color: #222; margin-bottom: 4px; }
    .detail-biz    { font-size: 13px; color: #888; display: flex; align-items: center; gap: 4px; }
    .detail-rating { color: #F59E0B; font-weight: 700; }

    .detail-wage-box {
      margin: 16px 20px;
      background: linear-gradient(135deg, #FFF5F5, #fff);
      border: 1.5px solid #FFE0E0;
      border-radius: 16px;
      padding: 16px;
    }
    .detail-wage-label { font-size: 11px; font-weight: 700; color: #999; margin-bottom: 4px; }
    .detail-wage-val   { font-size: 28px; font-weight: 900; color: var(--red); }
    .detail-wage-surge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #FFF3E0;
      color: #FF9500;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 8px;
      margin-top: 6px;
    }
    .detail-wage-base { font-size: 11px; color: #bbb; margin-top: 4px; }

    .detail-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0 20px 16px;
    }
    .info-item {
      background: #f8f8f8;
      border-radius: 12px;
      padding: 12px;
    }
    .info-label { font-size: 10px; font-weight: 700; color: #aaa; margin-bottom: 4px; }
    .info-val   { font-size: 14px; font-weight: 800; color: #222; }

    .detail-desc {
      margin: 0 20px 16px;
      font-size: 14px;
      color: #555;
      line-height: 1.7;
    }

    .detail-apply-btn {
      margin: 0 20px;
      width: calc(100% - 40px);
      padding: 16px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .detail-apply-btn:active { transform: scale(0.98); }
    .detail-apply-btn:hover  { background: #e03333; }

    /* ── 하단 내비게이션 ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: #fff;
      border-top: 1px solid #f0f0f0;
      display: flex;
      z-index: 400;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: opacity 0.15s;
      border: none;
      background: none;
      padding: 0;
    }
    .nav-icon { font-size: 22px; line-height: 1; }
    .nav-label { font-size: 10px; font-weight: 700; color: #bbb; }
    .nav-item.active .nav-label { color: var(--red); }
    .nav-item.active .nav-icon  { filter: none; }

    /* ── 로딩 ── */
    .map-loading {
      position: fixed;
      inset: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      gap: 16px;
      transition: opacity 0.4s;
    }
    .map-loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 40px; height: 40px; border: 3px solid #eee; border-top-color: var(--red); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-txt { font-size: 14px; font-weight: 700; color: #666; }

    /* ── 토스트 ── */
    .toast {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--sheet-peek) + 12px);
      left: 50%; transform: translateX(-50%);
      background: #222; color: #fff;
      font-size: 13px; font-weight: 700;
      padding: 10px 18px; border-radius: 20px;
      z-index: 600; white-space: nowrap;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.hidden { opacity: 0; }

    /* ── 반경 조절 팝업 ── */
    .radius-popup {
      position: fixed;
      top: 110px; right: 14px;
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      z-index: 250;
      display: none;
      flex-direction: column;
      gap: 6px;
      min-width: 100px;
    }
    .radius-popup.open { display: flex; }
    .radius-opt {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px; font-weight: 700; color: #444;
      cursor: pointer; text-align: center;
      transition: background 0.1s;
    }
    .radius-opt:hover, .radius-opt.selected { background: #FFF0F0; color: var(--red); }

    /* ── 게스트 배너 ── */
    .guest-banner {
      position: fixed;
      top: 108px; left: 14px; right: 14px;
      background: #222;
      color: #fff;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 200;
      display: none;
    }
    .guest-banner.show { display: flex; }
    .guest-login-btn {
      background: var(--red); color: #fff;
      border: none; border-radius: 8px;
      padding: 5px 10px; font-size: 11px; font-weight: 800;
      cursor: pointer;
    }

    /* ── 빈 상태 ── */
    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: #bbb;
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-txt  { font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>

<!-- 로딩 -->
<div class="map-loading" id="map-loading">
  <div class="spinner"></div>
  <div class="loading-txt">지도 불러오는 중...</div>
</div>

<!-- 지도 컨테이너 -->
<div id="map"></div>

<!-- 상단 바 -->
<div class="top-bar">
  <div class="search-row">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input id="search-input" type="text" placeholder="지역, 업종 검색">
    </div>
    <button class="location-btn" onclick="moveToMyLocation()" title="내 위치로">📍</button>
  </div>
  <div class="filter-row" id="filter-row">
    <div class="chip active" data-cat="" onclick="setCategory(this, '')">전체</div>
    <div class="chip" data-cat="F&B"  onclick="setCategory(this, 'F&B')">☕ F&B</div>
    <div class="chip" data-cat="물류" onclick="setCategory(this, '물류')">📦 물류</div>
    <div class="chip" data-cat="판매" onclick="setCategory(this, '판매')">🛍 판매</div>
    <div class="chip" data-cat="청소" onclick="setCategory(this, '청소')">🧹 청소</div>
    <div class="chip" data-cat="이벤트" onclick="setCategory(this, '이벤트')">🎉 이벤트</div>
    <div class="chip" id="chip-urgent" data-urgent="true" onclick="toggleUrgent(this)">🔥 급구만</div>
  </div>
</div>

<!-- 반경 배지 -->
<div class="radius-badge" id="radius-badge" onclick="toggleRadiusPopup()">
  📡 <span id="radius-txt">3km</span>
</div>

<!-- 반경 팝업 -->
<div class="radius-popup" id="radius-popup">
  <div class="radius-opt" onclick="setRadius(1000)">1km</div>
  <div class="radius-opt selected" onclick="setRadius(3000)">3km</div>
  <div class="radius-opt" onclick="setRadius(5000)">5km</div>
  <div class="radius-opt" onclick="setRadius(10000)">10km</div>
</div>

<!-- 게스트 배너 -->
<div class="guest-banner" id="guest-banner">
  <span>로그인하면 바로 지원할 수 있어요</span>
  <button class="guest-login-btn" onclick="location.href='./login.html'">로그인</button>
</div>

<!-- 하단 시트 -->
<div class="bottom-sheet sheet-peek" id="bottom-sheet">
  <div class="sheet-handle-area" id="sheet-handle">
    <div class="sheet-handle"></div>
  </div>
  <div class="sheet-summary">
    <div class="sheet-count">주변 공고 <span id="job-count">0</span>개</div>
    <div class="sheet-sort" onclick="toggleSort()">⇅ <span id="sort-label">거리순</span></div>
  </div>
  <div class="job-list" id="job-list">
    <div class="empty-state">
      <div class="empty-icon">🗺</div>
      <div class="empty-txt">주변 공고를 불러오는 중...</div>
    </div>
  </div>
</div>

<!-- 공고 상세 모달 -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetail(event)">
  <div class="detail-sheet" id="detail-sheet">
    <div class="detail-handle"></div>
    <div class="detail-header">
      <div class="detail-status-row">
        <span class="detail-status" id="d-status"></span>
        <span class="detail-cat" id="d-cat"></span>
      </div>
      <div class="detail-title" id="d-title"></div>
      <div class="detail-biz">
        <span id="d-biz"></span>
        <span>·</span>
        <span class="detail-rating" id="d-rating"></span>
      </div>
    </div>

    <div class="detail-wage-box">
      <div class="detail-wage-label">시급</div>
      <div class="detail-wage-val" id="d-wage"></div>
      <div class="detail-wage-surge" id="d-surge" style="display:none">
        ⬆ 시급 인상 <span id="d-surge-amt"></span>
      </div>
      <div class="detail-wage-base" id="d-base-wage"></div>
    </div>

    <div class="detail-info-grid">
      <div class="info-item">
        <div class="info-label">시작 시간</div>
        <div class="info-val" id="d-time"></div>
      </div>
      <div class="info-item">
        <div class="info-label">근무 시간</div>
        <div class="info-val" id="d-duration"></div>
      </div>
      <div class="info-item">
        <div class="info-label">필요 인원</div>
        <div class="info-val" id="d-needed"></div>
      </div>
      <div class="info-item">
        <div class="info-label">거리</div>
        <div class="info-val" id="d-dist"></div>
      </div>
    </div>

    <div class="detail-desc" id="d-desc"></div>

    <button class="detail-apply-btn" id="d-apply-btn" onclick="applyJob()">⚡ 바로 지원하기</button>
  </div>
</div>

<!-- 하단 내비게이션 -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="setNav(this, 'map')">
    <div class="nav-icon">🗺</div>
    <div class="nav-label">지도</div>
  </button>
  <button class="nav-item" onclick="setNav(this, 'list')">
    <div class="nav-icon">📋</div>
    <div class="nav-label">목록</div>
  </button>
  <button class="nav-item" onclick="setNav(this, 'notify')">
    <div class="nav-icon">🔔</div>
    <div class="nav-label">알림</div>
  </button>
  <button class="nav-item" onclick="setNav(this, 'profile')">
    <div class="nav-icon">👤</div>
    <div class="nav-label">프로필</div>
  </button>
</div>

<!-- 토스트 -->
<div class="toast hidden" id="toast"></div>

<script>
// ── 전역 상태 ─────────────────────────────────────────────
const { createClient } = supabase;
const db = createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);

let kakaoMap = null;
let mapCenter = { lat: APP_CONFIG.DEFAULT_LAT, lng: APP_CONFIG.DEFAULT_LNG };
let currentRadius = APP_CONFIG.DEFAULT_RADIUS_M;
let currentCategory = '';
let urgentOnly = false;
let sortByWage = false;
let jobs = [];
let markers = [];
let overlays = [];
let selectedJobId = null;
let currentUser = null;
let isGuest = false;
let sheetState = 'peek'; // peek | half | full

// ── 초기화 ────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

  // 세션 확인 (카카오 SDK는 동기 로드이므로 이미 준비됨)
  const { data: { session } } = await db.auth.getSession();

  if (session) {
    currentUser = session.user;
  } else if (localStorage.getItem('baroalba_guest')) {
    isGuest = true;
    document.getElementById('guest-banner').classList.add('show');
  } else {
    location.href = './login.html';
    return;
  }

  initMap();
  setupSheet();
  setupSearch();
  loadJobs();
  setupRealtime();
});

// ── 카카오맵 초기화 ───────────────────────────────────────
function initMap() {
  const container = document.getElementById('map');
  const options = {
    center: new kakao.maps.LatLng(mapCenter.lat, mapCenter.lng),
    level: 5
  };
  kakaoMap = new kakao.maps.Map(container, options);

  // 지도 이동 시 재검색
  kakao.maps.event.addListener(kakaoMap, 'dragend', () => {
    const c = kakaoMap.getCenter();
    mapCenter = { lat: c.getLat(), lng: c.getLng() };
    loadJobs();
  });

  // 내 위치 시도
  moveToMyLocation(true);
  document.getElementById('map-loading').classList.add('hidden');
}

// ── 공고 불러오기 ─────────────────────────────────────────
async function loadJobs() {
  try {
    const { data, error } = await db.rpc('nearby_jobs', {
      user_lat: mapCenter.lat,
      user_lng: mapCenter.lng,
      radius_meters: currentRadius,
      job_category: currentCategory || null
    });
    if (error) throw error;

    let result = data || [];
    if (urgentOnly) result = result.filter(j => j.status === 'urgent');
    if (sortByWage) result = result.sort((a,b) => b.current_wage - a.current_wage);

    jobs = result;
    renderMarkers();
    renderList();
  } catch(e) {
    // Supabase 미연결 시 목업 데이터 사용
    jobs = getMockJobs();
    renderMarkers();
    renderList();
  }
}

// ── 마커 렌더링 ───────────────────────────────────────────
function renderMarkers() {
  // 기존 마커/오버레이 제거
  markers.forEach(m => m.setMap(null));
  overlays.forEach(o => o.setMap(null));
  markers = []; overlays = [];

  jobs.forEach(job => {
    const isUrgent = job.status === 'urgent';
    const hasSurge = job.wage_delta > 0;
    const wageStr = (job.current_wage / 10000).toFixed(1) + '만';

    const surgeHtml = hasSurge
      ? `<div class="surge-badge">↑${(job.wage_delta/1000).toFixed(0)}k</div>` : '';
    const statusCls = isUrgent ? 'urgent' : 'open';
    const tailCls   = isUrgent ? '' : 'open';

    const content = `
      <div class="marker-wrap" onclick="openDetail('${job.id}')">
        ${surgeHtml}
        <div class="marker-bubble ${statusCls}">${wageStr}</div>
        <div class="marker-tail ${tailCls}"></div>
      </div>`;

    const pos = new kakao.maps.LatLng(job.lat, job.lng);
    const overlay = new kakao.maps.CustomOverlay({
      position: pos,
      content,
      yAnchor: 1.1
    });
    overlay.setMap(kakaoMap);
    overlays.push(overlay);
  });
}

// ── 목록 렌더링 ───────────────────────────────────────────
function renderList() {
  document.getElementById('job-count').textContent = jobs.length;
  const list = document.getElementById('job-list');

  if (jobs.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">😅</div><div class="empty-txt">주변 ${(currentRadius/1000).toFixed(0)}km 내 공고가 없어요</div></div>`;
    return;
  }

  list.innerHTML = jobs.map(job => {
    const isUrgent = job.status === 'urgent';
    const hasSurge = job.wage_delta > 0;
    const catClass = getCatClass(job.category);
    const dist = job.distance_m < 1000
      ? Math.round(job.distance_m) + 'm'
      : (job.distance_m/1000).toFixed(1) + 'km';
    const startStr = job.start_time ? formatTime(job.start_time) : '미정';

    return `
    <div class="job-card ${isUrgent ? 'urgent-card' : ''}" onclick="openDetail('${job.id}')">
      <div class="card-top">
        <div class="card-left">
          <div class="card-biz">🏪 ${job.biz_name}</div>
          <div class="card-title">${job.title}</div>
        </div>
        <div class="card-right">
          <div class="card-wage">${job.current_wage.toLocaleString()}원</div>
          ${hasSurge ? `<div class="wage-delta">↑${job.wage_delta.toLocaleString()}원</div>` : ''}
        </div>
      </div>
      <div class="card-tags">
        ${isUrgent ? '<span class="tag urgent-tag">🔥 급구</span>' : ''}
        <span class="tag ${catClass}">${job.category}</span>
        <span class="tag">${job.duration_hours}시간</span>
        ${job.needed_count - job.filled_count > 0 ? `<span class="tag">${job.needed_count - job.filled_count}명 필요</span>` : ''}
      </div>
      <div class="card-meta">
        <span>📍 ${dist}</span>
        <span>⏰ ${startStr}</span>
        <span class="card-star">★ ${job.biz_rating || '-'}</span>
      </div>
    </div>`;
  }).join('');
}

// ── 공고 상세 ─────────────────────────────────────────────
function openDetail(jobId) {
  const job = jobs.find(j => j.id === jobId);
  if (!job) return;
  selectedJobId = jobId;

  const isUrgent = job.status === 'urgent';
  const hasSurge = job.wage_delta > 0;
  const dist = job.distance_m < 1000
    ? Math.round(job.distance_m) + 'm'
    : (job.distance_m/1000).toFixed(1) + 'km';

  document.getElementById('d-status').textContent = isUrgent ? '🔥 급구' : '모집중';
  document.getElementById('d-status').className = `detail-status ${isUrgent ? 'status-urgent' : 'status-open'}`;
  document.getElementById('d-cat').textContent = job.category;
  document.getElementById('d-title').textContent = job.title;
  document.getElementById('d-biz').textContent = job.biz_name;
  document.getElementById('d-rating').textContent = `★ ${job.biz_rating || '-'} (${job.biz_reviews || 0}개)`;
  document.getElementById('d-wage').textContent = job.current_wage.toLocaleString() + '원';
  document.getElementById('d-time').textContent = job.start_time ? formatTime(job.start_time) : '미정';
  document.getElementById('d-duration').textContent = job.duration_hours + '시간';
  document.getElementById('d-needed').textContent = `${job.needed_count - job.filled_count}/${job.needed_count}명`;
  document.getElementById('d-dist').textContent = dist;
  document.getElementById('d-desc').textContent = job.description || '';

  if (hasSurge) {
    document.getElementById('d-surge').style.display = 'inline-flex';
    document.getElementById('d-surge-amt').textContent = '+' + job.wage_delta.toLocaleString() + '원';
    document.getElementById('d-base-wage').textContent = `기본시급 ${job.base_wage.toLocaleString()}원에서 인상됨`;
  } else {
    document.getElementById('d-surge').style.display = 'none';
    document.getElementById('d-base-wage').textContent = '';
  }

  document.getElementById('detail-overlay').classList.add('open');

  // 지도 해당 위치로 이동
  kakaoMap.setCenter(new kakao.maps.LatLng(job.lat, job.lng));
}

function closeDetail(e) {
  if (e.target === document.getElementById('detail-overlay')) {
    document.getElementById('detail-overlay').classList.remove('open');
    selectedJobId = null;
  }
}

async function applyJob() {
  if (isGuest) {
    showToast('로그인 후 지원할 수 있어요');
    setTimeout(() => location.href = './login.html', 1500);
    return;
  }
  if (!currentUser) { showToast('로그인이 필요합니다'); return; }
  if (!selectedJobId) return;

  const btn = document.getElementById('d-apply-btn');
  btn.textContent = '지원 중...';
  btn.disabled = true;

  try {
    // workers 테이블에서 내 ID 조회
    const { data: worker } = await db.from('workers').select('id').eq('kakao_uid', currentUser.id).single();
    if (!worker) { showToast('프로필 설정이 필요합니다'); btn.textContent = '⚡ 바로 지원하기'; btn.disabled = false; return; }

    const { error } = await db.from('applications').insert({
      job_posting_id: selectedJobId,
      worker_id: worker.id
    });

    if (error?.code === '23505') {
      showToast('이미 지원한 공고입니다');
    } else if (error) {
      showToast('오류가 발생했습니다: ' + error.message);
    } else {
      showToast('✅ 지원 완료!');
      document.getElementById('detail-overlay').classList.remove('open');
    }
  } catch(e) {
    showToast('오류: ' + e.message);
  }

  btn.textContent = '⚡ 바로 지원하기';
  btn.disabled = false;
}

// ── 내 위치로 이동 ────────────────────────────────────────
function moveToMyLocation(silent = false) {
  if (!navigator.geolocation) { if (!silent) showToast('위치 정보를 사용할 수 없습니다'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    mapCenter = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    kakaoMap.setCenter(new kakao.maps.LatLng(mapCenter.lat, mapCenter.lng));
    loadJobs();
  }, () => {
    if (!silent) showToast('위치 권한이 필요합니다');
  });
}

// ── 필터 ─────────────────────────────────────────────────
function setCategory(el, cat) {
  document.querySelectorAll('#filter-row .chip:not([data-urgent])').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentCategory = cat;
  loadJobs();
}

function toggleUrgent(el) {
  urgentOnly = !urgentOnly;
  el.classList.toggle('active', urgentOnly);
  loadJobs();
}

function setRadius(m) {
  currentRadius = m;
  document.getElementById('radius-txt').textContent = m >= 1000 ? (m/1000) + 'km' : m + 'm';
  document.querySelectorAll('.radius-opt').forEach(o => o.classList.remove('selected'));
  event.target.classList.add('selected');
  toggleRadiusPopup();
  loadJobs();
}

function toggleRadiusPopup() {
  document.getElementById('radius-popup').classList.toggle('open');
}

function toggleSort() {
  sortByWage = !sortByWage;
  document.getElementById('sort-label').textContent = sortByWage ? '시급순' : '거리순';
  if (sortByWage) jobs.sort((a,b) => b.current_wage - a.current_wage);
  else jobs.sort((a,b) => a.distance_m - b.distance_m);
  renderList();
}

// ── 하단 시트 드래그 ──────────────────────────────────────
function setupSheet() {
  const sheet = document.getElementById('bottom-sheet');
  const handle = document.getElementById('sheet-handle');
  let startY = 0;

  handle.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
  handle.addEventListener('touchend', e => {
    const dy = startY - e.changedTouches[0].clientY;
    if (dy > 40)       setSheetState('half');
    else if (dy < -40) setSheetState('peek');
  }, { passive: true });

  handle.addEventListener('click', () => {
    setSheetState(sheetState === 'peek' ? 'half' : sheetState === 'half' ? 'full' : 'peek');
  });
}

function setSheetState(state) {
  const sheet = document.getElementById('bottom-sheet');
  sheet.classList.remove('sheet-peek', 'sheet-half', 'sheet-full');
  sheet.classList.add('sheet-' + state);
  sheetState = state;
}

// ── 검색 ──────────────────────────────────────────────────
function setupSearch() {
  const input = document.getElementById('search-input');
  let timer;
  input.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const q = input.value.trim();
      if (!q) { renderList(); return; }
      const filtered = jobs.filter(j =>
        j.title.includes(q) || j.biz_name.includes(q) || j.category.includes(q)
      );
      renderFilteredList(filtered);
    }, 300);
  });
}

function renderFilteredList(filtered) {
  document.getElementById('job-count').textContent = filtered.length;
  const list = document.getElementById('job-list');
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-txt">검색 결과가 없어요</div></div>`;
    return;
  }
  // renderList와 동일 로직이지만 filtered 배열 사용
  const tempJobs = jobs;
  jobs = filtered;
  renderList();
  jobs = tempJobs;
}

// ── Supabase Realtime (시급 실시간 반영) ──────────────────
function setupRealtime() {
  db.channel('wage-changes')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'job_postings' }, payload => {
      const updated = payload.new;
      const idx = jobs.findIndex(j => j.id === updated.id);
      if (idx !== -1) {
        jobs[idx].current_wage = updated.current_wage;
        jobs[idx].wage_delta = updated.current_wage - jobs[idx].base_wage;
        jobs[idx].status = updated.status;
        renderMarkers();
        renderList();
        if (updated.current_wage > updated.base_wage) {
          const job = jobs[idx];
          showToast(`🔥 ${job.title} 시급 ${updated.current_wage.toLocaleString()}원으로 인상!`);
        }
      }
    })
    .subscribe();
}

// ── 내비게이션 ────────────────────────────────────────────
function setNav(el, tab) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  if (tab === 'list') setSheetState('full');
  else if (tab === 'map') setSheetState('peek');
  else showToast('준비 중입니다');
}

// ── 유틸 ──────────────────────────────────────────────────
function getCatClass(cat) {
  const map = { 'F&B': 'fnb-tag', '물류': 'logistics-tag', '판매': 'sales-tag', '청소': 'cleaning-tag', '이벤트': 'event-tag' };
  return map[cat] || '';
}

function formatTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = d - now;
  if (diff < 0) return '진행중';
  if (diff < 3600000) return Math.round(diff/60000) + '분 후';
  if (diff < 86400000) return Math.round(diff/3600000) + '시간 후';
  return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2800);
}
