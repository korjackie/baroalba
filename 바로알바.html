<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF4B4B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="바로알바">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <title>바로알바 — 실시간 지도 알바 매칭</title>
  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (async () => {
      const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await db.auth.getSession();
      if (!session && !localStorage.getItem('baroalba_guest')) window.location.replace('./login.html');
    })();
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f5f5f5; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── 헤더 ── */
    .header { background: #fff; padding: 10px 14px 0; z-index: 1000; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .header-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .logo { font-size: 18px; font-weight: 800; color: #FF4B4B; letter-spacing: -0.5px; white-space: nowrap; }
    .search-bar { flex: 1; display: flex; align-items: center; background: #f0f0f0; border-radius: 10px; padding: 8px 12px; gap: 8px; min-width: 0; }
    .search-bar input { border: none; background: transparent; font-size: 14px; outline: none; flex: 1; color: #333; min-width: 0; }
    .search-bar .icon { font-size: 15px; color: #888; flex-shrink: 0; }
    .location-btn { background: #FF4B4B; border: none; border-radius: 8px; padding: 8px 10px; color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0; min-width: 36px; min-height: 36px; }

    /* 유저 아바타 */
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #FF4B4B; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; overflow: hidden; border: 2px solid #FF4B4B; }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* 유저 메뉴 */
    .user-menu { display: none; position: fixed; top: 60px; right: 14px; background: #fff; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.14); z-index: 3000; min-width: 190px; overflow: hidden; animation: fadeIn 0.15s ease; }
    .user-menu.open { display: block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .user-menu-header { padding: 14px 16px; background: #FFF5F5; border-bottom: 1px solid #f0f0f0; }
    .user-menu-name { font-size: 15px; font-weight: 700; color: #222; }
    .user-menu-role { font-size: 12px; color: #888; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
    .role-badge { background: #FF4B4B; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; }
    .user-menu-item { padding: 13px 16px; font-size: 14px; color: #333; cursor: pointer; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #f5f5f5; transition: background 0.1s; min-height: 44px; }
    .user-menu-item:last-child { border-bottom: none; }
    .user-menu-item:hover { background: #f9f9f9; }
    .user-menu-item.logout { color: #FF4B4B; }

    /* 필터 칩 */
    .filter-chips { display: flex; gap: 6px; padding-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip { white-space: nowrap; padding: 5px 11px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1.5px solid #ddd; background: #fff; color: #555; cursor: pointer; transition: all 0.15s; min-height: 30px; display: flex; align-items: center; }
    .chip.active { background: #FF4B4B; color: #fff; border-color: #FF4B4B; }
    .chip:hover:not(.active) { border-color: #FF4B4B; color: #FF4B4B; }

    /* ── 지도 ── */
    #map { flex: 1; z-index: 1; min-height: 0; }

    /* 커스텀 마커 */
    .job-marker { background: #fff; border: 2px solid #FF4B4B; border-radius: 20px; padding: 4px 8px; font-size: 11px; font-weight: 700; color: #FF4B4B; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.15); cursor: pointer; display: flex; align-items: center; gap: 3px; }
    .job-marker.surge { border-color: #FF4B4B; background: #FF4B4B; color: #fff; }
    .job-marker.cool  { border-color: #4B8BFF; background: #fff; color: #4B8BFF; }

    /* ── 하단 패널 ── */
    .bottom-panel { background: #fff; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.12); z-index: 1000; }
    .panel-handle { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 4px; cursor: pointer; }
    .handle-bar { width: 36px; height: 4px; background: #e0e0e0; border-radius: 2px; margin: 0 auto 4px; }
    .panel-title { font-size: 14px; font-weight: 700; color: #222; }
    .panel-count { font-size: 13px; color: #FF4B4B; font-weight: 600; }
    .card-list { display: flex; gap: 12px; padding: 6px 14px 16px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .card-list::-webkit-scrollbar { display: none; }

    /* 개별 카드 */
    .job-card { min-width: 210px; background: #fff; border: 1.5px solid #eee; border-radius: 14px; padding: 13px; cursor: pointer; transition: all 0.2s; position: relative; flex-shrink: 0; }
    .job-card:hover { border-color: #FF4B4B; box-shadow: 0 4px 16px rgba(255,75,75,0.12); transform: translateY(-2px); }
    .job-card.selected { border-color: #FF4B4B; box-shadow: 0 4px 16px rgba(255,75,75,0.2); }
    .card-badge { position: absolute; top: 10px; right: 10px; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
    .badge-urgent { background: #FFF0F0; color: #FF4B4B; }
    .badge-new    { background: #F0F7FF; color: #4B8BFF; }
    .badge-filled { background: #F0F0F0; color: #999; }
    .card-biz { font-size: 12px; color: #888; margin-bottom: 3px; }
    .card-title { font-size: 14px; font-weight: 700; color: #222; margin-bottom: 8px; }
    .wage-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 6px; }
    .wage-amount { font-size: 19px; font-weight: 800; color: #222; }
    .wage-unit { font-size: 12px; color: #888; }
    .wage-delta { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; }
    .wage-delta.up   { background: #FFF0F0; color: #FF4B4B; }
    .wage-delta.down { background: #F0F5FF; color: #4B8BFF; }
    .wage-delta.flat { background: #F5F5F5; color: #999; }
    .card-meta { display: flex; gap: 6px; font-size: 11px; color: #999; margin-bottom: 8px; flex-wrap: wrap; }
    .card-meta span { display: flex; align-items: center; gap: 2px; }
    .rating-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .stars { color: #FFBE00; letter-spacing: -1px; }
    .rating-label { color: #888; }
    .apply-btn { background: #FF4B4B; color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background 0.15s; min-height: 32px; }
    .apply-btn:hover { background: #e03333; }
    .apply-btn:disabled { background: #ccc; cursor: default; }

    /* ── 공통 모달 ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 2000; align-items: flex-end; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 24px 24px 0 0; width: 100%; max-height: 82dvh; overflow-y: auto; padding: 0 0 32px; animation: slideUp 0.25s ease; -webkit-overflow-scrolling: touch; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 36px; height: 4px; background: #e0e0e0; border-radius: 2px; margin: 0 auto 12px; }
    .modal-close { font-size: 20px; color: #888; cursor: pointer; background: none; border: none; line-height: 1; padding: 4px; min-width: 32px; min-height: 32px; }
    .modal-body { padding: 18px 18px 0; }
    .modal-biz { font-size: 14px; color: #888; margin-bottom: 4px; }
    .modal-title { font-size: 20px; font-weight: 800; color: #222; margin-bottom: 16px; }
    .modal-wage-block { background: #FFF5F5; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .modal-wage-main { font-size: 26px; font-weight: 800; color: #FF4B4B; display: flex; align-items: baseline; gap: 6px; }
    .modal-wage-unit { font-size: 14px; color: #888; font-weight: 400; }
    .modal-wage-history { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .history-dot { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: #fff; color: #666; border: 1px solid #eee; }
    .history-dot.current { background: #FF4B4B; color: #fff; border-color: #FF4B4B; font-weight: 700; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .info-item { background: #f8f8f8; border-radius: 10px; padding: 11px; }
    .info-label { font-size: 11px; color: #999; margin-bottom: 3px; }
    .info-value { font-size: 13px; font-weight: 700; color: #222; }
    .section-title { font-size: 14px; font-weight: 700; color: #222; margin-bottom: 8px; }
    .rating-detail { background: #f8f8f8; border-radius: 12px; padding: 12px; margin-bottom: 14px; }
    .rating-detail-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .rating-detail-row:last-child { margin-bottom: 0; }
    .rating-detail-label { font-size: 13px; color: #555; }
    .rating-detail-val { display: flex; align-items: center; gap: 6px; }
    .big-star { color: #FFBE00; font-size: 14px; }
    .rating-num { font-size: 14px; font-weight: 700; color: #222; }
    .review-count { font-size: 11px; color: #aaa; }
    .modal-apply { background: #FF4B4B; color: #fff; border: none; border-radius: 14px; padding: 15px; width: 100%; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 8px; transition: background 0.15s; min-height: 50px; }
    .modal-apply:hover { background: #e03333; }
    .modal-apply:disabled { background: #ccc; cursor: default; }

    /* ── 페이지 모달 (내 지원내역 / 내 공고관리) ── */
    .page-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 4000; align-items: flex-end; }
    .page-modal-overlay.open { display: flex; }
    .page-modal { background: #fff; border-radius: 24px 24px 0 0; width: 100%; height: 88dvh; display: flex; flex-direction: column; animation: slideUp 0.28s ease; }
    .page-modal-header { padding: 16px 18px 12px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .page-modal-title { font-size: 18px; font-weight: 800; color: #222; }
    .page-modal-body { flex: 1; overflow-y: auto; padding: 14px 18px; -webkit-overflow-scrolling: touch; }

    /* 지원 내역 카드 */
    .app-card { background: #fff; border: 1.5px solid #eee; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .app-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .app-biz { font-size: 12px; color: #888; margin-bottom: 3px; }
    .app-title { font-size: 15px; font-weight: 700; color: #222; }
    .app-meta { font-size: 12px; color: #aaa; margin-top: 6px; }
    .status-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
    .status-pending  { background: #FFF8E6; color: #F5A623; }
    .status-accepted { background: #F0FFF4; color: #27AE60; }
    .status-rejected { background: #FFF0F0; color: #E74C3C; }

    /* 공고 관리 카드 */
    .manage-card { background: #fff; border: 1.5px solid #eee; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .manage-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .manage-title { font-size: 15px; font-weight: 700; color: #222; }
    .manage-meta { font-size: 12px; color: #aaa; margin-top: 4px; }
    .manage-actions { display: flex; gap: 8px; margin-top: 10px; }
    .manage-btn { flex: 1; padding: 8px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; min-height: 36px; }
    .manage-btn-view { background: #f0f0f0; color: #444; }
    .manage-btn-close { background: #FFF0F0; color: #FF4B4B; }

    /* 지원자 목록 */
    .applicant-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
    .applicant-row:last-child { border-bottom: none; }
    .applicant-name { font-size: 14px; font-weight: 700; color: #222; }
    .applicant-phone { font-size: 12px; color: #888; margin-top: 2px; }
    .applicant-btns { display: flex; gap: 6px; }
    .accept-btn { background: #27AE60; color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; min-height: 32px; }
    .reject-btn { background: #f0f0f0; color: #666; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; min-height: 32px; }
    .empty-state { text-align: center; padding: 40px 20px; color: #aaa; }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-text { font-size: 14px; font-weight: 600; }
    .empty-sub { font-size: 12px; margin-top: 6px; }

    /* ── 업주 FAB ── */
    .fab { position: fixed; bottom: 16px; right: 16px; background: #FF4B4B; color: #fff; border: none; border-radius: 28px; padding: 13px 18px; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 18px rgba(255,75,75,0.45); z-index: 1100; display: flex; align-items: center; gap: 6px; transition: transform 0.1s, box-shadow 0.1s; min-height: 46px; }
    .fab:active { transform: scale(0.95); box-shadow: 0 2px 8px rgba(255,75,75,0.3); }

    /* ── 공고 등록 폼 ── */
    .post-form-group { margin-bottom: 13px; }
    .post-form-label { font-size: 12px; font-weight: 700; color: #666; margin-bottom: 5px; display: block; }
    .post-form-input { width: 100%; padding: 12px 14px; border: 1.5px solid #eee; border-radius: 10px; font-size: 16px; color: #222; outline: none; transition: border-color 0.2s; background: #fafafa; -webkit-appearance: none; }
    .post-form-input:focus { border-color: #FF4B4B; background: #fff; }
    .post-form-input::placeholder { color: #bbb; }
    .post-cat-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .post-chip { padding: 7px 13px; border-radius: 20px; font-size: 13px; font-weight: 600; border: 1.5px solid #ddd; background: #fff; color: #555; cursor: pointer; transition: all 0.15s; min-height: 34px; display: flex; align-items: center; }
    .post-chip.selected { background: #FF4B4B; color: #fff; border-color: #FF4B4B; }
    .post-location-box { background: #f0f7ff; border-radius: 10px; padding: 11px 14px; margin-bottom: 14px; font-size: 12px; color: #555; line-height: 1.6; border: 1px solid #d0e8ff; }
    .post-row { display: flex; gap: 10px; }
    .post-row .post-form-group { flex: 1; }

    /* 토스트 */
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; max-width: 90vw; text-align: center; }
    .toast.show { opacity: 1; }

    /* ── 모바일 최적화 ── */
    @media (max-width: 480px) {
      .job-card { min-width: 190px; }
      .page-modal { height: 92dvh; }
    }
    @media (min-width: 600px) {
      .card-list { padding: 6px 20px 18px; }
      .job-card { min-width: 250px; }
    }
    /* iPhone safe area */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .fab { bottom: calc(16px + env(safe-area-inset-bottom)); }
      .toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
      .bottom-panel { padding-bottom: env(safe-area-inset-bottom); }
    }
  </style>
</head>
<body>

<!-- ── 유저 드롭다운 메뉴 ── -->
<div class="user-menu" id="user-menu">
  <div class="user-menu-header">
    <div class="user-menu-name" id="menu-name">-</div>
    <div class="user-menu-role">
      <span class="role-badge" id="menu-role-badge">알바생</span>
    </div>
  </div>
  <div class="user-menu-item" id="menu-item-worker" style="display:none" onclick="openApplicationsModal()">📋 내 지원 내역</div>
  <div class="user-menu-item" id="menu-item-business" style="display:none" onclick="openPostingsModal()">📝 내 공고 관리</div>
  <div class="user-menu-item" onclick="document.getElementById('user-menu').classList.remove('open');goToMyLocation()">📍 내 위치로 이동</div>
  <div class="user-menu-item logout" onclick="logout()">🚪 로그아웃</div>
</div>

<!-- ── 헤더 ── -->
<div class="header">
  <div id="guest-banner" style="display:none; background:#FFF5F5; border-bottom:1px solid #ffe0e0; padding:7px 14px; align-items:center; justify-content:space-between;">
    <span style="font-size:12px; color:#888;">게스트 모드 · 지원하려면 로그인 필요</span>
    <button onclick="localStorage.removeItem('baroalba_guest');window.location.href='./login.html'" style="background:#FF4B4B;color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;min-height:30px;">로그인</button>
  </div>
  <div class="header-top">
    <div class="logo">⚡바로알바</div>
    <div class="search-bar">
      <span class="icon">🔍</span>
      <input type="text" placeholder="지역, 업종 검색...">
    </div>
    <button class="location-btn" id="user-avatar" onclick="avatarOrGps()" title="메뉴/위치">📍</button>
  </div>
  <div class="filter-chips">
    <div class="chip active" onclick="filterJobs(this, null)">전체</div>
    <div class="chip" onclick="filterJobs(this, 'F&B')">음식·카페</div>
    <div class="chip" onclick="filterJobs(this, '물류')">물류·배달</div>
    <div class="chip" onclick="filterJobs(this, '판매')">판매·서비스</div>
    <div class="chip" onclick="filterJobs(this, '청소')">청소·관리</div>
    <div class="chip" onclick="filterJobs(this, '이벤트')">이벤트</div>
    <div class="chip" onclick="filterJobs(this, '🔥급구')">🔥 급구</div>
  </div>
</div>

<!-- ── 지도 ── -->
<div id="map"></div>

<!-- ── 업주 공고 올리기 FAB ── -->
<button class="fab" id="fab-post" style="display:none" onclick="openPostModal()">
  ＋ 공고 올리기
</button>

<!-- ── 하단 패널 ── -->
<div class="bottom-panel">
  <div class="panel-handle" onclick="togglePanel()">
    <div style="flex:1">
      <div class="handle-bar"></div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="panel-title">내 주변 알바</span>
        <span class="panel-count" id="job-count">불러오는 중...</span>
      </div>
    </div>
  </div>
  <div class="card-list" id="card-list"></div>
</div>

<!-- ── 상세 모달 ── -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal"><div class="modal-body" id="modal-body"></div></div>
</div>

<!-- ── 공고 등록 모달 ── -->
<div class="modal-overlay" id="post-modal-overlay" onclick="closePostModal(event)">
  <div class="modal" style="max-height:92dvh;">
    <div class="modal-body">
      <div class="modal-handle"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <div style="font-size:18px; font-weight:800; color:#222;">⚡ 공고 올리기</div>
        <button class="modal-close" onclick="closePostModalDirect()">✕</button>
      </div>
      <div class="post-form-group">
        <label class="post-form-label">업체명 *</label>
        <input class="post-form-input" id="post-biz" type="text" placeholder="예: 스타벅스 하단점">
      </div>

// ── 지도 초기화 ───────────────────────────────────────────────────────────────
function initMap(jobs, lat, lng) {
  map = L.map('map', { zoomControl: false }).setView([lat || userLat, lng || userLng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

  }).addTo(map);

  renderMarkers(jobs);
  renderCards(jobs);
}

// ── GPS 위치 가져오기 ──────────────────────────────────────────────────────────
function getUserLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      ()  => resolve(null),
      { timeout: 6000, enableHighAccuracy: false }
    );
  });
}

// ── 마커 생성 ─────────────────────────────────────────────────────────────────
function getWageDelta(job) {
  const hist = job.wageHistory;
  if (hist.length < 2) return 0;
  return job.currentWage - hist[hist.length - 2];
}

function createMarkerHtml(job) {
  const delta = getWageDelta(job);
  const cls   = delta > 0 ? 'surge' : delta < 0 ? 'cool' : '';
  const arrow = delta > 0 ? `↑+${(delta/1000).toFixed(0)}k` : delta < 0 ? `↓${(Math.abs(delta)/1000).toFixed(0)}k` : '';
  const wage  = (job.currentWage / 10000).toFixed(1) + '만';
  const fire  = job.status === 'urgent' ? '🔥 ' : '';
  return `<div class="job-marker ${cls}">${fire}${wage}${arrow ? ' ' + arrow : ''}</div>`;
}

function renderMarkers(jobs) {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  jobs.forEach(job => {
    const icon = L.divIcon({ html: createMarkerHtml(job), className: '', iconSize: null, iconAnchor: [0, 20] });
    markers[job.id] = L.marker([job.lat, job.lng], { icon }).addTo(map)
      .on('click', () => { selectJob(job.id); openModal(job.id); });
  });
}

function wageDeltaHtml(job) {
  const d = getWageDelta(job);
  if (d > 0) return `<span class="wage-delta up">↑+${d.toLocaleString()}원</span>`;
  if (d < 0) return `<span class="wage-delta down">↓${Math.abs(d).toLocaleString()}원</span>`;
  return `<span class="wage-delta flat">변동없음</span>`;
}

function estimatePay(job) {
  const m = job.duration.match(/(\d+(\.\d+)?)/);
  return m ? (job.currentWage * parseFloat(m[1])).toLocaleString() + '원' : '-';
}

function formatStartTime(iso) {
  if (!iso) return '즉시';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '즉시';
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((target - today) / 86400000);
  const hhmm = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
  if (diff === 0) return `오늘 ${hhmm}`;
  if (diff === 1) return `내일 ${hhmm}`;
  return `${d.getMonth()+1}/${d.getDate()} ${hhmm}`;
}

  const startTime    = (dateVal && timeVal) ? new Date(`${dateVal}T${timeVal}:00`).toISOString() : null;

  if (!biz || !title || !selectedCategory) { showToast('⚠️ 업체명, 공고 제목, 업종은 필수입니다.'); return; }
  if (!wage || wage < 10030) { showToast('⚠️ 시급은 최저시급(10,030원) 이상이어야 합니다.'); return; }
  if (!dateVal || !timeVal) { showToast('⚠️ 근무 날짜와 시작 시각을 선택해주세요.'); return; }

  const btn = document.getElementById('post-submit-btn');
  btn.disabled = true; btn.textContent = '등록 중...';

  const center = map.getCenter();
  const { data: bizData, error: bizErr } = await db.from('businesses').select('id').eq('kakao_uid', currentUserId).single();
  if (bizErr || !bizData) {
    showToast('⚠️ 업주 프로필을 찾을 수 없습니다.');
    btn.disabled = false; btn.textContent = '⚡ 공고 등록하기'; return;
  }

  const insertRow = {
    business_id: bizData.id, biz_name: biz, title, category: selectedCategory,
    lat: center.lat, lng: center.lng, base_wage: wage, current_wage: wage,
    needed_count: needed, start_time: startTime, status: isUrgent ? 'urgent' : 'open',
  };
  if (durationHrs) insertRow.duration_hours = durationHrs;
  const { error } = await db.from('job_postings').insert(insertRow);

  btn.disabled = false; btn.textContent = '⚡ 공고 등록하기';
  if (error) { showToast('등록 실패: ' + error.message); return; }

  ['post-biz','post-title','post-wage','post-needed','post-date','post-duration'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('post-minute').value = '00';
  document.getElementById('post-urgent').checked = false;
  selectedCategory = null;
  document.querySelectorAll('.post-chip').forEach(c => c.classList.remove('selected'));
  closePostModalDirect();
  showToast('✅ 공고가 등록됐습니다! 지도에 바로 반영됩니다.');
}

// ── 내 지원 내역 ──────────────────────────────────────────────────────────────

  document.getElementById('user-menu').classList.remove('open');
  document.getElementById('app-modal-overlay').classList.add('open');

  body.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">불러오는 중...</div></div>';

  let { data: workerData } = await db.from('workers').select('id').eq('kakao_uid', currentUserId).maybeSingle();
  if (!workerData) {
    const { data: { session } } = await db.auth.getSession();
    const uname = session?.user?.user_metadata?.full_name || session?.user?.email?.split('@')[0] || '사용자';
    const { data: created } = await db.from('workers').insert({ kakao_uid: currentUserId, name: uname, phone: '' }).select('id').single();
    workerData = created;
  }
  if (!workerData) { body.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">프로필 생성에 실패했습니다.</div></div>'; return; }

  const { data, error } = await db.from('applications')
    .select('id, status, created_at, job_postings(id, title, biz_name, current_wage, start_time, duration_hours, status)')
    .eq('worker_id', workerData.id)
    .order('created_at', { ascending: false });

  if (error || !data?.length) {
    body.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">지원 내역이 없습니다.</div><div class="empty-sub">주변 알바에 지원해보세요!</div></div>';
    return;
  }

  const statusLabel = { pending: '검토 중', accepted: '합격', rejected: '불합격' };
  body.innerHTML = data.map(app => {
    const job = app.job_postings || {};
    const badge = `<span class="status-badge status-${app.status}">${statusLabel[app.status] || app.status}</span>`;
    const date = new Date(app.created_at).toLocaleDateString('ko-KR', { month:'long', day:'numeric' });
    return `
      <div class="app-card">
        <div class="app-card-top">
          <div><div class="app-biz">${job.biz_name || '-'}</div><div class="app-title">${job.title || '-'}</div></div>
          ${badge}
        </div>
        <div class="app-meta">⏰ ${job.start_time ? formatStartTime(job.start_time) : '즉시'} · ⌛ ${job.duration_hours ? job.duration_hours+'시간' : '-'} · 💰 ${(job.current_wage||0).toLocaleString()}원/시 · 지원일 ${date}</div>
      </div>`;
  }).join('');
}

// ── 내 공고 관리 ──────────────────────────────────────────────────────────────
let myPostingsCache = [];

async function openPostingsModal() {
  document.getElementById('user-menu').classList.remove('open');
  document.getElementById('manage-modal-title').textContent = '📝 내 공고 관리';
  document.getElementById('manage-modal-overlay').classList.add('open');
  await loadMyPostings();
}

function closeManageModal() {
  document.getElementById('manage-modal-overlay').classList.remove('open');
  document.getElementById('manage-modal-title').textContent = '📝 내 공고 관리';
}

async function loadMyPostings() {
  const body = document.getElementById('manage-modal-body');
  body.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">불러오는 중...</div></div>';

  const { data: bizData } = await db.from('businesses').select('id').eq('kakao_uid', currentUserId).single();
  if (!bizData) { body.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">업주 프로필을 찾을 수 없습니다.</div></div>'; return; }

  const { data, error } = await db.from('job_postings')
    .select('id, title, biz_name, current_wage, status, needed_count, created_at, start_time, duration_hours')
    .eq('business_id', bizData.id)
    .order('created_at', { ascending: false });

  if (error || !data?.length) {
    body.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">등록한 공고가 없습니다.</div><div class="empty-sub">공고 올리기 버튼으로 첫 공고를 올려보세요!</div></div>';
    return;
  }

  myPostingsCache = data;
  const statusLabel = { urgent:'🔥 급구', open:'모집중', filled:'마감' };
  body.innerHTML = data.map(job => `
    <div class="manage-card">
      <div class="manage-card-top">
        <div>
          <div class="manage-title">${job.title}</div>
          <div class="manage-meta">${job.biz_name} · ${(job.current_wage||0).toLocaleString()}원/시 · ${job.needed_count||1}명 모집</div>
          <div class="manage-meta">⏰ ${job.start_time ? formatStartTime(job.start_time) : '즉시'} · ⌛ ${job.duration_hours ? job.duration_hours+'시간' : '-'}</div>
        </div>
        <span class="status-badge ${job.status==='filled'?'status-rejected':job.status==='urgent'?'status-pending':'status-accepted'}">${statusLabel[job.status]||job.status}</span>
      </div>
      <div class="manage-actions">
        <button class="manage-btn manage-btn-view" onclick="viewApplicants('${job.id}', '${job.title.replace(/'/g,"\\'")}')">지원자 보기</button>
        ${job.status!=='filled' ? `<button class="manage-btn manage-btn-close" onclick="closePosting('${job.id}')">마감 처리</button>` : ''}
      </div>
    </div>
  `).join('');
}

async function viewApplicants(jobId, jobTitle) {
  document.getElementById('manage-modal-title').textContent = `👤 지원자 — ${jobTitle}`;
  const body = document.getElementById('manage-modal-body');
  body.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">불러오는 중...</div></div>';

  const { data, error } = await db.from('applications')
    .select('id, status, created_at, workers(id, name, phone)')
    .eq('job_posting_id', jobId)
    .order('created_at', { ascending: false });

  if (error || !data?.length) {
    body.innerHTML = `
      <button onclick="loadMyPostings();document.getElementById('manage-modal-title').textContent='📝 내 공고 관리'" style="background:none;border:none;color:#FF4B4B;font-weight:700;cursor:pointer;padding:4px 0;font-size:14px;margin-bottom:12px;">← 목록으로</button>
      <div class="empty-state"><div class="empty-icon">🙋</div><div class="empty-text">아직 지원자가 없습니다.</div></div>`;
    return;
  }

  const statusLabel = { pending:'검토 중', accepted:'합격', rejected:'불합격' };
  body.innerHTML = `
    <button onclick="loadMyPostings();document.getElementById('manage-modal-title').textContent='📝 내 공고 관리'" style="background:none;border:none;color:#FF4B4B;font-weight:700;cursor:pointer;padding:4px 0;font-size:14px;margin-bottom:14px;display:flex;align-items:center;gap:4px;">← 목록으로</button>
    ${data.map(app => {
      const w = app.workers || {};
      return `
        <div class="applicant-row">
          <div>
            <div class="applicant-name">${w.name || '이름 없음'}</div>
            <div class="applicant-phone">${w.phone || '-'} · <span class="status-badge status-${app.status}" style="font-size:10px;">${statusLabel[app.status]||app.status}</span></div>
          </div>
          ${app.status === 'pending' ? `
            <div class="applicant-btns">
              <button class="accept-btn" onclick="updateApplicationStatus('${app.id}','accepted','${jobId}','${jobTitle.replace(/'/g,"\\'")}')">합격</button>
              <button class="reject-btn" onclick="updateApplicationStatus('${app.id}','rejected','${jobId}','${jobTitle.replace(/'/g,"\\'")}')">불합격</button>
            </div>` : ''}
        </div>`;
    }).join('')}`;
}

async function updateApplicationStatus(appId, status, jobId, jobTitle) {
  const { error } = await db.from('applications').update({ status }).eq('id', appId);
  if (error) { showToast('업데이트 실패: ' + error.message); return; }
  showToast(status === 'accepted' ? '✅ 합격 처리됐습니다.' : '❌ 불합격 처리됐습니다.');
  await viewApplicants(jobId, jobTitle);
}

async function closePosting(jobId) {
  const { error } = await db.from('job_postings').update({ status: 'filled' }).eq('id', jobId);
  if (error) { showToast('처리 실패: ' + error.message); return; }
  showToast('✅ 공고가 마감 처리됐습니다.');
  await loadMyPostings();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Supabase ───────────────────────────────────────────────
const { createClient } = supabase;
const db = createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);

async function logout() {
  localStorage.removeItem('baroalba_guest');
  await db.auth.signOut();
  window.location.href = './login.html';
}

  document.getElementById('user-menu').classList.toggle('open');
}

// ── 역할 선택 모달 (Google 최초 로그인 시) ──────────────────
function showRoleSelectModal(user) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:20px;padding:28px 22px;width:100%;max-width:340px;text-align:center;">
        <div style="font-size:22px;font-weight:900;color:#222;margin-bottom:6px;">바로알바</div>
        <div style="font-size:14px;color:#888;margin-bottom:24px;">어떤 역할로 이용하시겠어요?</div>
        <div style="display:flex;gap:12px;margin-bottom:8px;">
          <button id="_role_worker" style="flex:1;padding:18px 10px;border:2.5px solid #eee;border-radius:14px;font-size:15px;font-weight:700;background:#fff;cursor:pointer;">
            👷 알바생<br><span style="font-size:11px;font-weight:400;color:#aaa;">일자리를 찾고 있어요</span>
          </button>
          <button id="_role_biz" style="flex:1;padding:18px 10px;border:2.5px solid #eee;border-radius:14px;font-size:15px;font-weight:700;background:#fff;cursor:pointer;">
            🏢 업주<br><span style="font-size:11px;font-weight:400;color:#aaa;">알바를 구하고 있어요</span>
          </button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#_role_worker').onclick = () => { document.body.removeChild(overlay); resolve('worker'); };
    overlay.querySelector('#_role_biz').onclick    = () => { document.body.removeChild(overlay); resolve('business'); };
    overlay.querySelector('#_role_worker').addEventListener('click', function() { this.style.borderColor='#FF4B4B'; });
    overlay.querySelector('#_role_biz').addEventListener('click', function() { this.style.borderColor='#FF4B4B'; });
  });
}

// ── 인증 초기화 ────────────────────────────────────────────
async function initAuth() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(console.warn);

  const { data: { session } } = await db.auth.getSession();
  if (session) {
    localStorage.removeItem('baroalba_guest');
  } else {
    if (localStorage.getItem('baroalba_guest')) {
      setUserUI({ name: '게스트', role: 'worker', isGuest: true });
      document.getElementById('guest-banner').style.display = 'flex';
      return 'guest';
    }
    window.location.href = './login.html';
    return false;
  }

  const user = session.user;
  let role = user.user_metadata?.baroalba_role;

  if (!role) {
    // Google OAuth 등 role 미설정 → 역할 선택 모달 표시 후 대기
    const chosen = await showRoleSelectModal(user);
    if (!chosen) { window.location.href = './login.html'; return false; }
    role = chosen;
    await db.auth.updateUser({ data: { baroalba_role: role } });
  }

  const name      = user.user_metadata?.full_name || user.email?.split('@')[0] || '사용자';
  const avatarUrl = user.user_metadata?.avatar_url || '';

  currentRole   = role;
  currentUserId = user.id;

  setUserUI({ name, role, avatarUrl });

  if (role === 'business') {
    document.getElementById('menu-item-business').style.display = 'flex';
    document.getElementById('fab-post').style.display = 'flex';
  } else {
    document.getElementById('menu-item-worker').style.display = 'flex';
  }

  // 프로필 자동 생성 (upsert 대신 select→insert로 스키마 캐시 문제 우회)
  const table = role === 'business' ? 'businesses' : 'workers';
  const { data: existing } = await db.from(table).select('id').eq('kakao_uid', user.id).maybeSingle();
  if (!existing) {
    await db.from(table).insert({
      kakao_uid: user.id,
      name: name,
      phone: user.user_metadata?.phone || '',
    });
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('#user-menu') && !e.target.closest('#user-avatar'))
      document.getElementById('user-menu').classList.remove('open');
  });

  return true;
}

function avatarOrGps() {
  if (currentUserId) toggleUserMenu();
  else goToMyLocation();
}

function setUserUI({ name, role, avatarUrl, isGuest }) {
  const btn = document.getElementById('user-avatar');
  btn.style.cssText = 'width:34px;height:34px;border-radius:50%;padding:0;overflow:hidden;flex-shrink:0;';
  if (avatarUrl) {
    btn.innerHTML = `<img src="${avatarUrl}" alt="${name[0]||'?'}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.textContent='${name?.[0]||'?'}'">`;
  } else if (!isGuest) {
    btn.textContent = name?.[0]?.toUpperCase() || '?';
    btn.style.fontSize = '14px';
    btn.style.fontWeight = '700';
  } else {
    btn.textContent = '📍';
    btn.style.fontSize = '18px';
  }
  document.getElementById('menu-name').textContent = isGuest ? '게스트' : name;
  document.getElementById('menu-role-badge').textContent = role === 'business' ? '업주' : '알바생';
}

// ── DB 공고 로드 (GPS 좌표 파라미터 지원) ─────────────────
async function loadJobsFromDB(lat, lng) {
  const { data, error } = await db.rpc('nearby_jobs', {
    user_lat: lat ?? APP_CONFIG.DEFAULT_LAT,
    user_lng: lng ?? APP_CONFIG.DEFAULT_LNG,
    radius_meters: APP_CONFIG.DEFAULT_RADIUS_M
  });
  if (error || !data?.length) return null;
  return data.map(j => ({
    id: j.id, biz: j.biz_name, title: j.title, category: j.category || 'F&B',
    lat: j.lat, lng: j.lng, baseWage: j.base_wage, currentWage: j.current_wage,
    wageHistory: [j.base_wage, j.current_wage].filter((v,i,a) => a.indexOf(v)===i),
    status: j.status, needed: j.needed_count,
    bizRating: parseFloat(j.biz_rating)||0, bizReviews: j.biz_reviews||0, bizKindness: parseFloat(j.biz_kindness)||0,
    workerRating: 4.0, workerRatingCount: 0, address: '', description: '',
    startTime: j.start_time ? formatStartTime(j.start_time) : '즉시',
    duration: j.duration_hours ? `${j.duration_hours}시간` : '-',
  }));
}

// ── Realtime ───────────────────────────────────────────────
function subscribeRealtime() {
  db.channel('job-live')
    .on('postgres_changes', { event:'*', schema:'public', table:'job_postings' }, async () => {
      const jobs = await loadJobsFromDB(userLat, userLng);
      if (jobs) { currentJobs = jobs; renderMarkers(jobs); renderCards(jobs); showToast('🔄 구인 정보가 업데이트됐습니다.'); }
    }).subscribe();
}

// ── 지원하기 ──────────────────────────────────────────────
async function applyJob(id) {
  const job = currentJobs.find(j => j.id === id);
  if (!job || job.status === 'filled') return;

  if (localStorage.getItem('baroalba_guest')) {
    closeModalDirect();
    showToast('⚠️ 지원하려면 로그인이 필요합니다.');
    setTimeout(() => window.location.href = './login.html', 1500);
    return;
  }
  if (currentRole === 'business') { showToast('⚠️ 업주 계정으로는 지원할 수 없습니다.'); return; }

  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = './login.html'; return; }

  let { data: workerData } = await db.from('workers').select('id').eq('kakao_uid', session.user.id).maybeSingle();
  if (!workerData) {
    const uname = session.user.user_metadata?.full_name || session.user.email?.split('@')[0] || '사용자';
    const { data: created, error: ce } = await db.from('workers')
      .insert({ kakao_uid: session.user.id, name: uname, phone: '' })
      .select('id').single();
    if (ce) { showToast('⚠️ 프로필 생성 실패: ' + ce.message); return; }
    workerData = created;
  }

  const { error } = await db.from('applications').insert({ job_posting_id: id, worker_id: workerData.id, status: 'pending' });
  closeModalDirect();
  if (error?.code === '23505') showToast('이미 지원한 공고입니다.');
  else if (error) showToast('지원 실패: ' + error.message);
  else showToast(`✅ ${job.biz} 지원 완료! 업주 확인 후 연락드립니다.`);
}

// ── 시작 ──────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const authResult = await initAuth();
  if (!authResult) return;

  if (authResult === 'guest') {
    currentJobs = JOBS;
    initMap(JOBS, APP_CONFIG.DEFAULT_LAT, APP_CONFIG.DEFAULT_LNG);
    showToast('📋 샘플 데이터로 표시 중 · 로그인하면 실제 공고를 볼 수 있어요');
    return;
  }

  // GPS 위치 먼저 시도
  showToast('📍 현재 위치 확인 중...');
  const pos = await getUserLocation();
  if (pos) {
    userLat = pos.lat;
    userLng = pos.lng;
  }

  const dbJobs = await loadJobsFromDB(userLat, userLng);
  currentJobs = dbJobs || JOBS;
  initMap(currentJobs, userLat, userLng);

  if (dbJobs) showToast(`📡 ${pos ? '현재 위치' : '기본 위치'} 기준 ${dbJobs.length}개 공고`);
  else        showToast('📋 샘플 데이터로 표시 중');

  subscribeRealtime();
});
