<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF4B4B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="바로알바">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <title>바로알바 — 실시간 지도 알바 매칭</title>
  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (async () => {
      const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await db.auth.getSession();
      if (!session && !localStorage.getItem('baroalba_guest')) window.location.replace('./login.html');
    })();
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f5f5f5; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── 상단 헤더 ── */
    .header {
      background: #fff;
      padding: 12px 16px 0;
      z-index: 1000;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .logo {
      font-size: 18px;
      font-weight: 800;
      color: #FF4B4B;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
    .search-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background: #f0f0f0;
      border-radius: 10px;
      padding: 8px 12px;
      gap: 8px;
    }
    .search-bar input {
      border: none;
      background: transparent;
      font-size: 14px;
      outline: none;
      flex: 1;
      color: #333;
    }
    .search-bar .icon { font-size: 16px; color: #888; }
    .location-btn {
      background: #FF4B4B;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    /* 유저 아바타 */
    .user-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #FF4B4B;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      overflow: hidden;
      border: 2px solid #FF4B4B;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* 유저 메뉴 드롭다운 */
    .user-menu {
      display: none;
      position: fixed;
      top: 60px;
      right: 16px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.14);
      z-index: 2000;
      min-width: 200px;
      overflow: hidden;
      animation: fadeIn 0.15s ease;
    }
    .user-menu.open { display: block; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }
    .user-menu-header {
      padding: 16px;
      background: #FFF5F5;
      border-bottom: 1px solid #f0f0f0;
    }
    .user-menu-name { font-size: 15px; font-weight: 700; color: #222; }
    .user-menu-role {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .role-badge {
      background: #FF4B4B;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 8px;
    }
    .user-menu-item {
      padding: 13px 16px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #f5f5f5;
      transition: background 0.1s;
    }
    .user-menu-item:last-child { border-bottom: none; }
    .user-menu-item:hover { background: #f9f9f9; }
    .user-menu-item.logout { color: #FF4B4B; }

    /* 필터 칩 */
    .filter-chips {
      display: flex;
      gap: 7px;
      padding-bottom: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip {
      white-space: nowrap;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid #ddd;
      background: #fff;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip.active { background: #FF4B4B; color: #fff; border-color: #FF4B4B; }
    .chip:hover:not(.active) { border-color: #FF4B4B; color: #FF4B4B; }

    /* ── 지도 ── */
    #map {
      flex: 1;
      z-index: 1;
      min-height: 0;
    }

    /* 커스텀 마커 */
    .job-marker {
      background: #fff;
      border: 2px solid #FF4B4B;
      border-radius: 20px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #FF4B4B;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .job-marker.surge { border-color: #FF4B4B; background: #FF4B4B; color: #fff; }
    .job-marker.cool  { border-color: #4B8BFF; background: #fff; color: #4B8BFF; }

    /* ── 하단 패널 ── */
    .bottom-panel {
      background: #fff;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
      z-index: 1000;
      transition: height 0.3s ease;
    }
    .panel-handle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 4px;
      cursor: pointer;
    }
    .handle-bar {
      width: 36px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      margin: 0 auto 4px;
    }
    .panel-title { font-size: 14px; font-weight: 700; color: #222; }
    .panel-count { font-size: 13px; color: #FF4B4B; font-weight: 600; }

    /* 카드 스크롤 */
    .card-list {
      display: flex;
      gap: 12px;
      padding: 8px 16px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .card-list::-webkit-scrollbar { display: none; }

    /* 개별 카드 */
    .job-card {
      min-width: 220px;
      background: #fff;
      border: 1.5px solid #eee;
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      flex-shrink: 0;
    }
    .job-card:hover { border-color: #FF4B4B; box-shadow: 0 4px 16px rgba(255,75,75,0.12); transform: translateY(-2px); }
    .job-card.selected { border-color: #FF4B4B; box-shadow: 0 4px 16px rgba(255,75,75,0.2); }

    .card-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
    }
    .badge-urgent { background: #FFF0F0; color: #FF4B4B; }
    .badge-new    { background: #F0F7FF; color: #4B8BFF; }
    .badge-filled { background: #F0F0F0; color: #999; }

    .card-biz { font-size: 13px; color: #888; margin-bottom: 3px; }
    .card-title { font-size: 15px; font-weight: 700; color: #222; margin-bottom: 8px; }

    .wage-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 6px;
    }
    .wage-amount { font-size: 20px; font-weight: 800; color: #222; }
    .wage-unit { font-size: 12px; color: #888; }
    .wage-delta {
      font-size: 12px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 6px;
    }
    .wage-delta.up   { background: #FFF0F0; color: #FF4B4B; }
    .wage-delta.down { background: #F0F5FF; color: #4B8BFF; }
    .wage-delta.flat { background: #F5F5F5; color: #999; }

    .card-meta {
      display: flex;
      gap: 8px;
      font-size: 11px;
      color: #999;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .card-meta span { display: flex; align-items: center; gap: 2px; }

    .rating-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .stars { color: #FFBE00; letter-spacing: -1px; }
    .rating-label { color: #888; }
    .apply-btn {
      background: #FF4B4B;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .apply-btn:hover { background: #e03333; }
    .apply-btn:disabled { background: #ccc; cursor: default; }

    /* ── 모달 (상세) ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 2000;
      align-items: flex-end;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-height: 80dvh;
      overflow-y: auto;
      padding: 0 0 32px;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid #f0f0f0;
      position: sticky;
      top: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-handle { width: 36px; height: 4px; background: #e0e0e0; border-radius: 2px; margin: 0 auto 12px; }
    .modal-close {
      font-size: 20px;
      color: #888;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
    }
    .modal-body { padding: 20px; }
    .modal-biz { font-size: 14px; color: #888; margin-bottom: 4px; }
    .modal-title { font-size: 20px; font-weight: 800; color: #222; margin-bottom: 16px; }

    .modal-wage-block {
      background: #FFF5F5;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .modal-wage-main {
      font-size: 28px;
      font-weight: 800;
      color: #FF4B4B;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .modal-wage-unit { font-size: 14px; color: #888; font-weight: 400; }
    .modal-wage-history {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .history-dot {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
      background: #fff;
      color: #666;
      border: 1px solid #eee;
    }
    .history-dot.current { background: #FF4B4B; color: #fff; border-color: #FF4B4B; font-weight: 700; }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .info-item {
      background: #f8f8f8;
      border-radius: 10px;
      padding: 12px;
    }
    .info-label { font-size: 11px; color: #999; margin-bottom: 4px; }
    .info-value { font-size: 14px; font-weight: 700; color: #222; }

    .section-title { font-size: 14px; font-weight: 700; color: #222; margin-bottom: 10px; }
    .rating-detail {
      background: #f8f8f8;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .rating-detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .rating-detail-row:last-child { margin-bottom: 0; }
    .rating-detail-label { font-size: 13px; color: #555; }
    .rating-detail-val { display: flex; align-items: center; gap: 6px; }
    .big-star { color: #FFBE00; font-size: 14px; }
    .rating-num { font-size: 14px; font-weight: 700; color: #222; }
    .review-count { font-size: 11px; color: #aaa; }

    .modal-apply {
      background: #FF4B4B;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .modal-apply:hover { background: #e03333; }
    .modal-apply:disabled { background: #ccc; cursor: default; }

    /* 토스트 */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ── 업주 FAB ── */
    .fab {
      position: fixed;
      bottom: 148px;
      right: 16px;
      background: #FF4B4B;
      color: #fff;
      border: none;
      border-radius: 28px;
      padding: 13px 18px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(255,75,75,0.45);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .fab:active { transform: scale(0.95); box-shadow: 0 2px 8px rgba(255,75,75,0.3); }

    /* ── 공고 등록 폼 ── */
    .post-form-group { margin-bottom: 14px; }
    .post-form-label { font-size: 12px; font-weight: 700; color: #666; margin-bottom: 6px; display: block; }
    .post-form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #eee;
      border-radius: 10px;
      font-size: 14px;
      color: #222;
      outline: none;
      transition: border-color 0.2s;
      background: #fafafa;
    }
    .post-form-input:focus { border-color: #FF4B4B; background: #fff; }
    .post-form-input::placeholder { color: #bbb; }
    .post-cat-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .post-chip {
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1.5px solid #ddd;
      background: #fff;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
    }
    .post-chip.selected { background: #FF4B4B; color: #fff; border-color: #FF4B4B; }
    .post-location-box {
      background: #f0f7ff;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #555;
      line-height: 1.6;
      border: 1px solid #d0e8ff;
    }
    .post-row { display: flex; gap: 10px; }
    .post-row .post-form-group { flex: 1; }

    /* 반응형 */
    @media (min-width: 600px) {
      .card-list { padding: 8px 20px 20px; }
      .job-card { min-width: 260px; }
    }
  </style>
</head>
<body>

<!-- ── 유저 드롭다운 메뉴 ── -->
<div class="user-menu" id="user-menu">
  <div class="user-menu-header">
    <div class="user-menu-name" id="menu-name">-</div>
    <div class="user-menu-role">
      <span class="role-badge" id="menu-role-badge">알바생</span>
      <span id="menu-provider" style="font-size:11px;color:#aaa;"></span>
    </div>
  </div>
  <div class="user-menu-item" id="menu-item-worker" style="display:none">📋 내 지원 내역</div>
  <div class="user-menu-item" id="menu-item-business" style="display:none">📝 내 공고 관리</div>
  <div class="user-menu-item">👤 내 프로필</div>
  <div class="user-menu-item logout" onclick="logout()">🚪 로그아웃</div>
</div>

<!-- ── 헤더 ── -->
<div class="header">
  <div id="guest-banner" style="display:none; background:#FFF5F5; border-bottom:1px solid #ffe0e0; padding:8px 16px; align-items:center; justify-content:space-between;">
    <span style="font-size:12px; color:#888;">게스트 모드 · 지원하려면 로그인이 필요합니다</span>
    <button onclick="localStorage.removeItem('baroalba_guest');window.location.href='./login.html'" style="background:#FF4B4B;color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;">로그인</button>
  </div>
  <div class="header-top">
    <div class="logo">⚡바로알바</div>
    <div class="search-bar">
      <span class="icon">🔍</span>
      <input type="text" placeholder="지역, 업종 검색...">
    </div>
    <button class="location-btn" onclick="goToMyLocation()" title="내 위치">📍</button>
    <div class="user-avatar" id="user-avatar" onclick="toggleUserMenu()">?</div>
  </div>
  <div class="filter-chips">
    <div class="chip active" onclick="filterJobs(this, null)">전체</div>
    <div class="chip" onclick="filterJobs(this, 'F&B')">음식·카페</div>
    <div class="chip" onclick="filterJobs(this, '물류')">물류·배달</div>
    <div class="chip" onclick="filterJobs(this, '판매')">판매·서비스</div>
    <div class="chip" onclick="filterJobs(this, '청소')">청소·관리</div>
    <div class="chip" onclick="filterJobs(this, '이벤트')">이벤트</div>
    <div class="chip" onclick="filterJobs(this, '🔥급구')">🔥 급구</div>
  </div>
</div>

<!-- ── 지도 ── -->
<div id="map"></div>

<!-- ── 업주 공고 올리기 FAB ── -->
<button class="fab" id="fab-post" style="display:none" onclick="openPostModal()">
  ＋ 공고 올리기
</button>

<!-- ── 하단 패널 ── -->
<div class="bottom-panel">
  <div class="panel-handle" onclick="togglePanel()">
    <div style="flex:1">
      <div class="handle-bar"></div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="panel-title">내 주변 알바</span>
        <span class="panel-count" id="job-count">6개 모집 중</span>
      </div>
    </div>
  </div>
  <div class="card-list" id="card-list"></div>
</div>

<!-- ── 상세 모달 ── -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- ── 공고 등록 모달 ── -->
<div class="modal-overlay" id="post-modal-overlay" onclick="closePostModal(event)">
  <div class="modal" style="max-height:90dvh;">
    <div class="modal-body">
      <div class="modal-handle"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <div style="font-size:18px; font-weight:800; color:#222;">⚡ 공고 올리기</div>
        <button class="modal-close" onclick="closePostModalDirect()">✕</button>
      </div>

      <div class="post-form-group">
        <label class="post-form-label">업체명 *</label>
        <input class="post-form-input" id="post-biz" type="text" placeholder="예: 스타벅스 하단점">
      </div>

      <div class="post-form-group">
        <label class="post-form-label">공고 제목 *</label>
        <input class="post-form-input" id="post-title" type="text" placeholder="예: 주말 홀 서빙 알바 급구">
      </div>

      <div class="post-form-group">
        <label class="post-form-label">업종 *</label>
        <div class="post-cat-chips" id="post-cat-chips">
          <div class="post-chip" onclick="selectCat(this,'F&B')">음식·카페</div>
          <div class="post-chip" onclick="selectCat(this,'물류')">물류·배달</div>
          <div class="post-chip" onclick="selectCat(this,'판매')">판매·서비스</div>
          <div class="post-chip" onclick="selectCat(this,'청소')">청소·관리</div>
          <div class="post-chip" onclick="selectCat(this,'이벤트')">이벤트</div>
        </div>
      </div>

      <div class="post-row">
        <div class="post-form-group">
          <label class="post-form-label">시급 (원) *</label>

function initMap(jobs) {
  map = L.map('map', { zoomControl: false }).setView([APP_CONFIG.DEFAULT_LAT, APP_CONFIG.DEFAULT_LNG], 15);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  L.control.zoom({ position: 'topright' }).addTo(map);

  renderMarkers(jobs);
  renderCards(jobs);
}

// ── 마커 생성 ─────────────────────────────────────────────────────────────────
function getWageDelta(job) {
  const hist = job.wageHistory;
  if (hist.length < 2) return 0;
  return job.currentWage - hist[hist.length - 2];
}

function createMarkerHtml(job) {
  const delta = getWageDelta(job);
  const surge = delta > 0;
  const drop  = delta < 0;
  const cls   = surge ? 'surge' : drop ? 'cool' : '';
  const arrow = surge ? `↑+${(delta/1000).toFixed(0)}k` : drop ? `↓${(delta/1000).toFixed(0)}k` : '';
  const wage  = (job.currentWage / 10000).toFixed(1) + '만';
  const fire  = job.status === 'urgent' ? '🔥 ' : '';
  return `<div class="job-marker ${cls}">${fire}${wage}${arrow ? ' ' + arrow : ''}</div>`;
}

function renderMarkers(jobs) {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  jobs.forEach(job => {
    const icon = L.divIcon({
      html: createMarkerHtml(job),
      className: '',
      iconSize: null,
      iconAnchor: [0, 20],
    });

    const m = L.marker([job.lat, job.lng], { icon })
      .addTo(map)
      .on('click', () => {
        selectJob(job.id);
        openModal(job.id);
      });

    markers[job.id] = m;
  });
}

// ── 카드 렌더 ─────────────────────────────────────────────────────────────────
function starStr(rating) {
  const full = Math.round(rating);
  return '★'.repeat(full) + '☆'.repeat(5 - full);
}

function wageDeltaHtml(job) {
  const delta = getWageDelta(job);
  if (delta > 0) return `<span class="wage-delta up">↑+${delta.toLocaleString()}원</span>`;
  if (delta < 0) return `<span class="wage-delta down">↓${Math.abs(delta).toLocaleString()}원</span>`;
  return `<span class="wage-delta flat">변동없음</span>`;
}

function badgeHtml(job) {
  if (job.status === 'urgent') return `<span class="card-badge badge-urgent">🔥 급구</span>`;
  if (job.status === 'filled') return `<span class="card-badge badge-filled">마감</span>`;
  return `<span class="card-badge badge-new">모집중</span>`;
}

function renderCards(jobs) {
  const list = document.getElementById('card-list');
  document.getElementById('job-count').textContent = jobs.length + '개 모집 중';

  list.innerHTML = jobs.map(job => `
    <div class="job-card ${selectedJobId === job.id ? 'selected' : ''}" id="card-${job.id}" onclick="handleCardClick('${job.id}')">
      ${badgeHtml(job)}
      <div class="card-biz">${job.biz}</div>
      <div class="card-title">${job.title}</div>
      <div class="wage-row">
        <span class="wage-amount">${job.currentWage.toLocaleString()}원</span>
        <span class="wage-unit">/ 시간</span>
        ${wageDeltaHtml(job)}
      </div>
      <div class="card-meta">
        <span>⏰ ${job.startTime}</span>
        <span>⌛ ${job.duration}</span>
        <span>👥 ${job.needed}명</span>
      </div>
      <div class="rating-row">
        <div>
          <span class="stars">${starStr(job.bizRating)}</span>
          <span class="rating-label"> ${job.bizRating} (${job.bizReviews})</span>
        </div>
        <button class="apply-btn" ${job.status === 'filled' ? 'disabled' : ''} onclick="event.stopPropagation(); applyJob('${job.id}')">
          ${job.status === 'filled' ? '마감' : '지원하기'}
        </button>
      </div>
    </div>
  `).join('');
}

// ── 상호작용 ──────────────────────────────────────────────────────────────────
function selectJob(id) {
  selectedJobId = id;
  document.querySelectorAll('.job-card').forEach(el => el.classList.remove('selected'));
  const card = document.getElementById('card-' + id);
  if (card) {
    card.classList.add('selected');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
  const job = currentJobs.find(j => j.id === id);
  if (job) map.setView([job.lat, job.lng], 16, { animate: true });
}

function handleCardClick(id) {
  selectJob(id);
  openModal(id);
}

function filterJobs(chipEl, category) {
  currentFilter = category;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chipEl.classList.add('active');
  const filtered = category ? currentJobs.filter(j => j.category === category || j.title.includes(category)) : currentJobs;
  renderMarkers(filtered);
  renderCards(filtered);
}

function goToMyLocation() {
  if (!navigator.geolocation) { showToast('위치 정보를 지원하지 않는 브라우저입니다.'); return; }
  showToast('위치 찾는 중...');
  navigator.geolocation.getCurrentPosition(pos => {
    map.setView([pos.coords.latitude, pos.coords.longitude], 15, { animate: true });
    showToast('현재 위치로 이동했습니다.');
  }, () => showToast('위치 정보를 가져올 수 없습니다.'));
}

// ── 모달 ──────────────────────────────────────────────────────────────────────

    ? `<span style="color:#4B8BFF">▼ ${Math.abs(delta).toLocaleString()}원 인하됨</span>`

      <div class="info-item">
        <div class="info-label">근무 시간</div>
        <div class="info-value">${job.duration}</div>
      </div>
      <div class="info-item">
        <div class="info-label">모집 인원</div>
        <div class="info-value">${job.needed}명</div>

      <div class="info-item">
        <div class="info-label">예상 급여</div>
        <div class="info-value" style="color:#FF4B4B">${estimatePay(job)}</div>

        <div class="rating-detail-val">
          <span class="big-star">★</span>
          <span class="rating-num">${job.bizRating}</span>
          <span class="review-count">(${job.bizReviews}개 리뷰)</span>

        <span class="rating-detail-label">업주 친절도</span>
        <div class="rating-detail-val">
          <span class="big-star">★</span>
          <span class="rating-num">${job.bizKindness}</span>
        </div>
      </div>
      <div class="rating-detail-row">
        <span class="rating-detail-label">알바생 평점</span>
        <div class="rating-detail-val">
          <span class="big-star">★</span>

    <button class="modal-apply" onclick="applyJob('${job.id}')" ${job.status === 'filled' ? 'disabled' : ''}>

function estimatePay(job) {
  const match = job.duration.match(/(\d+)/);
  if (!match) return '-';
  const hours = parseInt(match[1]);
  return (job.currentWage * hours).toLocaleString() + '원';
}

function closeModal(e) {

function selectCat(el, cat) {
  selectedCategory = cat;
  document.querySelectorAll('.post-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');

async function submitPost() {
  const biz      = document.getElementById('post-biz').value.trim();
  const title    = document.getElementById('post-title').value.trim();
  const wage     = parseInt(document.getElementById('post-wage').value);
  const needed   = parseInt(document.getElementById('post-needed').value) || 1;
  const startTime = document.getElementById('post-start').value.trim() || '즉시';
  const duration  = document.getElementById('post-duration').value.trim() || '-';
  const isUrgent  = document.getElementById('post-urgent').checked;

  if (!biz || !title || !selectedCategory) {
    showToast('⚠️ 업체명, 공고 제목, 업종은 필수입니다.');
    return;
  }
  if (!wage || wage < 10030) {
    showToast('⚠️ 시급은 최저시급(10,030원) 이상이어야 합니다.');
    return;
  }

  const btn = document.getElementById('post-submit-btn');
  btn.disabled = true;
  btn.textContent = '등록 중...';

  const center = map.getCenter();

  // businesses 테이블에서 business_id 조회
  const { data: bizData, error: bizErr } = await db.from('businesses')
    .select('id').eq('kakao_uid', currentUserId).single();

  if (bizErr || !bizData) {
    showToast('⚠️ 업주 프로필을 찾을 수 없습니다. 다시 로그인해주세요.');
    btn.disabled = false;
    btn.textContent = '⚡ 공고 등록하기';
    return;
  }

  const { error } = await db.from('job_postings').insert({
    business_id: bizData.id,
    biz_name: biz,
    title,
    category: selectedCategory,
    lat: center.lat,
    lng: center.lng,
    base_wage: wage,
    current_wage: wage,
    needed_count: needed,
    start_time: startTime,
    duration,
    status: isUrgent ? 'urgent' : 'open',
  });

  btn.disabled = false;
  btn.textContent = '⚡ 공고 등록하기';

  if (error) {
    showToast('등록 실패: ' + error.message);
    return;
  }

  // 폼 초기화
  ['post-biz','post-title','post-wage','post-needed','post-start','post-duration'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('post-urgent').checked = false;
  selectedCategory = null;
  document.querySelectorAll('.post-chip').forEach(c => c.classList.remove('selected'));

  closePostModalDirect();
  showToast('✅ 공고가 등록됐습니다! 지도에 바로 반영됩니다.');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

}

// ── 인증 초기화 ────────────────────────────────────────────
async function initAuth() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(console.warn);

  const { data: { session } } = await db.auth.getSession();
  if (session) {
    localStorage.removeItem('baroalba_guest');
  } else {
    if (localStorage.getItem('baroalba_guest')) {
      setUserUI({ name: '게스트', role: 'worker', isGuest: true });
      document.getElementById('guest-banner').style.display = 'flex';
      return 'guest';
    }
    window.location.href = './login.html';
    return false;
  }

  const user = session.user;
  if (!user.user_metadata?.baroalba_role) {
    window.location.href = './login.html';
    return false;
  }

  const name      = user.user_metadata?.full_name || user.email;
  const role      = user.user_metadata?.baroalba_role;
  const avatarUrl = user.user_metadata?.avatar_url || '';

  currentRole   = role;
  currentUserId = user.id;

  setUserUI({ name, role, avatarUrl });

  // 역할별 메뉴 표시
  if (role === 'business') {
    document.getElementById('menu-item-business').style.display = 'flex';
    document.getElementById('fab-post').style.display = 'flex';
  } else {
    document.getElementById('menu-item-worker').style.display = 'flex';
  }

  // workers/businesses 레코드 없으면 자동 생성
  const table = role === 'business' ? 'businesses' : 'workers';
  await db.from(table).upsert(
    { kakao_uid: user.id, name: name || '', phone: user.user_metadata?.phone || '' },
    { onConflict: 'kakao_uid' }
  );

  document.addEventListener('click', e => {
    if (!e.target.closest('#user-menu') && !e.target.closest('#user-avatar'))
      document.getElementById('user-menu').classList.remove('open');
  });

  return true;
}

function setUserUI({ name, role, avatarUrl, isGuest }) {
  const avatar = document.getElementById('user-avatar');
  if (avatarUrl) {
    avatar.innerHTML = `<img src="${avatarUrl}" alt="${name}" onerror="this.textContent='${name?.[0]||'?'}'">`;
  } else {
    avatar.textContent = name?.[0] || '?';
  }
  document.getElementById('menu-name').textContent = isGuest ? '게스트' : name;
  document.getElementById('menu-role-badge').textContent = role === 'business' ? '업주' : '알바생';
}

// ── DB에서 구인 공고 로드 ──────────────────────────────────
async function loadJobsFromDB() {
  const { data, error } = await db.rpc('nearby_jobs', {
    user_lat: APP_CONFIG.DEFAULT_LAT,
    user_lng: APP_CONFIG.DEFAULT_LNG,
    radius_meters: APP_CONFIG.DEFAULT_RADIUS_M
  });
  if (error || !data?.length) return null;

  return data.map(j => ({
    id: j.id,
    biz: j.biz_name,
    title: j.title,
    category: j.category || 'F&B',
    lat: j.lat,
    lng: j.lng,
    baseWage: j.base_wage,
    currentWage: j.current_wage,
    wageHistory: [j.base_wage, j.current_wage].filter((v,i,a) => a.indexOf(v) === i),
    status: j.status,
    needed: j.needed_count,
    bizRating: parseFloat(j.biz_rating) || 0,
    bizReviews: j.biz_reviews || 0,
    bizKindness: parseFloat(j.biz_kindness) || 0,
    workerRating: 4.0, workerRatingCount: 0,
    address: '', description: '',
    startTime: j.start_time || '즉시',
    duration: j.duration || '-',
  }));
}

// ── Realtime 구독 ──────────────────────────────────────────
function subscribeRealtime() {
  db.channel('job-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'job_postings' }, async () => {
      const jobs = await loadJobsFromDB();
      if (jobs) {
        currentJobs = jobs;
        renderMarkers(jobs);
        renderCards(jobs);
        showToast('🔄 구인 정보가 업데이트됐습니다.');
      }
    })
    .subscribe();
}

// ── 지원하기 ──────────────────────────────────────────────
async function applyJob(id) {
  const job = currentJobs.find(j => j.id === id);
  if (!job || job.status === 'filled') return;

  if (localStorage.getItem('baroalba_guest')) {
    closeModalDirect();
    showToast('⚠️ 지원하려면 로그인이 필요합니다.');
    setTimeout(() => window.location.href = './login.html', 1500);
    return;
  }

  if (currentRole === 'business') {
    showToast('⚠️ 업주 계정으로는 지원할 수 없습니다.');
    return;
  }

  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = './login.html'; return; }

  const { data: workerData } = await db.from('workers')
    .select('id').eq('kakao_uid', session.user.id).single();

  if (!workerData) {
    showToast('⚠️ 알바생 프로필이 없습니다. 역할을 확인해주세요.');
    return;
  }

  const { error } = await db.from('applications').insert({
    job_posting_id: id,
    worker_id: workerData.id,
    status: 'pending'
  });

  closeModalDirect();
  if (error?.code === '23505') {
    showToast('이미 지원한 공고입니다.');
  } else if (error) {
    showToast('지원 실패: ' + error.message);
  } else {
    showToast(`✅ ${job.biz} 지원 완료! 업주 확인 후 연락드립니다.`);
  }
}

// ── 시작 ──────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const authResult = await initAuth();
  if (!authResult) return;

  if (authResult === 'guest') {
    currentJobs = JOBS;
    initMap(currentJobs);
    showToast('📋 샘플 데이터로 표시 중 · 로그인하면 실제 공고를 볼 수 있어요');
  } else {
    const dbJobs = await loadJobsFromDB();
    currentJobs = dbJobs || JOBS;
    initMap(currentJobs);
    if (dbJobs) showToast(`📡 DB 연동 완료 — ${dbJobs.length}개 공고`);
    else        showToast('📋 샘플 데이터로 표시 중');
    subscribeRealtime();
  }
});
</script>
