<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>디자인 B — 다크 모드</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root { --red: #FF4B4B; --kakao: #FEE500; --naver: #03C75A; }
    body {
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #0f0f0f;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .hero {
      background: #0f0f0f;
      padding: 60px 24px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }
    .hero-icon img { width: 72px; height: 72px; border-radius: 20px; box-shadow: 0 6px 30px rgba(255,75,75,0.35); }
    .hero-name {
      font-size: 30px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -1px;
      margin-top: 12px;
    }
    .hero-sub {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      margin-top: 10px;
      text-align: center;
      line-height: 1.9;
      letter-spacing: -0.2px;
    }
    .card {
      background: #1a1a1a;
      border-radius: 28px 28px 0 0;
      padding: 32px 24px 40px;
      flex: 1;
      border-top: 1px solid #2a2a2a;
    }
    .tabs {
      display: flex;
      background: #222;
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 24px;
    }
    .tab { flex:1; padding:10px; text-align:center; font-size:14px; font-weight:600; color:#555; border-radius:10px; cursor:pointer; }
    .tab.active { background:#2d2d2d; color:#fff; }

    .sns-section { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
    .sns-btn {
      display:flex; align-items:center; justify-content:center; gap:10px;
      width:100%; padding:15px; border-radius:14px; border:none;
      font-size:15px; font-weight:700; cursor:pointer;
    }
    .sns-btn-kakao { background: var(--kakao); color:#000; }
    .sns-btn-secondary {
      background: #252525;
      color: #ccc;
      border: 1px solid #333;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .sns-logo { width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .sns-logo svg { width:100%; height:100%; }

    .divider { display:flex; align-items:center; gap:10px; margin:16px 0; color:#333; font-size:13px; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:#2a2a2a; }

    .form-group { margin-bottom:14px; }
    .form-label { font-size:12px; font-weight:600; color:#555; margin-bottom:6px; display:block; }
    .form-input {
      width:100%; padding:14px; border:1.5px solid #2a2a2a; border-radius:12px;
      font-size:15px; color:#fff; outline:none; background:#222;
    }
    .form-input:focus { border-color: var(--red); }
    .form-input::placeholder { color:#444; }

    .submit-btn {
      width:100%; padding:15px; background: var(--red); color:#fff;
      border:none; border-radius:14px; font-size:16px; font-weight:800;
      cursor:pointer; margin-top:4px;
    }
    .preview-label {
      position: fixed;
      top: 12px;
      right: 12px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      z-index: 9999;
      backdrop-filter: blur(8px);
    }
    .or-row { display:flex; gap:10px; margin-bottom:10px; }
  </style>
</head>
<body>
<div class="preview-label">B — 다크 모드</div>

<div class="hero">
  <div class="hero-icon"><img src="./icons/바로알바 최종로고.png" onerror="this.style='width:72px;height:72px;background:#ff4b4b22;border-radius:20px'"></div>
  <div class="hero-name">바로알바</div>
  <div class="hero-sub">지금 당장 사람 구할 때도,<br>지금 당장 돈 벌고 싶을 때도</div>
</div>

<div class="card">
  <div class="tabs">
    <div class="tab active">로그인</div>
    <div class="tab">회원가입</div>
  </div>

  <div class="sns-section">
    <button class="sns-btn sns-btn-kakao">
      <div class="sns-logo"><svg viewBox="0 0 24 24"><path d="M12 3C6.477 3 2 6.477 2 10.8c0 2.757 1.742 5.172 4.364 6.565-.193.72-.697 2.6-.797 3.007-.124.503.184.496.387.36.159-.105 2.524-1.72 3.545-2.417.822.117 1.667.179 2.501.179 5.523 0 10-3.477 10-7.694C22 6.477 17.523 3 12 3z" fill="#000"/></svg></div>
      카카오로 시작하기
    </button>
    <div class="or-row">
      <button class="sns-btn-secondary" style="flex:1">
        <div class="sns-logo"><svg viewBox="0 0 24 24" fill="#03C75A"><path d="M16.273 12.845L7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727z"/></svg></div>
        네이버
      </button>
      <button class="sns-btn-secondary" style="flex:1">
        <div class="sns-logo"><svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg></div>
        구글
      </button>
    </div>
  </div>

  <div class="divider" style="color:#333">또는 이메일로</div>

  <div class="form-group"><label class="form-label">이메일</label><input class="form-input" type="email" placeholder="이메일 주소 입력"></div>
  <div class="form-group"><label class="form-label">비밀번호</label><input class="form-input" type="password" placeholder="비밀번호 입력"></div>
  <button class="submit-btn">로그인</button>
</div>
</body>
</html>
