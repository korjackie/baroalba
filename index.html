<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>바로알바</title>
  <!-- index.html은 실제 앱 진입점(/바로알바.html)로 보내는 용도만 함 - 조건부/버전비교 없이 항상 즉시 리다이렉트.
       예전엔 여기에도 앱 전체 사본이 들어있고 localStorage 버전 비교로 조건부 리다이렉트를 했었는데,
       그 비교값이 한번 저장되면 다신 리다이렉트가 안 일어나 오래된 화면이 영구적으로 보이는 버그가 있었음. -->
  <script>location.replace('/바로알바.html' + location.search);</script>
</head>
<body></body>
</html>
