<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>바로알바 관리자</title>
  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,'Apple SD Gothic Neo',sans-serif; background:#f1f5f9; min-height:100vh; }

    :root { --sat: env(safe-area-inset-top, 0px); }
    .header {
      background:#1e293b; color:#fff;
      padding:14px 16px;
      padding-top: calc(var(--sat) + 14px);
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:100;
    }
    .header-left { display:flex; align-items:center; gap:8px; }
    .header-logo { font-size:16px; font-weight:900; color:#C8102E; }
    .header-badge { font-size:10px; font-weight:800; background:#C8102E; color:#fff; padding:2px 6px; border-radius:5px; letter-spacing:0.5px; }
    .header-user { font-size:11px; color:#94a3b8; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .logout-btn { font-size:11px; color:#94a3b8; background:none; border:none; cursor:pointer; padding:6px 8px; white-space:nowrap; }
    .logout-btn:hover { color:#fff; }

    .tabs { background:#fff; border-bottom:1px solid #e2e8f0; display:flex; }
    .tab-btn {
      flex:1; padding:11px 4px; font-size:12px; font-weight:700; color:#94a3b8;
      border:none; background:none; cursor:pointer; border-bottom:2.5px solid transparent;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center;
    }
    .tab-btn.active { color:#C8102E; border-bottom-color:#C8102E; }

    .content { padding:20px; max-width:1100px; margin:0 auto; }

    /* 통계 카드 */
    .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
    .stat-card {
      background:#fff; border-radius:14px; padding:18px 16px;
      box-shadow:0 1px 4px rgba(0,0,0,0.06);
      cursor:pointer; transition:box-shadow 0.15s, transform 0.15s; user-select:none;
    }
    .stat-card:active { transform:scale(0.97); box-shadow:0 1px 2px rgba(0,0,0,0.04); }
    .stat-card.no-click { cursor:default; }
    .stat-card.no-click:active { transform:none; }
    .stat-icon { font-size:24px; margin-bottom:8px; }
    .stat-val { font-size:28px; font-weight:900; color:#1e293b; }
    .stat-label { font-size:12px; color:#94a3b8; font-weight:600; margin-top:3px; }
    .stat-card.alert .stat-val { color:#EF4444; }

    /* 섹션 헤더 */
    .section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .section-title { font-size:16px; font-weight:800; color:#1e293b; }

    /* 필터 바 */
    .filter-bar { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
    .filter-btn {
      padding:6px 14px; border-radius:20px; border:1.5px solid #e2e8f0;
      font-size:12px; font-weight:700; cursor:pointer; background:#fff; color:#64748b;
    }
    .filter-btn.active { background:#1e293b; color:#fff; border-color:#1e293b; }

    /* 신고 카드 */
    .report-card {
      background:#fff; border-radius:14px; margin-bottom:10px;
      box-shadow:0 1px 4px rgba(0,0,0,0.06); overflow:hidden;
      border-left:4px solid #e2e8f0;
    }
    .report-card.s-pending   { border-left-color:#F59E0B; }
    .report-card.s-reviewing { border-left-color:#3B82F6; }
    .report-card.s-done      { border-left-color:#22c55e; }
    .report-card.s-dismissed { border-left-color:#d1d5db; }

    .report-body { padding:14px 16px; }
    .report-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px; }
    .report-type { font-size:10px; font-weight:800; padding:2px 8px; border-radius:5px; background:#FFF7ED; color:#F59E0B; }
    .report-type.job  { background:#EFF6FF; color:#3B82F6; }
    .report-type.user { background:#FEF3C7; color:#D97706; }
    .report-date { font-size:11px; color:#94a3b8; }
    .report-target { font-size:15px; font-weight:800; color:#1e293b; margin-bottom:3px; }
    .report-biz { font-size:12px; color:#94a3b8; margin-bottom:6px; }
    .report-reason { display:inline-block; font-size:12px; font-weight:700; background:#FEE2E2; color:#EF4444; padding:3px 10px; border-radius:20px; margin-bottom:6px; }
    .report-detail { font-size:13px; color:#475569; background:#f8fafc; padding:8px 12px; border-radius:8px; margin-bottom:10px; }
    .report-reporter { font-size:11px; color:#94a3b8; margin-bottom:10px; }
    .report-actions { display:flex; gap:6px; flex-wrap:wrap; }
    .r-btn {
      padding:6px 14px; border-radius:8px; border:none; font-size:12px; font-weight:700; cursor:pointer;
    }
    .r-btn-reviewing { background:#EFF6FF; color:#3B82F6; }
    .r-btn-done      { background:#DCFCE7; color:#16a34a; }
    .r-btn-dismiss   { background:#f1f5f9; color:#94a3b8; }
    .r-btn-close     { background:#FEE2E2; color:#EF4444; }
    .r-btn:hover { opacity:0.8; }

    /* 상태 배지 */
    .status-badge {
      font-size:10px; font-weight:800; padding:2px 8px; border-radius:5px;
      white-space:nowrap;
    }
    .sb-pending   { background:#FFF7ED; color:#F59E0B; }
    .sb-reviewing { background:#EFF6FF; color:#3B82F6; }
    .sb-done      { background:#DCFCE7; color:#16a34a; }
    .sb-dismissed { background:#f1f5f9; color:#94a3b8; }

    /* 공고 카드 */
    .posting-row {
      background:#fff; border-radius:12px; margin-bottom:8px;
      box-shadow:0 1px 4px rgba(0,0,0,0.05); padding:14px 16px;
      display:flex; align-items:center; gap:12px;
    }
    .posting-row.closed { opacity:0.5; }
    .posting-info { flex:1; min-width:0; }
    .posting-title { font-size:14px; font-weight:800; color:#1e293b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .posting-meta  { font-size:11px; color:#94a3b8; margin-top:2px; }
    .posting-wage  { font-size:14px; font-weight:900; color:#C8102E; white-space:nowrap; }
    .close-btn {
      padding:7px 14px; background:#FEE2E2; color:#EF4444; border:none;
      border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
    }
    .close-btn:disabled { background:#f1f5f9; color:#cbd5e1; cursor:default; }

    /* 회원 카드 */
    .user-row {
      background:#fff; border-radius:12px; margin-bottom:8px;
      box-shadow:0 1px 4px rgba(0,0,0,0.05); padding:14px 16px;
      display:flex; align-items:center; gap:12px; cursor:pointer;
      transition:background 0.1s;
    }
    .user-row:active { background:#f8fafc; }
    .user-avatar {
      width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#EDE9FE,#DDD6FE);
      display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;
      font-weight:800; color:#7C3AED;
    }
    .user-name  { font-size:14px; font-weight:800; color:#1e293b; }
    .user-meta  { font-size:11px; color:#94a3b8; margin-top:2px; }
    .user-stats { font-size:12px; color:#64748b; font-weight:600; margin-top:3px; }
    .user-row.banned { border-left:3px solid #EF4444; }
    .user-row.banned .user-avatar { background:linear-gradient(135deg,#FEE2E2,#FECACA); color:#EF4444; }

    /* 회원 상세 패널 */
    .detail-overlay {
      position:fixed; inset:0; background:rgba(15,23,42,0.55); z-index:600;
      display:none; align-items:flex-end;
    }
    .detail-overlay.show { display:flex; }
    .detail-panel {
      width:100%; max-height:93vh; background:#fff; border-radius:20px 20px 0 0;
      overflow-y:auto; animation:slideUp 0.22s cubic-bezier(0.32,0.72,0,1);
      display:flex; flex-direction:column;
    }
    @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
    .dp-header {
      position:sticky; top:0; background:#fff; padding:14px 16px;
      border-bottom:1px solid #e2e8f0; display:flex; align-items:center; gap:10px; z-index:10;
      flex-shrink:0;
    }
    .dp-body { padding:20px; flex:1; }
    .dp-avatar {
      width:72px; height:72px; border-radius:50%;
      background:linear-gradient(135deg,#EDE9FE,#DDD6FE);
      display:flex; align-items:center; justify-content:center;
      font-size:28px; font-weight:900; color:#7C3AED; margin:0 auto 12px;
    }
    .dp-avatar.banned { background:linear-gradient(135deg,#FEE2E2,#FECACA); color:#EF4444; }
    .dp-name { font-size:22px; font-weight:900; color:#1e293b; text-align:center; }
    .dp-phone { font-size:13px; color:#94a3b8; text-align:center; margin-top:4px; }
    .dp-stats { display:flex; gap:0; margin:16px 0; border:1px solid #e2e8f0; border-radius:14px; overflow:hidden; }
    .dp-stat { flex:1; padding:14px 8px; text-align:center; border-right:1px solid #e2e8f0; }
    .dp-stat:last-child { border-right:none; }
    .dp-stat-val { font-size:20px; font-weight:900; color:#1e293b; }
    .dp-stat-label { font-size:10px; color:#94a3b8; font-weight:600; margin-top:2px; }
    .dp-tabs { display:flex; border-bottom:1px solid #e2e8f0; margin-bottom:16px; }
    .dp-tab { flex:1; padding:11px; font-size:13px; font-weight:700; color:#94a3b8; background:none; border:none; cursor:pointer; border-bottom:2.5px solid transparent; }
    .dp-tab.active { color:#C8102E; border-bottom-color:#C8102E; }
    .dp-actions {
      position:sticky; bottom:0; background:#fff; padding:12px 16px;
      border-top:1px solid #e2e8f0; display:flex; gap:8px; flex-shrink:0;
    }
    .dp-action-btn { flex:1; padding:13px; border-radius:12px; border:none; font-size:13px; font-weight:800; cursor:pointer; }
    .da-noshow { background:#EFF6FF; color:#3B82F6; }
    .da-ban    { background:#FEE2E2; color:#EF4444; }
    .da-unban  { background:#DCFCE7; color:#16a34a; }

    /* 활동 아이템 */
    .app-item { padding:12px 0; border-bottom:1px solid #f1f5f9; }
    .app-item:last-child { border-bottom:none; }
    .app-item-title { font-size:13px; font-weight:700; color:#1e293b; }
    .app-item-meta { font-size:11px; color:#94a3b8; margin-top:3px; }
    .app-item-review { font-size:12px; color:#64748b; margin-top:4px; font-style:italic; }
    .as-badge { font-size:10px; font-weight:800; padding:2px 8px; border-radius:5px; white-space:nowrap; }
    .as-hired    { background:#DCFCE7; color:#16a34a; }
    .as-done     { background:#EFF6FF; color:#3B82F6; }
    .as-pending  { background:#FFF7ED; color:#F59E0B; }
    .as-rejected { background:#f1f5f9; color:#94a3b8; }
    .as-noshow   { background:#FEE2E2; color:#EF4444; }
    .as-cancelled{ background:#f1f5f9; color:#94a3b8; }

    /* 모임 카드 */
    .moim-row {
      background:#fff; border-radius:12px; margin-bottom:8px;
      box-shadow:0 1px 4px rgba(0,0,0,0.05); padding:14px 16px;
    }
    .moim-row.closed { opacity:0.5; }
    .moim-title-wrap { display:flex; align-items:center; gap:8px; margin-bottom:3px; }
    .moim-title { font-size:14px; font-weight:800; color:#1e293b; }
    .moim-meta { font-size:11px; color:#94a3b8; margin-top:2px; }
    .moim-actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
    .m-btn { padding:6px 12px; border-radius:8px; border:none; font-size:11px; font-weight:700; cursor:pointer; }
    .m-btn-close  { background:#FEE2E2; color:#EF4444; }
    .m-btn-open   { background:#DCFCE7; color:#16a34a; }
    .m-btn-delete { background:#f1f5f9; color:#94a3b8; }
    .moim-status-badge { font-size:10px; font-weight:800; padding:2px 8px; border-radius:5px; }
    .ms-open   { background:#DCFCE7; color:#16a34a; }
    .ms-closed { background:#f1f5f9; color:#94a3b8; }

    /* 빈 상태 */
    .empty { text-align:center; padding:48px 20px; color:#94a3b8; font-size:14px; }

    /* 로딩 */
    .loading { text-align:center; padding:32px; color:#94a3b8; font-size:13px; }

    /* 탭 컨텐츠 */
    .tab-content { display:none; }
    .tab-content.active { display:block; }

    /* 토스트 */
    #toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      background:#1e293b; color:#fff; padding:12px 20px; border-radius:12px;
      font-size:13px; font-weight:700; display:none; z-index:9999;
      box-shadow:0 4px 20px rgba(0,0,0,0.2);
    }

    @media (max-width:600px) {
      .stats-grid { grid-template-columns:repeat(2,1fr); }
      .content { padding:12px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <button onclick="history.back()" style="background:none;border:none;color:#94a3b8;font-size:20px;cursor:pointer;padding:0 6px 0 0;line-height:1">‹</button>
    <span class="header-logo">바로알바</span>
    <span class="header-badge">ADMIN</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="header-user" id="admin-email">-</span>
    <button onclick="openSettings()" style="background:none;border:none;color:#94a3b8;font-size:18px;cursor:pointer;padding:4px;line-height:1;flex-shrink:0" title="관리자 설정">⚙️</button>
    <button class="logout-btn" onclick="doLogout()">로그아웃</button>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('dashboard')">대시보드</button>
  <button class="tab-btn" onclick="switchTab('reports')">신고관리<span id="report-badge" style="display:none;background:#EF4444;color:#fff;font-size:9px;font-weight:900;min-width:16px;height:16px;line-height:16px;padding:0 4px;border-radius:8px;margin-left:3px;vertical-align:middle;display:none;text-align:center">0</span></button>
  <button class="tab-btn" onclick="switchTab('postings')">공고관리</button>
  <button class="tab-btn" onclick="switchTab('users')">회원관리</button>
  <button class="tab-btn" onclick="switchTab('moims')">모임관리</button>
</div>

<div class="content">

  <!-- 대시보드 -->
  <div class="tab-content active" id="tab-dashboard">
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card" onclick="switchTab('users')"><div class="stat-icon">👥</div><div class="stat-val" id="s-workers">-</div><div class="stat-label">총 알바생</div></div>
      <div class="stat-card" onclick="switchTab('postings')"><div class="stat-icon">🏢</div><div class="stat-val" id="s-businesses">-</div><div class="stat-label">등록 업주</div></div>
      <div class="stat-card" onclick="switchTab('postings')"><div class="stat-icon">📋</div><div class="stat-val" id="s-postings">-</div><div class="stat-label">활성 공고</div></div>
      <div class="stat-card alert" onclick="switchTab('reports')"><div class="stat-icon">🚨</div><div class="stat-val" id="s-reports">-</div><div class="stat-label">미처리 신고</div></div>
      <div class="stat-card no-click"><div class="stat-icon">⚡</div><div class="stat-val" id="s-apps">-</div><div class="stat-label">오늘 지원</div></div>
      <div class="stat-card" onclick="switchTab('moims')"><div class="stat-icon">🤝</div><div class="stat-val" id="s-moims">-</div><div class="stat-label">활성 모임</div></div>
    </div>
    <div class="section-head">
      <div class="section-title">최근 신고</div>
      <button onclick="switchTab('reports')" style="font-size:12px;color:#3B82F6;background:none;border:none;cursor:pointer;font-weight:700">전체 보기 →</button>
    </div>
    <div id="dashboard-reports"><div class="loading">로딩 중...</div></div>
  </div>

  <!-- 신고관리 -->
  <div class="tab-content" id="tab-reports">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterReports('all', this)">전체</button>
      <button class="filter-btn" onclick="filterReports('pending', this)">🟡 대기</button>
      <button class="filter-btn" onclick="filterReports('reviewing', this)">🔵 검토중</button>
      <button class="filter-btn" onclick="filterReports('done', this)">🟢 조치완료</button>
      <button class="filter-btn" onclick="filterReports('dismissed', this)">⚪ 기각</button>
    </div>
    <div id="reports-list"><div class="loading">로딩 중...</div></div>
  </div>

  <!-- 공고관리 -->
  <div class="tab-content" id="tab-postings">
    <div id="postings-list"><div class="loading">로딩 중...</div></div>
  </div>

  <!-- 회원관리 -->
  <div class="tab-content" id="tab-users">
    <div id="users-list"><div class="loading">로딩 중...</div></div>
  </div>

  <!-- 모임관리 -->
  <div class="tab-content" id="tab-moims">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterMoims('all', this)">전체</button>
      <button class="filter-btn" onclick="filterMoims('open', this)">🟢 진행중</button>
      <button class="filter-btn" onclick="filterMoims('closed', this)">⚫ 마감됨</button>
    </div>
    <div id="moims-list"><div class="loading">로딩 중...</div></div>
  </div>

</div>

<!-- 관리자 설정 패널 -->
<div class="detail-overlay" id="settings-overlay" onclick="closeSettings()">
  <div class="detail-panel" onclick="event.stopPropagation()" style="max-height:88vh">
    <div class="dp-header">
      <button onclick="closeSettings()" style="background:none;border:none;font-size:24px;color:#64748b;cursor:pointer;line-height:1;flex-shrink:0">‹</button>
      <span style="font-size:16px;font-weight:800;color:#1e293b">관리자 설정</span>
    </div>
    <div style="display:flex;border-bottom:1px solid #e2e8f0;flex-shrink:0">
      <button class="dp-tab active" id="stab-admins" onclick="switchSettingsTab('admins')">🛡️ 관리자 계정</button>
      <button class="dp-tab" id="stab-categories" onclick="switchSettingsTab('categories')">📂 카테고리</button>
    </div>

    <!-- 관리자 계정 탭 -->
    <div id="stab-content-admins" class="dp-body">
      <div style="font-size:12px;color:#94a3b8;margin-bottom:12px">admin.html에 접근 가능한 관리자 계정 목록입니다.</div>
      <div id="settings-admin-list"><div class="loading">로딩 중...</div></div>
      <div style="margin-top:20px;border-top:1px solid #e2e8f0;padding-top:16px">
        <div style="font-size:13px;font-weight:800;color:#1e293b;margin-bottom:10px">관리자 추가</div>
        <div style="display:flex;gap:8px">
          <input id="new-admin-email" type="email" placeholder="이메일 주소 입력"
            style="flex:1;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;outline:none"
            onkeydown="if(event.key==='Enter')addAdmin()"
            onfocus="setTimeout(()=>this.scrollIntoView({block:'center',behavior:'smooth'}),300)">
          <button onclick="addAdmin()"
            style="padding:11px 18px;background:#1e293b;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap">추가</button>
        </div>
      </div>
    </div>

    <!-- 카테고리 탭 -->
    <div id="stab-content-categories" class="dp-body" style="display:none">
      <div style="font-size:12px;color:#94a3b8;margin-bottom:12px">알바 공고 등록 시 표시되는 카테고리를 관리합니다.</div>
      <div id="settings-cat-list"><div class="loading">로딩 중...</div></div>
      <div style="margin-top:16px;border-top:1px solid #e2e8f0;padding-top:16px">
        <div style="font-size:13px;font-weight:800;color:#1e293b;margin-bottom:10px">카테고리 추가</div>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="new-cat-icon" placeholder="🍕" maxlength="4"
            style="width:50px;text-align:center;padding:11px 6px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:18px;outline:none">
          <input id="new-cat-name" placeholder="카테고리명"
            style="flex:1;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;outline:none"

<div id="toast"></div>

<script>
const { createClient } = supabase;
const db = createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);

let currentSession = null;
let _reports = [];
let _reportFilter = 'all';
let _moims = [];
let _moimFilter = 'all';
let _editingMoimId = null;

// ── 초기화 ──────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) {
    alert('관리자 권한이 없습니다.');
    location.href = '/login.html';
    return;
  }
  const authEmail = session.user.email || session.user.user_metadata?.email || '';
  const { data: adminRow } = await db.from('app_admins').select('email').eq('email', authEmail).maybeSingle();
  if (!adminRow) {
    alert('관리자 권한이 없습니다.');
    location.href = '/login.html';
    return;
  }
  currentSession = session;
  document.getElementById('admin-email').textContent = authEmail;
  loadDashboard();

  // 키보드 가림 방지: 초기 높이 기준으로 키보드 높이 계산 (Android/iOS 모두 대응)
  const _initVPH = window.innerHeight;
  if (window.visualViewport) {
    let _vpTimer;
    const _adjustPanels = () => {
      clearTimeout(_vpTimer);
      _vpTimer = setTimeout(() => {
        // Android: innerHeight도 같이 줄어들므로 초기값과 비교
        const kbH = Math.max(0, _initVPH - window.visualViewport.height - window.visualViewport.offsetTop);
        const vpH = window.visualViewport.height;
        document.querySelectorAll('.detail-overlay.show').forEach(overlay => {
          const panel = overlay.querySelector('.detail-panel');
          if (kbH > 80) {
            overlay.style.setProperty('padding-bottom', kbH + 'px', 'important');
            if (panel) panel.style.maxHeight = (vpH - 40) + 'px';
            // 포커스된 입력창을 패널 내에서 스크롤
            const f = document.activeElement;
            if (f && (f.tagName === 'INPUT' || f.tagName === 'TEXTAREA') && panel) {
              setTimeout(() => {
                f.scrollIntoView({ block: 'center', behavior: 'smooth' });
              }, 100);
            }
          } else {
            overlay.style.paddingBottom = '';
            if (panel) panel.style.maxHeight = '';
          }
        });
      }, 50);
    };
    window.visualViewport.addEventListener('resize', _adjustPanels);
    window.visualViewport.addEventListener('scroll', _adjustPanels);
  }
});

// ── 탭 전환 ─────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    const names = ['dashboard','reports','postings','users','moims'];
    b.classList.toggle('active', names[i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'reports' && document.getElementById('reports-list').innerHTML.includes('로딩')) loadReports();
  if (name === 'postings' && document.getElementById('postings-list').innerHTML.includes('로딩')) loadPostings();
  if (name === 'users' && document.getElementById('users-list').innerHTML.includes('로딩')) loadUsers();
  if (name === 'moims' && document.getElementById('moims-list').innerHTML.includes('로딩')) loadMoims();
}

// ── API 호출 ─────────────────────────────────────────────
async function adminApi(action, method = 'GET', body = null) {
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${currentSession.access_token}`
    }
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(`/api/admin?action=${action}`, opts);
  return r.json();
}

// ── 대시보드 ─────────────────────────────────────────────
async function loadDashboard() {
  const stats = await adminApi('stats');
  document.getElementById('s-workers').textContent   = stats.workers        ?? '-';
  document.getElementById('s-businesses').textContent = stats.businesses     ?? '-';
  document.getElementById('s-postings').textContent  = stats.postings       ?? '-';
  document.getElementById('s-reports').textContent   = stats.pending_reports ?? '-';
  document.getElementById('s-apps').textContent      = stats.today_apps     ?? '-';
  document.getElementById('s-moims').textContent     = stats.moims          ?? '-';

  if (stats.pending_reports > 0) {
    const badge = document.getElementById('report-badge');
    badge.textContent = stats.pending_reports;
    badge.style.display = 'inline-block';
  }

  const reports = await adminApi('reports');
  _reports = Array.isArray(reports) ? reports : [];
  const recent = _reports.slice(0, 3);
  document.getElementById('dashboard-reports').innerHTML = recent.length
    ? recent.map(r => reportCardHtml(r, true)).join('')
    : '<div class="empty">신고 없음</div>';
}

// ── 신고 관리 ─────────────────────────────────────────────
async function loadReports() {
  const reports = await adminApi('reports');
  _reports = Array.isArray(reports) ? reports : [];
  renderReports();
}

function filterReports(filter, btn) {
  _reportFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderReports();
}

function renderReports() {
  const list = _reportFilter === 'all'
    ? _reports
    : _reports.filter(r => (r.status || 'pending') === _reportFilter);
  document.getElementById('reports-list').innerHTML = list.length
    ? list.map(r => reportCardHtml(r, false)).join('')
    : '<div class="empty">해당 신고 없음</div>';
}

function reportCardHtml(r, compact) {
  const status = r.status || 'pending';
  const statusLabel = { pending:'대기', reviewing:'검토중', done:'조치완료', dismissed:'기각' };
  const typeLabel = r.target_type === 'job' ? '공고' : '사용자';
  const date = r.created_at ? new Date(r.created_at).toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';

  const actions = compact ? '' : `
    <div class="report-actions">
      ${status !== 'reviewing' && status !== 'done' ? `<button class="r-btn r-btn-reviewing" onclick="updateReport('${r.id}','reviewing')">🔵 검토중</button>` : ''}
      ${status !== 'done' ? `<button class="r-btn r-btn-done" onclick="updateReport('${r.id}','done')">✅ 조치완료</button>` : ''}
      ${status !== 'dismissed' ? `<button class="r-btn r-btn-dismiss" onclick="updateReport('${r.id}','dismissed')">기각</button>` : ''}
      ${r.target_type === 'job' ? `<button class="r-btn r-btn-close" onclick="closePostingById('${r.target_id}')">공고 강제마감</button>` : ''}
    </div>`;

  return `
    <div class="report-card s-${status}" id="rc-${r.id}">
      <div class="report-body">
        <div class="report-top">
          <div style="display:flex;gap:6px;align-items:center">
            <span class="report-type ${r.target_type}">${typeLabel} 신고</span>
            <span class="status-badge sb-${status}">${statusLabel[status] || status}</span>
          </div>
          <span class="report-date">${date}</span>
        </div>
        <div class="report-target">${r.target_name || '-'}</div>
        ${r.target_biz ? `<div class="report-biz">${r.target_biz}</div>` : ''}
        <span class="report-reason">${r.reason}</span>
        ${r.detail ? `<div class="report-detail">"${r.detail}"</div>` : ''}
        <div class="report-reporter">신고자: ${r.reporter_name || '-'}${r.reporter_phone ? ' · ' + r.reporter_phone : ''}</div>
        ${actions}
      </div>
    </div>`;
}

async function updateReport(id, status) {
  await adminApi('update_report', 'PATCH', { id, status });
  const idx = _reports.findIndex(r => r.id === id);
  if (idx >= 0) _reports[idx].status = status;
  renderReports();
  showToast(status === 'done' ? '✅ 조치 완료 처리됨' : status === 'dismissed' ? '기각 처리됨' : '🔵 검토중으로 변경됨');
  // 배지 업데이트
  const pending = _reports.filter(r => !r.status || r.status === 'pending').length;
  const badge = document.getElementById('report-badge');
  badge.textContent = pending;
  badge.style.display = pending > 0 ? 'inline' : 'none';
  document.getElementById('s-reports').textContent = pending;
}

// ── 공고 관리 ─────────────────────────────────────────────
async function loadPostings() {
  const data = await adminApi('postings');
  const list = Array.isArray(data) ? data : [];
  document.getElementById('postings-list').innerHTML = list.length
    ? list.map(p => {
        const isClosed = p.status === 'closed';
        const date = p.start_time ? new Date(p.start_time).toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '-';
        return `
          <div class="posting-row ${isClosed ? 'closed' : ''}" id="pr-${p.id}">
            <div class="posting-info">
              <div class="posting-title">${p.title || '(제목없음)'}</div>
              <div class="posting-meta">${p.biz_name || '-'} · ${date} · ${p.filled_count || 0}/${p.needed_count || 1}명</div>
            </div>
            <div class="posting-wage">${p.current_wage ? p.current_wage.toLocaleString() + '원' : '-'}</div>
            <button class="close-btn" onclick="closePostingById('${p.id}')" ${isClosed ? 'disabled' : ''}>${isClosed ? '마감됨' : '강제마감'}</button>
          </div>`;
      }).join('')
    : '<div class="empty">공고 없음</div>';
}

async function closePostingById(id) {
  if (!confirm('이 공고를 강제 마감하시겠습니까?')) return;
  await adminApi('close_posting', 'PATCH', { id });
  const row = document.getElementById('pr-' + id);
  if (row) {
    row.classList.add('closed');
    const btn = row.querySelector('.close-btn');
    if (btn) { btn.textContent = '마감됨'; btn.disabled = true; }
  }
  showToast('공고가 강제 마감됐습니다');
}

// ── 회원 관리 ─────────────────────────────────────────────
let _users = [];
let _currentUser = null;
let _detailData = null;

async function loadUsers() {
  const data = await adminApi('users');
  _users = Array.isArray(data) ? data : [];
  renderUsers();
}

function userInitial(name) {
  if (!name) return '?';
  return name.trim().slice(-1);
}

function renderUsers() {
  document.getElementById('users-list').innerHTML = _users.length
    ? _users.map(u => {
        const banned = u.is_banned;
        const noshow = u.noshow_count || 0;
        const joinDate = u.created_at ? new Date(u.created_at).toLocaleDateString('ko-KR', { year:'numeric', month:'numeric', day:'numeric' }) : '-';
        return `
          <div class="user-row ${banned ? 'banned' : ''}" onclick="openUserDetail('${u.id}')">
            <div class="user-avatar ${banned ? 'banned' : ''}">${banned ? '🚫' : userInitial(u.name)}</div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <span class="user-name">${u.name || '(이름없음)'}</span>
                ${banned ? '<span style="font-size:10px;background:#FEE2E2;color:#EF4444;padding:1px 6px;border-radius:5px;font-weight:800">정지</span>' : ''}
                ${noshow >= 3 ? '<span style="font-size:10px;background:#FFF7ED;color:#F59E0B;padding:1px 6px;border-radius:5px;font-weight:800">노쇼주의</span>' : ''}
              </div>
              <div class="user-meta">${u.phone || '-'}</div>
              <div class="user-stats">⭐ ${u.rating ? u.rating.toFixed(1) : '-'} &nbsp;·&nbsp; 완료 ${u.review_count || 0}회 &nbsp;·&nbsp; 노쇼 ${noshow}회 &nbsp;·&nbsp; ${joinDate} 가입</div>
            </div>
            <span style="color:#cbd5e1;font-size:20px;flex-shrink:0">›</span>
          </div>`;
      }).join('')
    : '<div class="empty">회원 없음</div>';
}

// ── 회원 상세 패널 ─────────────────────────────────────────
async function openUserDetail(id) {
  _currentUser = _users.find(u => u.id === id) || { id };
  document.getElementById('user-detail-overlay').classList.add('show');
  document.getElementById('dp-title').textContent = _currentUser.name || '회원 상세';
  document.getElementById('dp-body').innerHTML = '<div class="loading">로딩 중...</div>';
  document.getElementById('dp-actions').style.display = 'none';

  try {
    const data = await adminApi('user_detail&id=' + encodeURIComponent(id));
    _detailData = data;
    if (data.worker) _currentUser = data.worker;
    renderUserDetail();
  } catch(e) {
    document.getElementById('dp-body').innerHTML = '<div class="empty">정보를 불러올 수 없습니다</div>';
  }
}

function closeUserDetail() {
  document.getElementById('user-detail-overlay').classList.remove('show');
}

function renderUserDetail() {
  const u = _currentUser;
  const apps = _detailData?.applications || [];
  if (!u) return;

  document.getElementById('dp-title').textContent = u.name || '회원 상세';
  const joinDate = u.created_at ? new Date(u.created_at).toLocaleDateString('ko-KR') : '-';
  const rated = apps.filter(a => a.employer_rating);
  const done = apps.filter(a => a.status === 'done').length;

  document.getElementById('dp-body').innerHTML = `
    <div style="text-align:center;padding-bottom:4px">
      <div class="dp-avatar ${u.is_banned ? 'banned' : ''}">${u.is_banned ? '🚫' : userInitial(u.name)}</div>
      <div class="dp-name">${u.name || '(이름없음)'}</div>
      <div class="dp-phone">${u.phone || '-'}</div>
      ${u.auth_email ? `<div style="font-size:12px;color:#64748b;margin-top:3px">${u.auth_email}</div>` : ''}
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap">
        ${u.auth_provider ? (() => {
          const pm = { kakao:'카카오 로그인', naver:'네이버 로그인', google:'구글 로그인', email:'이메일 로그인' };
          const pc = { kakao:'#FEE500;color:#3C1E1E', naver:'#03C75A;color:#fff', google:'#fff;color:#444;border:1.5px solid #e0e0e0', email:'#EFF6FF;color:#3B82F6' };
          const key = u.auth_provider === 'email' ? 'email' : (u.auth_provider || 'email');
          const style = pc[key] || pc.email;
          return `<span style="font-size:11px;font-weight:800;background:${style};padding:3px 10px;border-radius:20px">${pm[key] || u.auth_provider}</span>`;
        })() : ''}
        ${u.is_banned ? '<span style="background:#FEE2E2;color:#EF4444;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:800">계정 정지 중</span>' : ''}
      </div>
      ${(() => {
        let ageStr = '';
        if (u.birth_date) {
          const y = new Date(u.birth_date).getFullYear();
          const age = new Date().getFullYear() - y;
          ageStr = `만 ${age}세 (${y}년생)`;
        } else if (u.age) {
          ageStr = `만 ${u.age}세`;
        }
        return ageStr ? `<div style="font-size:12px;color:#94a3b8;margin-top:4px">${ageStr}</div>` : '';
      })()}
    </div>
    <div class="dp-stats">
      <div class="dp-stat">
        <div class="dp-stat-val">⭐ ${u.rating ? u.rating.toFixed(1) : '-'}</div>
        <div class="dp-stat-label">평점</div>
      </div>
      <div class="dp-stat">
        <div class="dp-stat-val">${done}</div>
        <div class="dp-stat-label">완료</div>
      </div>
      <div class="dp-stat">
        <div class="dp-stat-val" style="${(u.noshow_count||0)>0?'color:#EF4444':''}">${u.noshow_count || 0}</div>
        <div class="dp-stat-label">노쇼</div>
      </div>
      <div class="dp-stat">
        <div class="dp-stat-val">${apps.length}</div>
        <div class="dp-stat-label">총 지원</div>
      </div>
    </div>
    <div style="font-size:12px;color:#94a3b8;text-align:center;margin-bottom:20px">가입일 ${joinDate}</div>

    <div class="dp-tabs">
      <button class="dp-tab active" id="dtab-apps" onclick="showDetailTab('apps')">활동내역 (${apps.length})</button>
      <button class="dp-tab" id="dtab-reviews" onclick="showDetailTab('reviews')">받은 리뷰 (${rated.length})</button>
    </div>

    <div id="dtab-content-apps">
      ${apps.length ? apps.map(a => {
        const sc = {hired:'as-hired',done:'as-done',pending:'as-pending',rejected:'as-rejected',noshow:'as-noshow',cancelled:'as-cancelled'};
        const sl = {hired:'합격',done:'완료',pending:'지원중',rejected:'탈락',noshow:'노쇼',cancelled:'취소'};
        const date = a.applied_at ? new Date(a.applied_at).toLocaleDateString('ko-KR') : '-';
        return `<div class="app-item">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div class="app-item-title">${a.job_title}</div>
            <span class="as-badge ${sc[a.status]||'as-pending'}">${sl[a.status]||a.status}</span>
          </div>
          <div class="app-item-meta">${a.biz_name} · ${date}</div>
          ${a.employer_rating ? `<div class="app-item-review">업주 평가 ⭐${a.employer_rating}${a.review ? ' · "'+a.review+'"' : ''}</div>` : ''}
        </div>`;
      }).join('') : '<div class="empty" style="padding:24px 0">지원 내역 없음</div>'}
    </div>

    <div id="dtab-content-reviews" style="display:none">
      ${rated.length ? rated.map(a => {
        const stars = '⭐'.repeat(Math.round(a.employer_rating));
        const date = a.reviewed_at ? new Date(a.reviewed_at).toLocaleDateString('ko-KR') : '';
        return `<div class="app-item">
          <div style="display:flex;align-items:center;gap:6px">
            <span>${stars}</span><span style="font-size:14px;font-weight:900">${a.employer_rating}</span>
          </div>
          ${a.review ? `<div class="app-item-review">"${a.review}"</div>` : ''}
          <div class="app-item-meta">${a.biz_name}${date ? ' · ' + date : ''}</div>
        </div>`;
      }).join('') : '<div class="empty" style="padding:24px 0">받은 리뷰 없음</div>'}
    </div>
  `;

  const actionsEl = document.getElementById('dp-actions');
  const btns = [];
  if ((u.noshow_count || 0) > 0) btns.push(`<button class="dp-action-btn da-noshow" onclick="resetNoshowFromDetail()">노쇼 ${u.noshow_count}회 초기화</button>`);
  btns.push(u.is_banned
    ? `<button class="dp-action-btn da-unban" onclick="toggleBanFromDetail(false)">정지 해제</button>`
    : `<button class="dp-action-btn da-ban" onclick="toggleBanFromDetail(true)">계정 정지</button>`);
  actionsEl.innerHTML = btns.join('');
  actionsEl.style.display = 'flex';
}

function showDetailTab(name) {
  document.querySelectorAll('.dp-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('dtab-' + name).classList.add('active');
  document.getElementById('dtab-content-apps').style.display    = name === 'apps'    ? 'block' : 'none';
  document.getElementById('dtab-content-reviews').style.display = name === 'reviews' ? 'block' : 'none';
}

async function resetNoshowFromDetail() {
  if (!_currentUser || !confirm('노쇼 횟수를 0으로 초기화하겠습니까?')) return;
  await adminApi('reset_noshow', 'PATCH', { id: _currentUser.id });
  _currentUser.noshow_count = 0;
  const u = _users.find(u => u.id === _currentUser.id);
  if (u) u.noshow_count = 0;
  renderUserDetail();
  renderUsers();
  showToast('노쇼 횟수가 초기화됐습니다');
}

async function toggleBanFromDetail(ban) {
  if (!_currentUser) return;
  const msg = ban ? '이 회원을 정지하겠습니까?\n정지된 회원은 앱 접근이 차단됩니다.' : '정지를 해제하겠습니까?';
  if (!confirm(msg)) return;
  await adminApi('ban_user', 'PATCH', { id: _currentUser.id, is_banned: ban });
  _currentUser.is_banned = ban;
  const u = _users.find(u => u.id === _currentUser.id);
  if (u) u.is_banned = ban;
  renderUserDetail();
  renderUsers();
  showToast(ban ? '🚫 계정이 정지됐습니다' : '✅ 정지가 해제됐습니다');
}

// ── 모임 관리 ─────────────────────────────────────────────
async function loadMoims() {
  const data = await adminApi('moims');
  _moims = Array.isArray(data) ? data : [];
  renderMoims();
}

function filterMoims(filter, btn) {
  _moimFilter = filter;
  document.querySelectorAll('#tab-moims .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMoims();
}

function renderMoims() {
  const list = _moimFilter === 'all' ? _moims : _moims.filter(m => m.status === _moimFilter);
  if (!list.length) {
    document.getElementById('moims-list').innerHTML = '<div class="empty">모임 없음</div>';
    return;
  }
  const catIcon = { exercise:'🏋️', hobby:'🎨', study:'📚', game:'🎮', food:'🍜', travel:'✈️', social:'🤝' };
  document.getElementById('moims-list').innerHTML = list.map(m => {
    const isClosed = m.status === 'closed';
    const dateStr = m.gathering_date
      ? new Date(m.gathering_date).toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })
      : '-';
    const icon = catIcon[m.category] || '🤝';
    const spots = `${m.current_count || 0}/${m.max_count || '?'}명`;
    return `
      <div class="moim-row ${isClosed ? 'closed' : ''}" id="mr-${m.id}">
        <div class="moim-title-wrap">
          <span>${icon}</span>
          <span class="moim-title">${m.title || '(제목없음)'}</span>
          <span class="moim-status-badge ${isClosed ? 'ms-closed' : 'ms-open'}">${isClosed ? '마감' : '진행중'}</span>
          ${!m.is_public ? '<span style="font-size:10px;background:#FEF3C7;color:#D97706;padding:2px 7px;border-radius:5px;font-weight:800">비공개</span>' : ''}
        </div>
        <div class="moim-meta">${dateStr} · ${spots} · 주최 ${m.host_name || '-'}${m.host_phone ? ' (' + m.host_phone + ')' : ''}</div>
        ${m.location_name ? `<div class="moim-meta" style="margin-top:2px">📍 ${m.location_name}</div>` : ''}
        <div class="moim-actions">
          <button class="m-btn" style="background:#EFF6FF;color:#3B82F6" onclick="editMoim('${m.id}')">수정</button>
          ${isClosed
            ? `<button class="m-btn m-btn-open" onclick="toggleMoimStatus('${m.id}','open')">재오픈</button>`
            : `<button class="m-btn m-btn-close" onclick="toggleMoimStatus('${m.id}','closed')">강제마감</button>`}
          <button class="m-btn m-btn-delete" onclick="deleteMoimById('${m.id}')">삭제</button>
        </div>
      </div>`;
  }).join('');
}

function _meFeeToggle() {
  const v = document.getElementById('me-entryfee-type').value;
  document.getElementById('me-entryfee-amount').style.display = v === 'custom' ? 'block' : 'none';
}

function editMoim(id) {
  _editingMoimId = id;
  const m = _moims.find(m => m.id === id);
  if (!m) return;
  document.getElementById('me-title').value = m.title || '';
  document.getElementById('me-category').value = m.category || 'social';

  // 날짜·시간 분리
  if (m.gathering_date) {
    const dt = new Date(m.gathering_date);
    const pad = n => String(n).padStart(2, '0');
    document.getElementById('me-date').value =
      `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
    document.getElementById('me-time').value =
      `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
  } else {
    document.getElementById('me-date').value = '';
    document.getElementById('me-time').value = '';
  }

  document.getElementById('me-location').value = m.location_name || '';
  document.getElementById('me-description').value = m.description || '';
  document.getElementById('me-maxcount').value = m.max_count || 10;
  document.getElementById('me-gender').value = m.gender_req || 'any';
  document.getElementById('me-public').checked = !!m.is_public;

  // 참가비
  const fee = m.entry_fee ?? 0;
  const feeType = document.getElementById('me-entryfee-type');
  const feeAmt = document.getElementById('me-entryfee-amount');
  if (fee === -1) { feeType.value = '-1'; feeAmt.style.display = 'none'; }
  else if (fee > 0) { feeType.value = 'custom'; feeAmt.style.display = 'block'; feeAmt.value = fee; }
  else { feeType.value = '0'; feeAmt.style.display = 'none'; }

  document.getElementById('moim-edit-overlay').classList.add('show');
}

function closeMoimEdit() {
  document.getElementById('moim-edit-overlay').classList.remove('show');
  _editingMoimId = null;
}

async function saveMoimEdit() {
  if (!_editingMoimId) return;
  const title = document.getElementById('me-title').value.trim();
  if (!title) { showToast('제목을 입력해주세요'); return; }

  // 날짜·시간 합치기
  const dateVal = document.getElementById('me-date').value;
  const timeVal = document.getElementById('me-time').value || '00:00';
  const gathering_date = dateVal ? new Date(`${dateVal}T${timeVal}`).toISOString() : null;

  // 참가비
  const feeType = document.getElementById('me-entryfee-type').value;
  const entry_fee = feeType === '-1' ? -1
    : feeType === 'custom' ? (parseInt(document.getElementById('me-entryfee-amount').value) || 0)
    : 0;

  const updates = {
    id: _editingMoimId,
    title,
    category: document.getElementById('me-category').value,
    gathering_date,
    location_name: document.getElementById('me-location').value.trim(),
    description: document.getElementById('me-description').value.trim() || null,
    max_count: parseInt(document.getElementById('me-maxcount').value) || 10,
    entry_fee,
    gender_req: document.getElementById('me-gender').value,
    is_public: document.getElementById('me-public').checked,
  };
  await adminApi('update_moim', 'PATCH', updates);
  const m = _moims.find(m => m.id === _editingMoimId);
  if (m) Object.assign(m, updates);
  closeMoimEdit();
  renderMoims();
  showToast('✅ 모임이 수정됐습니다');
}

async function toggleMoimStatus(id, status) {
  const msg = status === 'closed' ? '이 모임을 강제 마감하겠습니까?' : '이 모임을 재오픈하겠습니까?';
  if (!confirm(msg)) return;
  await adminApi('close_moim', 'PATCH', { id, status });
  const m = _moims.find(m => m.id === id);
  if (m) m.status = status;
  renderMoims();
  document.getElementById('s-moims').textContent = _moims.filter(m => m.status === 'open').length;
  showToast(status === 'closed' ? '모임이 강제 마감됐습니다' : '✅ 모임이 재오픈됐습니다');
}

async function deleteMoimById(id) {
  const m = _moims.find(m => m.id === id);
  if (!confirm(`"${m?.title || '이 모임'}"을 완전히 삭제하겠습니까?\n삭제된 데이터는 복구되지 않습니다.`)) return;
  await adminApi('delete_moim', 'DELETE', { id });
  _moims = _moims.filter(m => m.id !== id);
  renderMoims();
  document.getElementById('s-moims').textContent = _moims.filter(m => m.status === 'open').length;
  showToast('모임이 삭제됐습니다');
}

// ── 관리자 설정 ───────────────────────────────────────────
function openSettings() {
  document.getElementById('settings-overlay').classList.add('show');
  // 현재 활성 탭 콘텐츠 로드
  if (document.getElementById('stab-admins').classList.contains('active')) {
    if (document.getElementById('settings-admin-list').innerHTML.includes('로딩')) loadAdminList();
  }
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('show');
}

function switchSettingsTab(name) {
  ['admins', 'categories'].forEach(t => {
    document.getElementById('stab-' + t).classList.toggle('active', t === name);
    document.getElementById('stab-content-' + t).style.display = t === name ? 'block' : 'none';
  });
  if (name === 'admins' && document.getElementById('settings-admin-list').innerHTML.includes('로딩')) loadAdminList();
  if (name === 'categories' && document.getElementById('settings-cat-list').innerHTML.includes('로딩')) loadCategoryList();
}

async function loadAdminList() {
  document.getElementById('settings-admin-list').innerHTML = '<div class="loading">로딩 중...</div>';
  const { data, error } = await db.from('app_admins').select('email').order('email');
  if (error) {
    document.getElementById('settings-admin-list').innerHTML = '<div class="empty">불러오기 실패</div>';
    return;
  }
  const myEmail = currentSession.user.email || currentSession.user.user_metadata?.email || '';
  const list = data || [];
  document.getElementById('settings-admin-list').innerHTML = list.length
    ? list.map(a => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f1f5f9">
          <div>
            <span style="font-size:14px;color:#1e293b;font-weight:600">${a.email}</span>
            ${a.email === myEmail ? '<span style="font-size:10px;background:#EFF6FF;color:#3B82F6;padding:1px 7px;border-radius:5px;font-weight:800;margin-left:6px">나</span>' : ''}
          </div>
          ${a.email !== myEmail
            ? `<button onclick="removeAdmin('${a.email}')"
                style="padding:5px 12px;background:#FEE2E2;color:#EF4444;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer">
                삭제
              </button>`
            : '<span style="font-size:11px;color:#cbd5e1">삭제 불가</span>'}
        </div>`).join('')
    : '<div class="empty" style="padding:16px 0">관리자 계정 없음</div>';
}

async function addAdmin() {
  const input = document.getElementById('new-admin-email');
  const email = input.value.trim().toLowerCase();
  if (!email || !email.includes('@')) { showToast('올바른 이메일을 입력하세요'); return; }
  const { error } = await db.from('app_admins').insert({ email });
  if (error) { showToast('추가 실패: ' + (error.message || '이미 등록된 이메일일 수 있습니다')); return; }
  input.value = '';
  loadAdminList();
  showToast('✅ 관리자가 추가됐습니다');
}

// ── 카테고리 관리 ─────────────────────────────────────────
let _categories = [];

async function loadCategoryList() {
  document.getElementById('settings-cat-list').innerHTML = '<div class="loading">로딩 중...</div>';
  const data = await adminApi('categories');
  _categories = (Array.isArray(data) ? data : []).filter(c => c.active !== false);
  renderCategoryList();
}

function renderCategoryList() {
  const el = document.getElementById('settings-cat-list');
  if (!_categories.length) {
    el.innerHTML = '<div class="empty" style="padding:16px 0">카테고리 없음</div>';
    return;
  }
  el.innerHTML = _categories.map((c, i) => `
    <div id="cat-row-${i}" style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f1f5f9">
      <span style="font-size:20px;width:28px;text-align:center;flex-shrink:0">${c.icon || '📋'}</span>
      <span style="flex:1;font-size:14px;font-weight:700;color:#1e293b">${c.name}</span>
      <button onclick="editCategoryRow(${i})"
        style="padding:5px 11px;background:#EFF6FF;color:#3B82F6;border:none;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer">수정</button>
      <button onclick="deleteCategoryByName('${c.name}')"
        style="padding:5px 11px;background:#FEE2E2;color:#EF4444;border:none;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer">삭제</button>
    </div>`).join('');
}

function editCategoryRow(i) {
  const c = _categories[i];
  const row = document.getElementById('cat-row-' + i);
  row.innerHTML = `
    <input id="edit-cat-icon-${i}" value="${c.icon || ''}" maxlength="4"
      style="width:44px;text-align:center;padding:8px 4px;border:1.5px solid #7C3AED;border-radius:8px;font-size:18px;outline:none;flex-shrink:0">
    <input id="edit-cat-name-${i}" value="${c.name}"
      style="flex:1;padding:8px 10px;border:1.5px solid #7C3AED;border-radius:8px;font-size:13px;outline:none"
      onkeydown="if(event.key==='Enter')saveCategoryEdit('${c.name}',${i})">
    <button onclick="saveCategoryEdit('${c.name}',${i})"
      style="padding:6px 11px;background:#7C3AED;color:#fff;border:none;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer">저장</button>
    <button onclick="renderCategoryList()"
      style="padding:6px 11px;background:#f1f5f9;color:#64748b;border:none;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer">취소</button>
  `;
  document.getElementById('edit-cat-name-' + i).focus();
}

async function saveCategoryEdit(origName, i) {
  const newIcon = document.getElementById('edit-cat-icon-' + i).value.trim();
  const newName = document.getElementById('edit-cat-name-' + i).value.trim();
  if (!newName) { showToast('카테고리명을 입력하세요'); return; }
  await adminApi('update_category', 'PATCH', { name: origName, newName, icon: newIcon || '📋' });
  _categories[i] = { ..._categories[i], name: newName, icon: newIcon || '📋' };
  renderCategoryList();
  showToast('✅ 수정됐습니다');
}

async function addCategory() {
  const icon = (document.getElementById('new-cat-icon').value.trim() || '📋');
  const name = document.getElementById('new-cat-name').value.trim();
  if (!name) { showToast('카테고리명을 입력하세요'); return; }
  if (_categories.find(c => c.name === name)) { showToast('이미 있는 카테고리입니다'); return; }
  const newOrder = Math.max(0, ..._categories.map(c => c.display_order || 0)) + 1;
  await adminApi('add_category', 'POST', { name, icon, display_order: newOrder });
  document.getElementById('new-cat-icon').value = '';
  document.getElementById('new-cat-name').value = '';
  loadCategoryList();
  showToast(`✅ '${name}' 카테고리가 추가됐습니다`);
}

async function deleteCategoryByName(name) {
  if (!confirm(`'${name}' 카테고리를 삭제하겠습니까?\n해당 카테고리의 기존 공고에는 영향을 주지 않습니다.`)) return;
  await adminApi('delete_category', 'PATCH', { name });
  _categories = _categories.filter(c => c.name !== name);
  renderCategoryList();
  showToast('카테고리가 삭제됐습니다');
}

async function removeAdmin(email) {
  if (!confirm(`"${email}" 계정을 관리자에서 제거하겠습니까?`)) return;
  const { error } = await db.from('app_admins').delete().eq('email', email);
  if (error) { showToast('삭제 실패: ' + error.message); return; }
  loadAdminList();
  showToast('관리자 계정이 제거됐습니다');
}

// ── 공통 ─────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2500);
}

async function doLogout() {
  await db.auth.signOut();
  location.href = '/login.html';
}
</script>
